  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    font-family:'AppCond','Arial Narrow','Liberation Sans Narrow',system-ui,sans-serif;
    font-stretch:condensed; background:#0a0a0a; color:#fff;
    -webkit-font-smoothing:antialiased; overscroll-behavior:none;
    height:100%; overflow:hidden;
  }
  .app {
    max-width:440px; width:100%; margin:0 auto; display:flex; flex-direction:column;
    height:100vh; height:100dvh; background:#141414;
    padding-top:env(safe-area-inset-top); overflow:hidden;
  }
  #body { flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  .hdr,.prev,.chips,.bot { flex:0 0 auto; }
  @media (min-width:700px) and (pointer:fine) {
    body { background:#050505; display:flex; justify-content:center; align-items:center; }
    .app { height:min(900px, calc(100vh - 40px)); border-radius:20px; border:1px solid #2a2a2a; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  }
  .rotate { display:none; position:fixed; inset:0; z-index:999; background:#0a0a0a;
    flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; }
  .rotate .ico { font-size:60px; margin-bottom:20px; }
  .rotate .msg { font-size:19px; font-weight:700; line-height:1.4; color:#ff9500; }
  @media (orientation:landscape) and (max-height:520px) and (pointer:coarse) {
    .rotate { display:flex; } .app { display:none; }
  }

  .hdr { background:#1c1c1c; padding:14px 16px; border-bottom:1px solid #2e2e2e; display:flex; align-items:center; gap:10px; }
  .hdr-btn { font-size:26px; color:#ff9500; cursor:pointer; line-height:1; padding:2px 6px; }
  .hdr-btn.hidden { visibility:hidden; }
  .hdr-btn.gear { font-size:20px; }
  .hdr-txt { flex:1; min-width:0; }
  .hdr-step { font-size:11px; color:#ff9500; letter-spacing:1.4px; text-transform:uppercase; font-weight:700; }
  .hdr-title { font-size:20px; font-weight:700; margin-top:1px; line-height:1.15; }

  .prev { background:#131313; border-bottom:1px solid #262626; }
  .prev-bar { padding:11px 16px; display:flex; align-items:center; gap:8px; cursor:pointer;
    font-size:12.5px; font-weight:700; color:#ff9500; text-transform:uppercase; letter-spacing:1px; }
  .prev-bar .caret { margin-left:auto; font-size:14px; transition:transform .2s; color:#888; }
  .prev-bar.open .caret { transform:rotate(180deg); }
  .prev-body { display:none; padding:0 16px 12px; max-height:46vh; overflow-y:auto; }
  .prev-body.open { display:block; }
  .prev-row { display:flex; justify-content:space-between; gap:10px; padding:6.5px 0; border-bottom:1px solid #232323; font-size:13.5px; }
  .prev-row:last-child { border-bottom:none; }
  .prev-row .pk { color:#8a8a8a; font-weight:500; }
  .prev-row .pv { color:#fff; font-weight:700; text-align:right; }
  .prev-row .pv.empty { color:#4a4a4a; font-weight:400; font-style:italic; }
  .prev-row .pv.calc { color:#6cbf6c; }
  .prev-row .pv.warn { color:#ffb340; }
  .prev-row .pv.bad  { color:#ff6b5e; }
  .ndlist { background:#181818; border-bottom:1px solid #262626; padding:4px 0 8px; }
  .ndlist .ndh { padding:11px 16px 6px; font-size:12px; color:#ff9500; text-transform:uppercase;
    letter-spacing:1.1px; font-weight:700; }
  .ndopt { display:flex; align-items:center; gap:12px; padding:12px 16px 12px 30px;
    border-bottom:1px solid #212121; cursor:pointer; min-height:52px; }
  .ndopt:last-child { border-bottom:none; }
  .ndopt:active { background:#232323; }
  .ndopt .radio { width:20px; height:20px; border:2px solid #555; border-radius:50%;
    flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .ndopt.sel .radio { border-color:#ff9500; background:#ff9500; }
  .ndopt.sel .radio::after { content:''; width:8px; height:8px; border-radius:50%; background:#000; }
  .ndopt .nn { font-size:15.5px; font-weight:600; color:#ddd; }
  .ndopt.sel .nn { color:#fff; font-weight:700; }
  .ndopt .nd2 { font-size:12px; color:#7d7d7d; margin-top:2px; }
  .ndcustom { padding:10px 16px 12px 30px; display:flex; align-items:center; gap:10px; }
  .ndcustom input { width:74px; padding:9px 8px; font-family:inherit; font-size:16px; font-weight:700;
    text-align:center; background:#0f0f0f; color:#fff; border:1px solid #3a3a3a; border-radius:8px; }
  .ndcustom input:focus { outline:none; border-color:#ff9500; }
  .ndcustom label { font-size:14px; color:#bbb; flex:1; }
  .ndsec { display:flex; align-items:center; gap:9px; padding:13px 16px; cursor:pointer;
    border-bottom:1px solid #212121; background:#1d1d1d; }
  .ndsec:active { background:#262626; }
  .ndsec .arw { color:#ff9500; font-size:13px; transition:transform .18s; display:inline-block; }
  .ndsec.open .arw { transform:rotate(90deg); }
  .ndsec .sn { font-size:15.5px; font-weight:700; color:#ddd; flex:1; }
  .ndcount { background:#ff9500; color:#000; font-size:11.5px; font-weight:800;
    min-width:20px; height:20px; border-radius:10px; display:flex; align-items:center;
    justify-content:center; padding:0 6px; }
  .ndopt .radio { width:20px; height:20px; border:2px solid #555; border-radius:50%;
    flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .ndopt.sel .radio { border-color:#ff9500; background:#ff9500; }
  .ndopt.sel .radio::after { content:''; width:8px; height:8px; border-radius:50%; background:#000; }
  .ndopt .check { width:20px; height:20px; border:2px solid #555; border-radius:5px;
    flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .ndopt.sel .check { border-color:#ff9500; background:#ff9500; }

  /* ── заставка ── */
  #splash {
    position:fixed; inset:0; z-index:900; cursor:pointer;
    background:linear-gradient(180deg,#101f38 0%,#0a1526 42%,#050a12 74%,#000 100%);
    display:flex; align-items:center; justify-content:center;
    transition:opacity .45s ease; opacity:1;

  #splash.gone { opacity:0; pointer-events:none; }
  /* приблизительная рамка по краю экрана — точную границу физического экрана
     из CSS не узнать (разрешения разные), поэтому просто небольшой отступ
     от края вьюпорта + запас под «чёлку»/скруглённые углы там, где есть */
  .phone-frame {
    position:fixed;
    top:max(10px, env(safe-area-inset-top));
    bottom:max(10px, env(safe-area-inset-bottom));
    left:50%;
    transform:translateX(-50%);
    /* на телефоне viewport и есть экран телефона — рамка просто держит отступ
       от его края; на мониторе привязываемся к той же ширине, что и у
       самого приложения (карточка 440px), а не ко всему окну браузера */
    width:min(calc(100% - 20px), 420px);
    border:3px solid #ffc72c;
    border-radius:26px;
    opacity:.9;
    pointer-events:none;
    box-shadow:0 0 14px rgba(255,199,44,.35);
  }
  @media (min-width:700px) and (pointer:fine) {
    /* тот же брейкпоинт, что превращает .app в «карточку телефона» —
       рамка теперь тоже по высоте держится этой карточки, а не всего окна */
    .phone-frame {
      top:50%; bottom:auto;
      transform:translate(-50%,-50%);
      height:min(880px, calc(100vh - 60px));
    }
  }

const SYNC_SPEED = 1/160;

/* ═════ студийный свет: Key + до 3 источников, чисто ручной расчёт, отдельно от computeExposure() ═════ */
function studioRoles(){
  const n = sel.stN;
  if(n<=1) return ['key'];
  if(n===2) return ['key', sel.stSecond==='rim'?'rim':'fill'];
  if(n===3) return ['key','fill','rim'];
  return ['key','fill','rim','bg'];
}
function studioEv(role){
  if(role==='fill') return sel.stEvFill;
  if(role==='rim')  return sel.stEvRim;
  if(role==='bg')   return sel.stEvBg;
  return 0;
}
function studioEvSet(role,v){
  const n = isNaN(parseFloat(v)) ? 0 : Math.max(-3,Math.min(3,parseFloat(v)));
  if(role==='fill') sel.stEvFill=n; else if(role==='rim') sel.stEvRim=n; else if(role==='bg') sel.stEvBg=n;
}
function computeStudio(){
  if(sel.mode!=='photo' || !sel.gear.includes('studioLight')) return null;
  const N = parseFloat(sel.stAp)||8, iso = parseInt(sel.stIso,10)||100;
  const groups = studioRoles().map(role=>({role, ev: role==='key'?0:studioEv(role)}));
  return { t:SYNC_SPEED, N, iso, groups, curt:sel.stCurt };
}

function fitGear(id){
  const L=sel.lighting, S=sel.subject;
  const dark = ['dusk','night-street','night-dark','indoor-lamp'].includes(L);
  const bright = ['sun-hard','sun-soft','partly','bright-cloud'].includes(L);
  const vid = ['talking','walk'].includes(S);
  switch(id){
    case 'nd':      return bright || L==='overcast';
    case 'tripod':  return dark || L==='studio' || ['landscape','architecture','detail','macro','night-sky','talking'].includes(S);
    case 'gimbal':  return vid;
    case 'mic':     return vid;
    case 'light':   return dark || L==='studio' || L==='indoor-window';
    case 'flash':   return !vid && (dark || L==='studio' || bright);
    case 'studioLight': return L==='studio';
    case 'monitor': return true;   /* монитор нужен и для фото, и для видео */
    default:        return true;
  }
}
function fitSubj(id){

  return !f || f.includes(id);
}

const AP_SERIES  = [1.0,1.2,1.4,1.8,2,2.2,2.5,2.8,3.2,3.5,4,4.5,5,5.6,6.3,7.1,8,9,10,11,13,14,16,18,20,22];
const ISO_SERIES = [100,125,160,200,250,320,400,500,640,800,1000,1250,1600,2000,2500,3200,4000,5000,6400,8000,10000,12800,16000,20000,25600,32000];
const SH_SERIES  = [1/8000,1/6400,1/5000,1/4000,1/3200,1/2500,1/2000,1/1600,1/1250,1/1000,1/800,1/640,1/500,1/400,1/320,1/250,1/200,1/160,1/125,1/100,1/80,1/60,1/50,1/40,1/30,1/25,1/20,1/15,1/13,1/10,1/8,1/6,1/5,1/4,1/3,0.4,0.5,0.6,0.8,1,1.3,1.6,2,2.5,3.2,4,5,6,8,10,13,15,20,25,30];

function stops(n){
  if(appLang==='en') return n+' stops';
  if(appLang==='es'){ const r=Math.round(n*10)/10; return r+(Math.abs(r)===1?' paso':' pasos'); }
  const r=Math.round(n*10)/10;
  if(!Number.isInteger(r)) return r+' стопа';
  const a=Math.abs(r)%100, b=a%10;
  if(a>10&&a<20) return r+' стопов';
  if(b===1) return r+' стоп';
  if(b>=2&&b<=4) return r+' стопа';
  return r+' стопов';
}
const nearest = (arr,v) => arr.reduce((p,c)=>Math.abs(c-v)<Math.abs(p-v)?c:p);
const ceilIn   = (arr,v) => arr.find(x=>x>=v) ?? arr[arr.length-1];
const evScene  = (ev100,iso) => ev100 + Math.log2(iso/100);
const reqAp    = (ev100,iso,t) => Math.sqrt(t * Math.pow(2, evScene(ev100,iso)));
const calcShut = (ev100,iso,N) => (N*N) / Math.pow(2, evScene(ev100,iso));
const fmtShut  = t => t>=1 ? (Math.round(t*10)/10)+'s' : '1/'+Math.round(1/t);
function ambientK(){
  const L=L_(); if(!L) return 5600;
  const m=String(val(L.wb)).match(/(\d{4})/g);
  if(!m) return 5600;
  return m.length>1 ? Math.round((+m[0]+ +m[1])/2) : +m[0];
}
function ledSpec(){
  if(!sel.gear.includes('light')) return null;
  if(sel.ledKind==='fix'){
    if(sel.ledFix==='kcust'){ const k=parseFloat(ledCustom.k); return isNaN(k)?null:{fixed:true,k}; }
    const o=LED_FIX.find(x=>x.id===sel.ledFix); return o&&o.k?{fixed:true,k:o.k}:null;
  }
  if(sel.ledVar==='vcust'){
    const a=parseFloat(ledCustom.min), b=parseFloat(ledCustom.max);
    return (isNaN(a)||isNaN(b))?null:{fixed:false,min:a,max:b};
  }
  const o=LED_VAR.find(x=>x.id===sel.ledVar);
  return o&&o.min?{fixed:false,min:o.min,max:o.max}:null;
}
function gelFor(fromK,toK){
  const ru=appLang==='ru';
  const d=toK-fromK;
  if(Math.abs(d)<350) return null;
  const warm=[[-2400,'CTO',ru?'полный CTO':'full CTO'],[-1700,'1/2 CTO',ru?'половинный CTO':'half CTO'],[-1000,'1/4 CTO',ru?'четвертной CTO':'quarter CTO']];
  const cool=[[2400,'CTB',ru?'полный CTB':'full CTB'],[1100,'1/2 CTB',ru?'половинный CTB':'half CTB'],[500,'1/4 CTB',ru?'четвертной CTB':'quarter CTB']];
  const set = d<0?warm:cool;
  let best=set[0];
  for(const c of set) if(Math.abs(Math.abs(c[0])-Math.abs(d))<Math.abs(Math.abs(best[0])-Math.abs(d))) best=c;
  return best[1];
}
function fpsObj(){ return FPS_OPTS.find(f=>f.fps===sel.fps) || FPS_OPTS[0]; }
function angleObj(){ return ANGLE_OPTS.find(a=>a.mul===sel.angle) || ANGLE_OPTS[0]; }
function vidShutter(){ return nearest(SH_SERIES, 1/(sel.fps*sel.angle)); }

/* aperture the lens can actually give — widest end used as the limit */
function lensWidest(L){ return L ? Math.min(L.a[0],L.a[1]) : 1.0; }
function lensFocalForCalc(L){ return L ? L.f[1] : 50; }   // tele end = worst case for handheld

function computeExposure(){
  const L=L_(), S=S_(), P=P_(), LN=lensObj();
  if(!L||!S||!P) return null;
  const v=isVideo();
  const widest = LN ? lensWidest(LN) : null;

  let N = S.apT, apLimited=false;
  if (widest && N < widest){ N = widest; apLimited = true; }
  N = nearest(AP_SERIES, N);
  const Ntarget = N;

  const r = { N, Ntarget, apLimited, widest, video:v, nd:null, combo:null,
              apForced:false, apImpossible:false, isoHigh:false, isoOver:false, shutOver:false };

  if (v) {
    const tBase = vidShutter();
    let iso = P.baseIso;
    const need = 2*Math.log2(reqAp(L.ev, iso, tBase) / N);   // stops of light to kill at target aperture
    r.needStops = need;

    const combo = bestCombo(need);
    r.combo = combo;
    r.nd = combo ? {min:combo.min, max:combo.max} : null;

    if (!combo) {
      r.ndApplied = 0;
      if (need > 0.4) {
        r.shortfall = need;
        const Nn = ceilIn(AP_SERIES, N * Math.pow(2, need/2));
        if (Nn > 16) { r.apImpossible = true; r.N = 16; } else { r.N = Nn; }
        r.apForced = true;
      } else if (need < -0.4) {
        r.isoUp = ceilIn(ISO_SERIES, Math.min(iso*Math.pow(2,-need), 25600));
        if (r.isoUp >= 12800) r.isoOver = true;
      }
    } else {
      const applied = Math.min(Math.max(need, combo.min), combo.max);
      r.ndApplied = applied;
      if (combo.variable) r.vndDial = Math.max(0, Math.round((applied - combo.fixAdd)*10)/10);
      const residual = need - applied;
      r.residual = residual;
      if (residual > 0.4) {
        r.shortfall = residual;
        const Nn = ceilIn(AP_SERIES, N * Math.pow(2, residual/2));
        if (Nn > 16) { r.apImpossible = true; r.N = 16; } else { r.N = Nn; }
        r.apForced = true;
      } else if (residual < -0.4) {
        let Nn = N * Math.pow(2, residual/2);
        if (widest && Nn < widest) {
          const stillDark = 2*Math.log2(widest/Nn);
          Nn = widest;
          r.isoUp = ceilIn(ISO_SERIES, Math.min(iso*Math.pow(2,stillDark), 25600));
          if (r.isoUp >= 12800) r.isoOver = true;
        }
        r.N = nearest(AP_SERIES, Nn);
        r.apForced = true;
      }
    }
    r.t = tBase; r.iso = iso;

  } else if (S.id === 'night-sky') {
    /* звёзды: выдержку задаёт правило 500, диафрагму открываем, ISO добирает экспозицию */
    const focal = LN ? LN.f[0] : 20;
    const tStar = Math.min(30, 500/(focal*CROP));
    const below = SH_SERIES.filter(x=>x<=tStar);
    r.t = below.length ? below[below.length-1] : SH_SERIES[SH_SERIES.length-1];
    r.N = widest ? nearest(AP_SERIES, widest) : N;
    r.starRule = tStar;
    r.astro = true;
    r.ndApplied = 0;
    const need = 2*Math.log2(reqAp(L.ev, 100, r.t) / r.N);
    r.iso = ceilIn(ISO_SERIES, Math.min(100*Math.pow(2,-need), 25600));
    r.isoHigh = r.iso >= 3200;
    r.isoOver = r.iso >= 12800;
    r.tooSlow = true;                      // с рук невозможно в принципе
    r.handRule = 1/(focal*CROP);
  } else {
    let iso = Math.max(P.baseIso, L.isoMin);
    const focal = lensFocalForCalc(LN);
    const handRule = 1/(focal*CROP);
    r.handRule = handRule;

    r.ndApplied = 0;
    let t = (N*N) / Math.pow(2, L.ev + Math.log2(iso/100));

    // too bright for the shutter ceiling? fit a filter, or stop down
    if (t < 1/8000) {
      const over = Math.log2((1/8000)/t);           // stops beyond the ceiling
      const combo = bestCombo(over);
      r.combo = combo;
      if (combo) {
        const applied = Math.min(Math.max(over, combo.min), combo.max);
        r.ndApplied = applied;
        if (combo.variable) r.vndDial = Math.max(0, Math.round((applied - combo.fixAdd)*10)/10);
        t = t * Math.pow(2, applied);
      }
      if (t < 1/8000) {
        const still = Math.log2((1/8000)/t);
        const Nn = ceilIn(AP_SERIES, N * Math.pow(2, still/2));
        if (Nn > 16) { r.apImpossible = true; r.N = 16; t = 1/8000; }
        else { r.N = Nn; t = t * Math.pow(2, still); }
        r.apForced = true;
        r.shutOver = true;
      }
    }

    // too slow to hand-hold? lift ISO in steps
    let guard=0;
    while (t > handRule && iso < 12800 && guard++ < 40) {
      iso = ISO_SERIES[Math.min(ISO_SERIES.indexOf(nearest(ISO_SERIES,iso))+1, ISO_SERIES.length-1)];
      t = (r.N*r.N) / Math.pow(2, (L.ev - r.ndApplied) + Math.log2(iso/100));
    }
    if (r.ndApplied > 0.4) t = (r.N*r.N) / Math.pow(2, (L.ev - r.ndApplied) + Math.log2(iso/100));
    r.iso = nearest(ISO_SERIES, iso);
    r.t   = nearest(SH_SERIES, t);
    r.tooSlow  = r.t > handRule*1.3;
    r.isoHigh  = r.iso >= 3200;
    r.isoOver  = r.iso >= 12800;
  }
  return r;
}

function computeParams(){
  const L=L_(),S=S_(),P=P_(),LN=lensObj(),v=isVideo(),p={},E=computeExposure();
  p[t().p.profile]= P?txt(P,0):null;
  p[t().p.lens]   = lensName();
  p[t().p.eqf]    = LN ? (LN.f[0]===LN.f[1] ? Math.round(LN.f[0]*CROP)+' мм' : Math.round(LN.f[0]*CROP)+'–'+Math.round(LN.f[1]*CROP)+' мм') : null;
  p[t().p.format] = (v&&sel.profile!=='raw-photo')
      ? 'XAVC S 4K '+sel.fps+'p '+fpsObj().mbps+'M'
      : (sel.profile==='raw-photo'?'RAW + JPEG':null);
  p[t().p.shutter]= E?fmtShut(E.t):null;
  p[t().p.ap]     = E?('f/'+E.N):(S?S.apR:null);
  p[t().p.iso]    = E?(E.isoUp?E.isoUp:E.iso):null;
  p[t().p.wb]     = L?val(L.wb):null;
  p[t().p.zebra]  = L?L.zebra:null;
  p[t().p.nd]     = E ? (E.ndApplied>0.4
      ? stops(E.ndApplied) + (E.combo? ' · '+comboLabel(E.combo) : '')
      : (hasFilters()? (appLang==='ru'?'есть, не нужен':'fitted, not needed') : t().noNd)) : null;
  p[t().p.hand]   = (E&&!E.video&&E.handRule) ? fmtShut(nearest(SH_SERIES,E.handRule)) : null;
  p[t().p.focus]  = S?val(S.focus):null;
  p[t().p.area]   = S?areaFor(S):null;
  p[t().p.stab]   = S?(sel.gear.includes('tripod')?t().off:(sel.gear.includes('gimbal')?t().stdStab:val(S.stab))):null;
  const g=sel.gear.filter(x=>x!=='none').map(id=>txt(GEAR.find(x=>x.id===id),0));
  p[t().p.gear]   = sel.gear.length?(sel.gear.includes('none')?t().noGear:g.join(', ')):null;
  return p;
}

function renderPreview(){
  const el=document.getElementById('prev');

  el.style.display='block';

  document.getElementById('prevBar').className='prev-bar'+(prevOpen?' open':'');
  const b=document.getElementById('prevBody');
  b.className='prev-body'+(prevOpen?' open':'');
  const E=computeExposure();
  b.innerHTML=Object.entries(computeParams()).map(([k,v])=>{
    let cls = v?'':'empty';
    if(v && E && (k===t().p.shutter||k===t().p.ap||k===t().p.iso||k===t().p.nd||k===t().p.hand)) cls='calc';
    if(v && E && k===t().p.ap)      cls = E.apImpossible?'bad' : (E.apForced||E.apLimited)?'warn' : cls;
    if(v && E && k===t().p.iso)     cls = E.isoOver?'bad' : (E.isoUp||E.isoHigh)?'warn' : cls;
    if(v && E && k===t().p.shutter) cls = E.shutOver?'bad' : E.tooSlow?'warn' : cls;
    return `<div class="prev-row"><span class="pk">${k}</span><span class="pv ${cls}">${v||t().notSet}</span></div>`;
  }).join('');

/* ── filters actually in the bag ── */
function myVnds(){
  return sel.ndVario.map(id=>{
    if(id==='v-cust'){
      const a=parseFloat(vndCustom.min), b=parseFloat(vndCustom.max);
      if(isNaN(b)) return null;

    }
    const o=VND_OPTS.find(x=>x.id===id);
    return o ? { id, min:o.min, max:o.max, nm:o.nm||txt(o,0) } : null;
  }).filter(Boolean);
}
function myFixed(){ return sel.ndFixed.map(id=>FIX_OPTS.find(f=>f.id===id)).filter(Boolean); }
function hasFilters(){ return sel.gear.includes('nd') && (myVnds().length||myFixed().length); }

/* subsets of fixed filters up to n elements */
function subsetsOf(arr,n){
  const out=[[]];
  const rec=(start,cur)=>{ if(cur.length>=n) return;
    for(let i=start;i<arr.length;i++){ const nx=[...cur,arr[i]]; out.push(nx); rec(i+1,nx); } };
  rec(0,[]);
  return out;
}

/* pick the best filter combination for the required number of stops */
function bestCombo(need){
  if(!hasFilters()) return null;
  const vnds=myVnds(), fixs=myFixed(), cands=[];
  const fsubs=subsetsOf(fixs,3);
  for(const fs of fsubs){
    if(!fs.length) continue;
    const sum=fs.reduce((a,b)=>a+b.st,0);
    cands.push({min:sum,max:sum,parts:fs.map(x=>x.nm),n:fs.length,variable:false});
  }
  for(const v of vnds){
    for(const fs of fsubs){
      if(fs.length>2) continue;
      const add=fs.reduce((a,b)=>a+b.st,0);
      cands.push({min:v.min+add,max:v.max+add,parts:[v.nm,...fs.map(x=>x.nm)],
                  n:1+fs.length,variable:true,vnd:v,fixAdd:add});
    }
  }
  if(!cands.length) return null;
  const fits=cands.filter(c=>need>=c.min-0.15&&need<=c.max+0.15);
  if(fits.length){
    fits.sort((a,b)=> a.n-b.n || (b.variable?1:0)-(a.variable?1:0) || (a.max-a.min)-(b.max-b.min));
    return {...fits[0], exact:true};
  }
  /* nothing covers it — return the closest reachable */
  cands.sort((a,b)=>{
    const da = need>a.max ? need-a.max : a.min-need;
    const db = need>b.max ? need-b.max : b.min-need;
    return da-db || a.n-b.n;
  });
  return {...cands[0], exact:false};
}
function comboLabel(c){
  if(!c) return null;
  return c.parts.join(' + ');
}

const FIXED_ND=[{f:'ND2',st:1},{f:'ND4',st:2},{f:'ND8',st:3},{f:'ND16',st:4},
                {f:'ND32',st:5},{f:'ND64',st:6},{f:'ND256',st:8},{f:'ND1000',st:10}];
function suggestStack(shortfall){
  const pick = FIXED_ND.find(x=>x.st>=shortfall-0.15) || FIXED_ND[FIXED_ND.length-1];
  return pick;
}
function ndLabel(){
  const r=ndRange(); if(!r) return null;
  return r.min===r.max ? stops(r.max) : r.min+'–'+stops(r.max);
}

        gr.role==='key' ? (ru?'0 EV (опорный)':'0 EV (reference)') : ((gr.ev>0?'+':'')+gr.ev+' EV'),
        ''
      ]);
      out.push({type:'calc', rows, warn:'', bad:'',
        note: ru?'Собственный расчёт для студийного света (Manual) — не связан с расчётом по окружающему освещению выше.'
                :'Dedicated Manual studio-light recipe — independent of the ambient-light calculation above.'});
      out.push({type:'menu',crumb:[cm('menu'),cm('shooting'),cm('expColor')],
        rows:[row('shutter', fmtShut(stC.t), {ok:true,hot:true}), row('iso', String(stC.iso), {ok:true}), row('aperture','f/'+stC.N,{ok:true})],
        hint: ru?`Затвор зафиксирован на пределе синхронизации A6700 — ${fmtShut(SYNC_SPEED)}. Быстрее нельзя: шторка перекроет часть кадра.`
                :`Shutter fixed at the A6700 sync limit — ${fmtShut(SYNC_SPEED)}. Any faster and the shutter curtain cuts part of the frame.`});
      out.push({type:'menu',crumb:[cm('menu'),cm('shooting'), ru?'Вспышка':'Flash'],
        rows:[{n:ru?'Режим':'Mode', v: ru?'Ручной (M)':'Manual (M)', ok:true, hot:true},
              {n:ru?'Синхронизация':'Sync', v: stC.curt==='rear'?(ru?'По второй шторке':'Rear curtain'):(ru?'По первой шторке':'First curtain'), ok:true}],
        hint: ru?'Мощность каждой головы/вспышки выставляется на самой голове (или с пульта радиосинхронизатора) — под нужный EV-сдвиг относительно Key из расчёта выше.'
                :'Set each head/flash power on the unit itself (or via a radio trigger) to hit the EV offset relative to Key from the recipe above.',
        note: ru?'Пункт «Вспышка» на A6700 показан обобщённо — конкретные пункты зависят от способа подключения студийного света (X-sync разъём, радиосинхронизатор, оптический слейв через встроенную вспышку).'
                :'The “Flash” item is a generalisation on the A6700 — the exact items depend on how the studio light is triggered (X-sync port, radio trigger, optical slave off the built-in flash).'});
    }
  }

  if(g.includes('tripod')) out.push({type:'phys',t:ru?'Съёмка со штатива':'Tripod shooting',
    i:ru?'Проверьте что стабилизация отключена и камера закреплена':'Check stabilisation is off and the camera is locked down',
    h:ru?'Для длинных выдержек используйте автоспуск или пульт':'For long exposures use the self-timer or a remote'});

  if(g.includes('gimbal')) out.push({type:'phys',t:ru?'Балансировка гимбала':'Gimbal balancing',
    i:ru?'Отбалансируйте: наклон, крен, панорама — в этом порядке':'Balance: tilt, roll, pan — in that order',
    h:ru?'Балансировать с установленным фильтром и полностью собранной камерой':'Balance with the filter fitted and the rig fully assembled'});

  out.push({type:'menu',crumb:[cm('menu'),cm('shooting'),cm('shootMode')],
    rows:[row('regMode', scenMR() ? '→ '+scenMR() : '→ 1 / 2 / 3 / M1–M4',{ok:true,hot:true})],
    hint:ru?'Вызов — верхний диск камеры в положение 1, 2 или 3':'Recall with the top dial at 1, 2 or 3'});

  /* Физические действия не требуют хождения по меню — собираем их на один экран */
  const physList = out.filter(x=>x.type==='phys');
  if(physList.length>1){
    const at = out.findIndex(x=>x.type==='phys');
    const rest = out.filter(x=>x.type!=='phys');
    rest.splice(at,0,{type:'physgroup',items:physList});
    return rest;
  }
  return out;
}

function renderSteps(){
  if(!steps || !steps.length){ steps = buildSteps(); }
  if(!steps.length){ page = NSCR-1; renderPicker(); return; }
  if(stepIdx < 0) stepIdx = 0;
  if(stepIdx > steps.length-1) stepIdx = steps.length-1;
  const st=steps[stepIdx];
  document.getElementById('hdrStep').textContent=t().setupTitle;
  document.getElementById('hdrTitle').textContent=t().stepN(stepIdx+1,steps.length);
  renderPreview(); renderChips();
  const dots=steps.map((_,i)=>`<div class="dotw" onclick="jumpStep(${i})"><div class="dot ${i<stepIdx?'done':i===stepIdx?'now':''}"></div></div>`).join('');
  document.querySelector('.hdr').classList.add('slim');
  let h=`<div class="prog"><div class="prog-t">${t().doOnCam}</div><div class="dots">${dots}</div></div>`;
  if(st.type==='physgroup'){
    h+=`<div class="pcard"><div class="pt">⚙ ${appLang==='ru'?'Приготовьте камеру':'Set up the camera'}</div>`
      + st.items.map(x=>`<div style="margin-top:12px"><div class="pi">${x.t} — ${x.i}</div>`
          + (x.h?`<div class="ph">${x.h}</div>`:'') + `</div>`).join('')
      + `</div>`;
    h+=`<div class="hint">${appLang==='ru'
        ?'Всё это делается руками, без меню. Сделайте и переходите дальше — дальше пойдут настройки по меню'
        :'All of this is done by hand, no menu involved. Do it and move on — the menu settings come next'}</div>`;
  } else if(st.type==='phys'){
    h+=`<div class="pcard"><div class="pt">⚙ ${st.t}</div><div class="pi">${st.i}</div><div class="ph">${st.h}</div></div>`;
  } else if(st.type==='calc'){
    h+=`<div class="ccard"><div class="ct">∑ ${t().calcH}</div>`+
       st.rows.map(([k,v,c])=>`<div class="crow"><span class="ck">${k}</span><span class="cv ${c||''}">${v}</span></div>`).join('')+
       (st.warn?`<div class="cwarn">${st.warn}</div>`:'')+
       (st.bad?`<div class="cbad">${st.bad}</div>`:'')+`</div>`;
  } else {
    h+=renderMenuCard(st);

  document.getElementById('body').innerHTML=h;
  const bot=document.getElementById('bot'); bot.style.display='flex';
  bot.innerHTML=`<button class="btn btn-sec" onclick="navBack()">${t().back}</button>`
    + (st.nav ? '' : `<button class="btn ${stepIdx===steps.length-1?'btn-ok':'btn-pri'}" onclick="goNext()">
      ${stepIdx===steps.length-1?t().finish:t().nextStep}</button>`);
}

/* меньше нажатий: соседние экраны с одинаковым путём — в один; расчёт экспозиции — в экран экспозиции */
function compactSteps(list){
  list = list.slice(); const out = [];
  const same = (p,q)=>p.crumb.join('>')===q.crumb.join('>');
  const cat = (a,b)=>[a,b].filter(Boolean).join('<br><br>') || null;
  for(let i=0;i<list.length;i++){
    const st = list[i];
    if(st.type==='calc' && list[i+1] && list[i+1].type==='menu'){ list[i+1] = Object.assign({}, list[i+1], {calc:st}); continue; }
    const p = out[out.length-1];
    if(p && p.type==='menu' && st.type==='menu' && !p.nav && !st.nav && same(p,st)){
      out[out.length-1] = Object.assign({}, p, {rows:[...p.rows, ...st.rows], hint:cat(p.hint,st.hint),
        tip:cat(p.tip,st.tip), note:cat(p.note,st.note), calc:p.calc||st.calc});
      continue;
    }
    out.push(st);
  }
  /* одна и та же страница дважды (переход в Log + формат/частота) — всё на первом заходе */
  for(let i=0;i<out.length;i++){
    const nv = out[i]; if(nv.type!=='menu' || !nv.nav) continue;
    const j = out.findIndex((q,x)=>x>i && q.type==='menu' && !q.nav && same(nv,q));
    if(j<0) continue;
    const q = out[j], rows = nv.rows.map(r=>Object.assign({},r));
    q.rows.forEach(r=>{
      const at = rows.findIndex(x=>x.k && x.k===r.k);
      if(at>=0) rows[at] = Object.assign({}, rows[at], {v:r.v, ok:r.ok});
      else { const h = rows.findIndex(x=>x.hot); rows.splice(h<0?rows.length:h, 0, Object.assign({}, r, {hot:false})); }
    });
    out[i] = Object.assign({}, nv, {rows, hint:cat(nv.hint,q.hint), note:cat(nv.note,q.note)});
    out.splice(j,1);
  }
  return out;
}

  if(st.calc){

/* ВАРИАНТ A: нажали шаг пути — что внутри него, куда идти дальше */
function openLevel(i){
  const st = steps[stepIdx], cr = st.crumb, ru = appLang==='ru', col = iconFor(cr).c;
  const node = TREE[KEY_OF(cr[i])];
  const nm = String(cr[i]).split('|')[0];
  const last = i===cr.length-1;
  const cur = last ? st.rows.map(r=>r.k).filter(Boolean) : [KEY_OF(cr[i+1])];
  let body;
  if(!node){
    body = `<div class="sh-gap">${ru?'Для этого уровня в приложении пока нет данных — нужен скрин этой страницы меню.':'No data for this level yet — a screenshot of this menu page is needed.'}</div>`;
  } else {
    body = node.kids.map((kd,j)=>{
      const key = typeof kd==='string' ? kd : null;
      const name = key ? cm(key) : kd[camLang];
      if(!name) return '';
      const isCur = key && cur.includes(key);
      const num = node.nums ? `<span class="sh-num" style="background:${col}">${node.nums[j]}</span>` : '';
      const rv = (isCur && last) ? (st.rows.find(r=>r.k===key)||{}).v : null;
      const tag = isCur ? (last ? `<span class="val">${rv||''}</span>` : `<span class="go">›</span>`)
                : (key && UNCONF.has(key)) ? `<span class="tag unc">${ru?'не сверено':'unverified'}</span>` : '';
      return `<div class="sh-i ${isCur?'cur':''}">${num}<span>${name}</span>${tag}</div>`;
    }).join('');
    body += `<div class="sh-note">${node.ordered
      ? (ru?'Номера групп — как на экранах вкладки.':'Group numbers as on the tab screens.')
      : (ru?'Показаны только пункты, которые уже есть в приложении. Полный состав и порядок — после скрина этой страницы.':'Only items already in the app are shown. Full list and order after a screenshot of this page.')}</div>`;
  }
  const kicker = last ? (ru?'Последний шаг · что установить':'Last step · what to set')
                      : (ru?`Шаг ${i+1} из ${cr.length} · что внутри`:`Step ${i+1} of ${cr.length} · what is inside`);
  showSheet(kicker, nm, body);
}

/* ВАРИАНТ B: нажали пункт — все варианты его значения, наш подсвечен */
function nrm(x){ return String(x).toLowerCase().replace(/[\s.,()]/g,''); }
function matchVals(list, v){
  const out = [], nv = nrm(v), m = String(v).match(/^(\d+)\s*[–-]\s*(\d+)$/);
  list.forEach((o,j)=>{ if(nrm(o)===nv || (m && +o>=+m[1] && +o<=+m[2])) out.push(j); });
  return out;
}
function openValues(ri){
  const st = steps[stepIdx], r = st.rows[ri], ru = appLang==='ru';
  const d = r.k && VALS[r.k];
  const goal = String(st.crumb[st.crumb.length-1]).split('|')[0];
  let body;
  if(!d){
    body = `<div class="sh-gap">${ru?'Варианты этого пункта ещё не сняты — нужен скрин его экрана выбора.':'Options for this item are not captured yet — a screenshot of its selection screen is needed.'}</div>`
         + `<div class="sh-note">${ru?'Ставим':'Set'}: <b>${r.v}</b></div>`;
  } else {
    const list = d[camLang] || d.ru, hit = matchVals(list, r.v);
    body = list.map((o,j)=>`<div class="sh-i ${hit.includes(j)?'cur':''}"><span>${o}</span>`
      + (hit.includes(j)?`<span class="tag">${ru?'ставим':'set'}</span>`:'') + `</div>`).join('');
    if(d.partial) body += `<div class="sh-gap">${ru?'… есть и другие варианты — полный список после скрина':'… more options exist — full list after a screenshot'}</div>`;
    if(!hit.length) body += `<div class="sh-note">${ru?'Ставим':'Set'}: <b>${r.v}</b></div>`;
    body += `<div class="sh-note">${ru?'Список взят из данных приложения.':'List taken from the app data.'}</div>`;
  }
  showSheet(goal, r.n, body);
}

(function(){
  const b = document.getElementById('body'); if(!b) return;
  let sx=0, sy=0, t0=0;
  b.addEventListener('touchstart', e=>{ const p=e.touches[0]; sx=p.clientX; sy=p.clientY; t0=Date.now(); }, {passive:true});

/* умный поиск: понимает 4/16-70, 1.4/15, 12/2, sel35f18, f1.8, 16-70mm, опечатку в одну букву */
function lev(a,b){
  if(Math.abs(a.length-b.length)>1) return 9;
  const d=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){ let p=d[0]; d[0]=i;
    for(let j=1;j<=b.length;j++){ const t=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=t; } }
  return d[b.length];
}
function parseQ(v){
  const q = v.toLowerCase().replace(/,/g,'.').replace(/мм|mm/g,' ')
    .replace(/([a-zа-яё])(\d)/g,'$1 $2').replace(/(\d)([a-zа-яё])/g,'$1 $2');
  const toks = q.split(/[\s\/\-–—:;+*()|]+/).filter(Boolean);
  const nums=[], words=[];
  toks.forEach(t=>{ if(/^\d+(\.\d+)?$/.test(t)) nums.push(parseFloat(t)); else if(!['f','ф','e'].includes(t)) words.push(t); });
  return {nums, words};
}
function numHit(n, f, a){
  const eq=(x,y)=>Math.abs(x-y)<1e-6;
  if(f.some(x=>eq(x,n)) || a.some(x=>eq(x,n))) return true;
  if(Number.isInteger(n) && n>=10 && n<100 && a.some(x=>eq(x*10,n))) return true;   // 18 → f/1.8
  return false;
}
function wordHit(w, s){
  if(s.includes(w)) return true;
  if(w.length<4) return false;
  return s.split(/[\s|]+/).some(t=>t.length>=3 && (lev(t,w)<=1 || (t.length>w.length && lev(t.slice(0,w.length),w)<=1)));
}
function lensQ(v){
  lensQuery = v; const {nums, words} = parseQ(v);
  const code = v.toLowerCase().replace(/[^a-z0-9]/g,'');
  const byCode = /^sel/.test(code) && code.length>=5 && [...document.querySelectorAll('.lopt')].some(el=>el.dataset.m.startsWith(code));
  const seen = {}; let n=0;
  document.querySelectorAll('.lopt').forEach(el=>{
    const f = el.dataset.f.split(',').map(Number), a = el.dataset.a.split(',').map(Number);
    const ok = byCode ? el.dataset.m.startsWith(code) : (nums.every(x=>numHit(x,f,a)) && words.every(w=>wordHit(w, el.dataset.s)));
    el.style.display = ok ? '' : 'none';
    if(ok){ seen[el.dataset.b]=1; n++; }
  });
  document.querySelectorAll('.lbrand[data-b]').forEach(el=>{ el.style.display = seen[el.dataset.b] ? '' : 'none'; });
  const nn = document.getElementById('lnone'); if(nn) nn.style.display = (n || !v.trim()) ? 'none' : '';
}

    <div class="sbox-s">${R('Сохранён в «Мои сценарии». Запусков','Saved in “My scenarios”. Runs')}: ${s.count||0}</div>
    <div class="sbox-h">${R('Банк памяти камеры, куда вы записали эти настройки','Camera memory bank you stored these settings in')}</div>
    ${mrChips(s)}
    <div class="sbox-n">${R('Запись: Съемка › Режим съемки › Регис. настр. кам. → банк. Вызов: там же, Вызов настр. кам. Тогда в следующий раз меню можно не проходить вовсе.','Store: Shooting › Shooting Mode › Camera Set. Memory → bank. Recall: same group, Camera Set. Recall. Then next time you can skip the menus entirely.')}</div></div>`;
}
function mrChips(s){
  return `<div class="mrc">` + ['',...MR_BANKS].map(b=>`<span class="mr ${ (s.mr||'')===b ?'on':''}" onclick="setMR(event,'${s.id}','${b}')">${b||'—'}</span>`).join('') + `</div>`;
}
function setMR(e,id,b){
  e.stopPropagation(); const s=scenById(id); if(!s) return;
  MY.scen.forEach(x=>{ if(b && x.mr===b && x.id!==id) x.mr=''; });   // один банк — один сценарий
  s.mr=b; saveMY(); const bd=document.getElementById('body'), st=bd.scrollTop; render(); bd.scrollTop=st;
}
function saveScen(){
  const id = 's'+Date.now().toString(36);
  MY.scen.push({ id, name:autoName(), created:Date.now(), last:Date.now(), count:1, mr:'',
    data:JSON.parse(JSON.stringify({sel, manualLens, vndCustom, ledCustom})) });
  activeScen = id; saveMY(); render();
}
function runScen(id){
  const s = scenById(id); if(!s) return;
  const d = s.data || {};
  sel = Object.assign({mode:null,lighting:null,subject:null,lens:null,gear:[],profile:null,ndVario:[],ndFixed:[],fps:25,angle:2,ledKind:'var',ledFix:'k5600',ledVar:'v3256',flMode:'ttl',flRole:'fill',flCurt:'first',stN:1,stSecond:'fill',stEvFill:-1.5,stEvRim:0.5,stEvBg:0,stIso:100,stAp:8,stCurt:'first'}, JSON.parse(JSON.stringify(d.sel||{})));
  if(d.manualLens) manualLens = Object.assign({}, d.manualLens);
  if(d.vndCustom) vndCustom = Object.assign({}, d.vndCustom);
  if(d.ledCustom) ledCustom = Object.assign({}, d.ledCustom);
  showManualForm = sel.lens==='manual';
  s.count = (s.count||0)+1; s.last = Date.now();
  activeScen = id; lensSkipped=false; countUse();
  steps = buildSteps(); stepIdx = 0;
  if(!steps.length){ page=0; render(); return; }
  pushGuard(); page = NSCR; render();
}
function renderMyScen(){
  document.getElementById('hdrStep').textContent = t().settings;
  document.getElementById('hdrTitle').textContent = R('Мои сценарии','My scenarios');
  document.getElementById('prev').style.display='none';
  document.getElementById('chips').style.display='none';
  const list = scenSorted();
  let h = '';
  if(!list.length) h += `<div class="my-note">${R('Сохранённых сценариев пока нет. Пройдите настройку до конца и нажмите «Сохранить в мои сценарии».','No saved scenarios yet. Finish a setup and tap “Save to my scenarios”.')}</div>`;
  h += list.map((s,i)=>{
    const top = i===0 && (s.count||0)>1;
    const mo = s.data && s.data.sel && s.data.sel.mode ? MODE_OPTS.find(x=>x.id===s.data.sel.mode) : null;
    const nameH = scenEdit===s.id
      ? `<input class="sname-in" value="${esc(s.name)}" onclick="event.stopPropagation()" onkeydown="if(event.key==='Enter')this.blur()" onblur="renameScen('${s.id}',this.value)" id="ren_${s.id}">`
      : `<div class="scn-t">${mo?`<span class="badge own" style="margin-right:6px">${esc(txt(mo,0))}</span>`:''}${esc(s.name)}</div>`;
    return `<div class="scn">
      <div class="scn-main" onclick="runScen('${s.id}')">
        ${nameH}
        <div class="scn-s">${top?'<span class="topb">'+R('чаще всего','most used')+'</span> ':''}${R('запусков','runs')}: ${s.count||0} · ${R('последний','last')}: ${fmtDate(s.last)}${s.mr?` · <b>MR ${s.mr}</b>`:''}</div>
      </div>
      <div class="scn-bar">
        <span class="scn-run" onclick="runScen('${s.id}')">▶ ${R('Запустить','Run')}</span>
        <span class="scn-a" onclick="editScen('${s.id}')">✎</span>
        <span class="scn-a" onclick="askDelScen('${s.id}')">🗑</span>
      </div>
      <div class="scn-mr"><span class="scn-mrl">MR</span>${mrChips(s)}</div>
    </div>`;
  }).join('');
  h += `<div class="sect-h">${R('Резервная копия','Backup')}</div>
    <div class="sect-note">${R('Всё хранится только на этом устройстве, сеть не нужна. Очистка данных браузера сотрёт сценарии и оснащение — сохраните копию в файл.','Everything is stored on this device only; no network needed. Clearing browser data wipes scenarios and gear — keep a copy in a file.')}</div>
    <div class="bkp"><button class="btn btn-sec" onclick="exportMY()">⤓ ${R('Сохранить в файл','Save to file')}</button>
    <button class="btn btn-sec" onclick="document.getElementById('impF').click()">⤒ ${R('Загрузить из файла','Load from file')}</button></div>
    <input type="file" id="impF" accept=".json,application/json" style="display:none" onchange="importMY(this)">`;
  document.getElementById('body').innerHTML = h;
  if(scenEdit){ const el=document.getElementById('ren_'+scenEdit); if(el){ el.focus(); el.select(); } }
  const bot=document.getElementById('bot'); bot.style.display='flex';
  bot.innerHTML = `<button class="btn btn-pri" style="flex:1" onclick="navBack()">${t().done}</button>`;
}
function editScen(id){ scenEdit=id; renderMyScen(); }
function renameScen(id,v){ const s=scenById(id); if(s && v.trim()) s.name=v.trim(); scenEdit=null; saveMY(); renderMyScen(); }
function askDelScen(id){
  const s=scenById(id); if(!s) return;
  showModal(R('Удалить сценарий?','Delete scenario?'), esc(s.name), R('Удалить','Delete'), R('Отмена','Cancel'),
    ()=>{ MY.scen=MY.scen.filter(x=>x.id!==id); if(activeScen===id) activeScen=null; saveMY(); render(); }, null);
}
function exportMY(){
  try{
    const blob = new Blob([JSON.stringify({app:'a6700-setup', v:1, saved:new Date().toISOString(), my:MY}, null, 1)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'a6700-my-setup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }catch(e){}
}
function importMY(inp){
  const f = inp.files && inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    let d=null; try{ d = JSON.parse(rd.result); }catch(e){}
    inp.value='';
    if(!d || d.app!=='a6700-setup' || !d.my){ showModal(R('Не тот файл','Wrong file'), R('Это не копия данных этого приложения.','This is not a backup from this app.'), 'OK', R('Закрыть','Close'), null, null); return; }
    showModal(R('Заменить данные?','Replace data?'),
      R(`В файле: объективов ${(d.my.lenses||[]).length}, сценариев ${(d.my.scen||[]).length}. Текущие оснащение и сценарии будут заменены.`,
        `File has ${(d.my.lenses||[]).length} lenses and ${(d.my.scen||[]).length} scenarios. Current gear and scenarios will be replaced.`),
      R('Заменить','Replace'), R('Отмена','Cancel'),
      ()=>{ MY = Object.assign(blankMY(), d.my); MY.use = Object.assign({lens:{},gear:{}}, MY.use||{}); MY.setupDone=true; saveMY(); mergeCustom(); render(); }, null);
  };
  rd.readAsText(f);
}

/* ── заставка: первая настройка и быстрый вход в сценарии ── */
function splashExtra(html, has){
  const ru = appLang==='ru';
  const first = !MY.setupDone && !has && !MY.lenses.length && !MY.scen.length;
  if(first){
    html = `<button class="sp-btn primary" id="spSetup">${ru?'Настроить моё оснащение':'Set up my gear'}</button>`
         + html.replace('sp-btn primary" id="spNew"', 'sp-btn ghost" id="spNew"')
               .replace(ru?'>Начать<':'>Start<', ru?'>Пропустить, начать сразу<':'>Skip, start now<')
         + `<div class="sp-note">${ru?'Один раз отметьте свои объективы и аксессуары — дальше приложение не будет спрашивать одно и то же':'Mark your lenses and accessories once — the app stops asking the same things'}</div>`;
  }
  html += `<button class="sp-btn ghost" id="spFind">⌕ ${ru?'Найти функцию в меню':'Find a menu function'}</button>`;
  if(MY.scen.length){
    html += `<button class="sp-btn ghost" id="spScen">★ ${ru?'Мои сценарии':'My scenarios'} (${MY.scen.length})</button>`;
  }
  html += LOGO_SVG;
  return html;
}
function bindSplashExtra(close){
  const a = document.getElementById('spSetup');
  if(a) a.addEventListener('click', e=>{ e.stopPropagation(); wizard=true; myAddOpen=true; page=97; render(); close(); });
  const f = document.getElementById('spFind');
  if(f) f.addEventListener('click', e=>{ e.stopPropagation(); pushGuard(); findPrev=0; page=96; render(); close(); });
  const b = document.getElementById('spScen');
  if(b) b.addEventListener('click', e=>{ e.stopPropagation(); pushGuard(); page=98; render(); close(); });
}

function fnorm(s){ return String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9áéíóúñü&+]+/g,' ').trim(); }
function ftok(s){ return fnorm(s).split(' ').filter(Boolean); }

const FIDX = (typeof MENU_IDX==='undefined'?[]:MENU_IDX.items).map(it=>{
  const L=['ru','en','es'];
  const N = L.map(l=>ftok(it.n[l]));
  const P = ftok(L.map(l=>it.g[l]+' '+it.s.map(x=>x[l]).join(' ')).join(' '));
  const V = ftok(L.map(l=>(it.v[l]||[]).join(' ')).join(' '));
  const SY = (it.syn||[]).map(ftok);
  const NT = ftok((it.note||'')+' '+(it.gray||''));
  const full = L.map(l=>fnorm(it.n[l]));
  return {it, N, P, V, SY, NT, full, synFull:(it.syn||[]).map(fnorm)};

function tm(q,t){
  if(q===t) return 1;
  if(q.length>=3 && t.length>=3 && t.startsWith(q)) return 0.85;
  if(t.length>=4 && q.startsWith(t)) return 0.85;
  if(q.length>=5 && t.length>=5){
    if(q.slice(0,5)===t.slice(0,5)) return 0.65;
    if(lev(q,t)<=1) return 0.7;
  }
  return 0;
}
function bestIn(q, toks){ let b=0; for(const t of toks){ const m=tm(q,t); if(m>b){ b=m; if(b===1) break; } } return b; }
function fscore(qt, qfull, e){
  let sum=0, via={n:0,s:0,p:0,v:0}, miss=0;
  for(const q of qt){
    const n = Math.max(...e.N.map(ts=>bestIn(q,ts)))*3;
    const s = Math.max(0,...e.SY.map(ts=>bestIn(q,ts)))*2.6;
    const p = bestIn(q,e.P)*1.1;
    const v = bestIn(q,e.V)*0.8;
    const nt = bestIn(q,e.NT)*0.8;
    const b = Math.max(n,s,p,v,nt);
    if(b<0.5*0.8){ miss++; continue; }
    sum += b;
    if(b===n) via.n++; else if(b===s) via.s++; else if(b===p) via.p++; else via.v++;
  }
  if(!qt.length) return null;
  if(miss > (qt.length>=3?1:0)) return null;
  if(e.full.some(f=>f===qfull)) sum+=6; else if(e.full.some(f=>f.includes(qfull)&&qfull.length>=3)) sum+=3;
  if(e.synFull.some(f=>f===qfull)) sum+=5; else if(e.synFull.some(f=>f.includes(qfull)&&qfull.length>=4)) sum+=2;
  if(!(via.n||via.s) && sum<2.5) return null;          // только по пути/значениям и слабо — шум
  const kind = via.n>=via.s && via.n>0 ? 'name' : (via.s>0 ? 'syn' : 'path');
  return {e, sc:sum/qt.length + (kind==='name'?0.3:0), kind};
}
function fsearch(q){
  const qfull=fnorm(q), qt=ftok(q).filter(w=>!FSTOP.has(w));
  if(!qt.length) return [];
  const r=[]; for(const e of FIDX){ const x=fscore(qt,qfull,e); if(x) r.push(x); }
  r.sort((a,b)=>b.sc-a.sc);
  return r.slice(0,8);
}
/* нечёткие подсказки, когда ничего не нашлось */
function fsuggest(q){
  const qt=ftok(q).filter(w=>!FSTOP.has(w) && w.length>=4); if(!qt.length) return [];
  const sc = FIDX.map(e=>{
    const all=[...e.N.flat(), ...e.SY.flat()].filter(t=>t.length>=3);
    let s=0;
    for(const w of qt){ let b=0;
      for(const t of all){ const d=lev(w.slice(0,Math.min(w.length,t.length+1)), t.slice(0,w.length));
        if(d<=2) b=Math.max(b,0.6); else if(t.includes(w.slice(0,3))) b=Math.max(b,0.35); }
      s+=b; }
    return {e, sc:s/qt.length};
  }).filter(x=>x.sc>=0.5).sort((a,b)=>b.sc-a.sc);
  return sc.slice(0,5);
}

function ambigFind(qfull){
  const qn = String(qfull||'').replace(/\s+/g,'');
  if(qn.length<3) return null;
  for(const c of AMBIG){
    for(const lang of ['ru','en','es']){
      const arr = c.trig[lang]||[];
      for(const w of arr){ const wn = fnorm(w).replace(/\s+/g,''); if(wn && qn.includes(wn)) return c; }
    }
  }
  return null;
}
function ambigLbl(o){ return o[appLang] || o.ru || o.en; }
function ambigCard(c){
  return `<div class="fask">${esc(ambigLbl(c.explain))}</div>`
    + `<div class="fpop" style="padding-top:0">${c.sides.map((s,i)=>`<span class="fp" onclick="findPickSide('${c.id}',${i})">${esc(ambigLbl(s.label))}</span>`).join('')}</div>`;
}
function noteCard(c){ return `<div class="fnn" style="margin:10px 12px 0;border-radius:9px">${esc(ambigLbl(c.explain))}</div>`; }
function findPickSide(cid, si){
  const c = AMBIG.find(a=>a.id===cid); if(!c) return;
  const s = c.sides[si]; if(!s) return;
  if(s.info){ showSheet(R('Пояснение','Explanation','Explicación'), ambigLbl(s.label), `<div class="sh-gap">${esc(ambigLbl(s.info))}</div>`); return; }
  findSet(s.q[appLang] || s.q.ru);
}
function findResultsHtml(){
  const q=findQ.trim(), l=flang();
  if(!q){
    const pop = [['зебра','zebra','zebra'],['пикинг','peaking','peaking'],['экспозамер','metering','medición'],['таймлапс','time lapse','time lapse'],['формат карты','format card','formatear tarjeta'],['лог','log','log'],['бесшумный','silent','silencioso'],['сетка','grid','cuadrícula'],['веб камера','webcam','webcam'],['мерцание','flicker','parpadeo']];
    return `<div class="fhint">${R('Пишите так, как вам привычно — приложение знает, как это называет Sony. Ищет сразу на русском, английском и испанском.','Type it your way — the app knows what Sony calls it. Searches Russian, English and Spanish at once.','Escríbalo como le resulte natural — la app sabe cómo lo llama Sony. Busca a la vez en ruso, inglés y español.')}</div>
      <div class="fpop">${pop.map(p=>{const w=appLang==='ru'?p[0]:(appLang==='es'?p[2]:p[1]);return `<span class="fp" onclick="findSet('${w}')">${w}</span>`;}).join('')}</div>`;
  }
  const amb = ambigFind(fnorm(q));
  const ambHtml = amb ? (amb.type==='note' ? noteCard(amb) : ambigCard(amb)) : '';
  if(amb && amb.type==='fork'){
    return ambHtml + `<div class="fhint">${R('Или посмотрите, что нашлось по запросу:','Or see what matched your search:','O vea lo que coincide con su búsqueda:')}</div>` + (()=>{
      const res = fsearch(q);
      return res.length ? res.map((r,i)=>frow(r,l,i,q)).join('') : '';
    })();
  }
  const res = fsearch(q);
  if(!res.length){
    const sg = fsuggest(q);
    return ambHtml + `<div class="fnone">${R('Точного совпадения нет.','No exact match.','No hay coincidencia exacta.')}${sg.length?' '+R('Возможно, вы ищете:','Did you mean:','Quizás busca:'):''}</div>`
      + sg.map((r,i)=>frow({e:r.e,kind:'syn'},l,100+i,q)).join('')
      + `<div class="fhint">${R('Запрос сохранён на этом устройстве — по таким запросам будем пополнять словарь (попадает в резервную копию).','Query saved on this device to improve the dictionary (included in the backup).','La consulta se guarda en este dispositivo para ampliar el diccionario (se incluye en la copia de seguridad).')}</div>`;
  }
  const top = res[0];
  let head=ambHtml;
  if(top.kind==='syn' && res.filter(r=>r.kind==='syn').length<=3)
    head += `<div class="fask">${R(`«${esc(q)}» — в меню камеры это называется так. Выберите нужное:`,`“${esc(q)}” — this is what the camera menu calls it. Pick one:`,`«${esc(q)}» — así lo llama el menú de la cámara. Elija el que corresponda:`)}</div>`;
  if(findOpen===null && (res.length===1 || res[0].sc - (res[1]?res[1].sc:0) > 1.2)) findOpen = 0;
  return head + res.map((r,i)=>frow(r,l,i,q)).join('');
}
let _fres=[];
function renderFind(){
  document.getElementById('hdrStep').textContent = R('Поиск','Search','Búsqueda');
  document.getElementById('hdrTitle').textContent = R('Найти функцию в меню','Find a menu function','Buscar función en el menú');
  document.getElementById('prev').style.display='none';
  document.getElementById('chips').style.display='none';
  const l=flang();
  const langs=[['ru','RU'],['en','EN'],['es','ES']].map(([k,n])=>`<span class="flg ${l===k?'on':''}" onclick="findSetLang('${k}')">${n}</span>`).join('');
  document.getElementById('body').innerHTML = `<div class="fbox">
      <input id="findIn" type="search" autocomplete="off" placeholder="${R('Что ищете? экспозамер, пикинг, таймлапс…','What are you looking for? metering, peaking…','¿Qué busca? medición, peaking…')}" value="${esc(findQ)}"
        oninput="findInput(this.value)" onchange="findCommit(this.value)">
      <div class="flangs"><span class="flgl">${R('Меню камеры:','Camera menu:','Menú de la cámara:')}</span>${langs}</div></div>
    <div id="findRes">${findResultsHtml()}</div>
    <div class="fsrc">${R('Русский — по скринам меню камеры (прошивка 2.00). English и Español — по официальной справке Sony для ILCE-6700, сверка на камере идёт.','Russian — from camera screenshots (firmware 2.00). English and Spanish — from Sony’s official ILCE-6700 help guide, being checked on the camera.','Ruso — a partir de capturas del menú de la cámara (firmware 2.00). Inglés y español — de la guía oficial de Sony para el ILCE-6700, en proceso de verificación en la cámara.')}</div>`;
  const bot=document.getElementById('bot'); bot.style.display='flex';
  bot.innerHTML = `<button class="btn btn-sec" style="flex:1" onclick="navBack()">${t().back}</button>`;
  const inp=document.getElementById('findIn'); if(inp && !findQ) setTimeout(()=>{ try{ inp.focus(); }catch(e){} }, 60);
}
function findRefresh(){ const el=document.getElementById('findRes'); if(el) el.innerHTML=findResultsHtml(); }
function findInput(v){ findQ=v; findOpen=null; clearTimeout(findT); findT=setTimeout(findRefresh, 120); }
function findCommit(v){
  const q=v.trim(); if(q.length<3) return;
  if(!fsearch(q).length){ MY.missQ = [q, ...(MY.missQ||[]).filter(x=>x!==q)].slice(0,50); saveMY(); }
}
function findSet(w){ findQ=w; findOpen=null; const inp=document.getElementById('findIn'); if(inp) inp.value=w; findRefresh(); }
function findSetLang(k){ findLang=k; findRefresh(); renderFindLangs(); }
function renderFindLangs(){ document.querySelectorAll('.flg').forEach(el=>el.classList.toggle('on', el.textContent.toLowerCase()===flang())); }
function findToggle(i){ findOpen = findOpen===i ? null : i; findRefresh(); }
function openFind(){ cancelAdvance(); pushGuard(); if(page!==96) findPrev=page; page=96; render(); }

/* ═════ PERSISTENCE ═════ */
const LSKEY='a6700-setup-v3';   // v3: язык по умолчанию для новых пользователей сменён на English — старое сохранённое «ru» из v2 иначе навсегда перекрывало бы новый дефолт
function saveState(){
  try{ localStorage.setItem(LSKEY, JSON.stringify({
    appLang, camLang, sel, manualLens, vndCustom, ledCustom, page, stepIdx, showManualForm, activeScen, lensSkipped
  })); }catch(e){}
}
function loadState(){
  try{ const raw=localStorage.getItem(LSKEY); if(!raw) return null; return JSON.parse(raw); }catch(e){ return null; }
}
function applyState(d, withProgress){
  if(!d) return;
  if(d.appLang) appLang=d.appLang;
  if(d.camLang) camLang=d.camLang;
  if(!withProgress) return;
  if(d.sel) sel=Object.assign({mode:null,lighting:null,subject:null,lens:null,gear:[],profile:null,ndVario:[],ndFixed:[],fps:25,angle:2,ledKind:'var',ledFix:'k5600',ledVar:'v3256',flMode:'ttl',flRole:'fill',flCurt:'first',stN:1,stSecond:'fill',stEvFill:-1.5,stEvRim:0.5,stEvBg:0,stIso:100,stAp:8,stCurt:'first'}, d.sel);
  if(d.manualLens) manualLens=d.manualLens;
  if(d.vndCustom) vndCustom=d.vndCustom;
  if(d.ledCustom) ledCustom=d.ledCustom;
  showManualForm=!!d.showManualForm; activeScen=d.activeScen||null; lensSkipped=!!d.lensSkipped;
  page=typeof d.page==='number'?d.page:0; stepIdx=d.stepIdx||0;
  if(page>=96) page=0;
  if(page>=NSCR) steps=buildSteps();
  if(page===NSCR && stepIdx>steps.length-1) stepIdx=Math.max(0,steps.length-1);
}

/* wrap render so every state change is persisted */
const _render = render;
render = function(){
  try { _render(); }
  catch(e){
    /* аварийный откат: возвращаем рабочий экран вместо пустого */
    try{
      page = Math.min(page, NSCR-1); stepIdx = 0; steps = [];
      _render();
    }catch(e2){}
  }
  saveState();
};

/* ═════ ANDROID BACK BUTTON ═════ */
/* на каждый шаг вперёд кладём метку в историю; кнопка «Назад» — и системная,
   и экранная — снимает её через history.back(), поэтому глубины всегда совпадают */
let guards = 0;
function pushGuard(){ try{ history.pushState({app:1},''); guards++; }catch(e){} }
function syncHistory(){}          // больше не нужна, оставлена чтобы не ломать вызовы

let backPending = false;
function navBack(){
  if(backPending) return;           // защита от частых тапов: history.back() срабатывает не мгновенно
  cancelAdvance();
  if(guards>0){ backPending = true; history.back(); }
  else { goBack(); }
}
try{
  window.addEventListener('popstate', function(){
    backPending = false;
    if(guards>0) guards--;
    cancelAdvance();
    const m=document.getElementById('modal');
    if(sheetOpen){ hideSheet(); return; }
    if(m && m.innerHTML){ closeModal(false); return; }
    goBack();
  });
}catch(e){}

/* ═════ ЗАСТАВКА И ЗАПУСК ═════ */
(function boot(){
  const saved = loadState();
  applyState(saved, false);                 // язык подхватываем сразу
  const ru = appLang === 'ru';
  const has = saved && saved.sel && (saved.sel.lighting || saved.sel.subject ||
              saved.sel.lens || saved.sel.profile || (saved.sel.gear && saved.sel.gear.length));

  try{
    const subEl = document.getElementById('spSub');
    const vtagEl = document.getElementById('spVtag');
    if(subEl) subEl.textContent = ru
      ? 'интерактивный гид по настройке камеры под вашу сцену'
      : 'interactive guide for setting the camera to your scene';
    if(vtagEl) vtagEl.textContent = ru
      ? 'v3 · режим Фото/Видео/S&Q · студийный свет · макро · астро'
      : 'v3 · Photo/Video/S&Q mode · studio lighting · macro · astro';
  }catch(e){}

  const sp = document.getElementById('splash');
  const box = document.getElementById('spBtns');

  const close = () => {
    sp.className = 'gone';
    setTimeout(() => { try { sp.style.display = 'none'; } catch(e){} }, 500);
  };

  let html = '';
  if (has) {
    const parts = [];
    if (saved.sel.mode)     { const o = MODE_OPTS.find(x=>x.id===saved.sel.mode); if(o) parts.push(txt(o,0)); }
    if (saved.sel.lighting) { const o = LIGHTING.find(x=>x.id===saved.sel.lighting); if(o) parts.push(txt(o,0)); }
    if (saved.sel.subject)  { const o = SUBJECT.find(x=>x.id===saved.sel.subject);   if(o) parts.push(txt(o,0)); }
    html += `<button class="sp-btn primary" id="spResume">${ru?'Продолжить начатое':'Resume'}</button>`;
    html += `<button class="sp-btn ghost"   id="spNew">${ru?'Начать новый сценарий':'Start a new scenario'}</button>`;
    if (parts.length) html += `<div class="sp-note">${parts.join(' · ')}</div>`;
  } else {
    html += `<button class="sp-btn primary" id="spNew">${ru?'Начать':'Start'}</button>`;
  }
  html = splashExtra(html, has);
  box.innerHTML = html;

  const resume = document.getElementById('spResume');
  if (resume) resume.addEventListener('click', e => {
    e.stopPropagation(); applyState(saved, true); render(); close();
  });
  document.getElementById('spNew').addEventListener('click', e => {
    e.stopPropagation();
    sel = {mode:null,lighting:null,subject:null,lens:null,gear:[],profile:null,
           ndVario:[],ndFixed:[],fps:25,angle:2,
           ledKind:'var',ledFix:'k5600',ledVar:'v3256',
           flMode:'ttl',flRole:'fill',flCurt:'first',
           stN:1,stSecond:'fill',stEvFill:-1.5,stEvRim:0.5,stEvBg:0,stIso:100,stAp:8,stCurt:'first'};
    manualLens={fMin:'',fMax:'',apMax:''}; vndCustom={min:'',max:''}; ledCustom={k:'',min:'',max:''};
    showManualForm=false; ndSection=null; showDense=false; showAll=false;
    page=0; stepIdx=0; steps=[]; prevOpen=false; activeScen=null; lensSkipped=false; lensAll=false;
    MY.setupDone=true; saveMY(); applyMyDefaults();
    render(); close();
  });

  bindSplashExtra(close);
  render();          // рисуем приложение под заставкой
})();

</script>
