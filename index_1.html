  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    font-family:'AppCond','Arial Narrow','Liberation Sans Narrow',system-ui,sans-serif;
    font-stretch:condensed; background:#0a0a0a; color:#fff;
    -webkit-font-smoothing:antialiased; overscroll-behavior:none;
    height:100%; overflow:hidden;
  }
  .app {
    max-width:440px; width:100%; margin:0 auto; display:flex; flex-direction:column;
    height:100vh; height:100dvh; background:#141414;
    padding-top:env(safe-area-inset-top); overflow:hidden;
  }
  #body { flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  .hdr,.prev,.chips,.bot { flex:0 0 auto; }
  @media (min-width:700px) and (pointer:fine) {
    body { background:#050505; display:flex; justify-content:center; align-items:center; }
    .app { height:min(900px, calc(100vh - 40px)); border-radius:20px; border:1px solid #2a2a2a; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  }
  .rotate { display:none; position:fixed; inset:0; z-index:999; background:#0a0a0a;
    flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; }
  .rotate .ico { font-size:60px; margin-bottom:20px; }
  .rotate .msg { font-size:19px; font-weight:700; line-height:1.4; color:#ff9500; }
  @media (orientation:landscape) and (max-height:520px) and (pointer:coarse) {
    .rotate { display:flex; } .app { display:none; }
  }

  .hdr { background:#1c1c1c; padding:14px 16px; border-bottom:1px solid #2e2e2e; display:flex; align-items:center; gap:10px; }
  .hdr-btn { font-size:26px; color:#ff9500; cursor:pointer; line-height:1; padding:2px 6px; }
  .hdr-btn.hidden { visibility:hidden; }
  .hdr-btn.gear { font-size:20px; }
  .hdr-txt { flex:1; min-width:0; }
  .hdr-step { font-size:11px; color:#ff9500; letter-spacing:1.4px; text-transform:uppercase; font-weight:700; }
  .hdr-title { font-size:20px; font-weight:700; margin-top:1px; line-height:1.15; }

  .prev { background:#131313; border-bottom:1px solid #262626; }
  .prev-bar { padding:11px 16px; display:flex; align-items:center; gap:8px; cursor:pointer;
    font-size:12.5px; font-weight:700; color:#ff9500; text-transform:uppercase; letter-spacing:1px; }
  .prev-bar .caret { margin-left:auto; font-size:14px; transition:transform .2s; color:#888; }
  .prev-bar.open .caret { transform:rotate(180deg); }
  .prev-body { display:none; padding:0 16px 12px; max-height:46vh; overflow-y:auto; }
  .prev-body.open { display:block; }
  .prev-row { display:flex; justify-content:space-between; gap:10px; padding:6.5px 0; border-bottom:1px solid #232323; font-size:13.5px; }
  .prev-row:last-child { border-bottom:none; }
  .prev-row .pk { color:#8a8a8a; font-weight:500; }
  .prev-row .pv { color:#fff; font-weight:700; text-align:right; }
  .prev-row .pv.empty { color:#4a4a4a; font-weight:400; font-style:italic; }
  .prev-row .pv.calc { color:#6cbf6c; }
  .prev-row .pv.warn { color:#ffb340; }
  .prev-row .pv.bad  { color:#ff6b5e; }
  .ndlist { background:#181818; border-bottom:1px solid #262626; padding:4px 0 8px; }
  .ndlist .ndh { padding:11px 16px 6px; font-size:12px; color:#ff9500; text-transform:uppercase;
    letter-spacing:1.1px; font-weight:700; }
  .ndopt { display:flex; align-items:center; gap:12px; padding:12px 16px 12px 30px;
    border-bottom:1px solid #212121; cursor:pointer; min-height:52px; }
  .ndopt:last-child { border-bottom:none; }
  .ndopt:active { background:#232323; }
  .ndopt .radio { width:20px; height:20px; border:2px solid #555; border-radius:50%;
    flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .ndopt.sel .radio { border-color:#ff9500; background:#ff9500; }
  .ndopt.sel .radio::after { content:''; width:8px; height:8px; border-radius:50%; background:#000; }
  .ndopt .nn { font-size:15.5px; font-weight:600; color:#ddd; }
  .ndopt.sel .nn { color:#fff; font-weight:700; }
  .ndopt .nd2 { font-size:12px; color:#7d7d7d; margin-top:2px; }
  .ndcustom { padding:10px 16px 12px 30px; display:flex; align-items:center; gap:10px; }
  .ndcustom input { width:74px; padding:9px 8px; font-family:inherit; font-size:16px; font-weight:700;
    text-align:center; background:#0f0f0f; color:#fff; border:1px solid #3a3a3a; border-radius:8px; }
  .ndcustom input:focus { outline:none; border-color:#ff9500; }
  .ndcustom label { font-size:14px; color:#bbb; flex:1; }
  .ndsec { display:flex; align-items:center; gap:9px; padding:13px 16px; cursor:pointer;
    border-bottom:1px solid #212121; background:#1d1d1d; }
  .ndsec:active { background:#262626; }
  .ndsec .arw { color:#ff9500; font-size:13px; transition:transform .18s; display:inline-block; }
  .ndsec.open .arw { transform:rotate(90deg); }
  .ndsec .sn { font-size:15.5px; font-weight:700; color:#ddd; flex:1; }
  .ndcount { background:#ff9500; color:#000; font-size:11.5px; font-weight:800;
    min-width:20px; height:20px; border-radius:10px; display:flex; align-items:center;
    justify-content:center; padding:0 6px; }
  .ndopt .radio { width:20px; height:20px; border:2px solid #555; border-radius:50%;
    flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .ndopt.sel .radio { border-color:#ff9500; background:#ff9500; }
  .ndopt.sel .radio::after { content:''; width:8px; height:8px; border-radius:50%; background:#000; }
  .ndopt .check { width:20px; height:20px; border:2px solid #555; border-radius:5px;
    flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .ndopt.sel .check { border-color:#ff9500; background:#ff9500; }

/* какое оснащение уместно — зависит от освещения и сюжета */
function fitGear(id){
  const L=sel.lighting, S=sel.subject;
  const dark = ['dusk','night-street','night-dark','indoor-lamp'].includes(L);
  const bright = ['sun-hard','sun-soft','partly','bright-cloud'].includes(L);
  const vid = ['talking','walk'].includes(S);
  switch(id){
    case 'nd':      return bright || L==='overcast';
    case 'tripod':  return dark || L==='studio' || ['landscape','architecture','detail','night-sky','talking'].includes(S);
    case 'gimbal':  return vid;
    case 'mic':     return vid;
    case 'light':   return dark || L==='studio' || L==='indoor-window';
    case 'flash':   return !vid && (dark || L==='studio' || bright);
    case 'monitor': return vid || L==='studio';
    default:        return true;
  }
}
function fitSubj(id){
  const f = FIT_SUBJ[sel.lighting];
  return !f || f.includes(id);
}

function stops(n){
  if(appLang!=='ru') return n+' stops';
  const r=Math.round(n*10)/10;
  if(!Number.isInteger(r)) return r+' стопа';
  const a=Math.abs(r)%100, b=a%10;
  if(a>10&&a<20) return r+' стопов';
  if(b===1) return r+' стоп';
  if(b>=2&&b<=4) return r+' стопа';
  return r+' стопов';
}
const nearest = (arr,v) => arr.reduce((p,c)=>Math.abs(c-v)<Math.abs(p-v)?c:p);
const ceilIn   = (arr,v) => arr.find(x=>x>=v) ?? arr[arr.length-1];
const evScene  = (ev100,iso) => ev100 + Math.log2(iso/100);
const reqAp    = (ev100,iso,t) => Math.sqrt(t * Math.pow(2, evScene(ev100,iso)));
const calcShut = (ev100,iso,N) => (N*N) / Math.pow(2, evScene(ev100,iso));
const fmtShut  = t => t>=1 ? (Math.round(t*10)/10)+'s' : '1/'+Math.round(1/t);
function ambientK(){
  const L=L_(); if(!L) return 5600;
  const m=String(val(L.wb)).match(/(\d{4})/g);
  if(!m) return 5600;
  return m.length>1 ? Math.round((+m[0]+ +m[1])/2) : +m[0];
}

  if(!sel.gear.includes('light')) return null;
  if(sel.ledKind==='fix'){
    if(sel.ledFix==='kcust'){ const k=parseFloat(ledCustom.k); return isNaN(k)?null:{fixed:true,k}; }
    const o=LED_FIX.find(x=>x.id===sel.ledFix); return o&&o.k?{fixed:true,k:o.k}:null;
  }
  if(sel.ledVar==='vcust'){
    const a=parseFloat(ledCustom.min), b=parseFloat(ledCustom.max);
    return (isNaN(a)||isNaN(b))?null:{fixed:false,min:a,max:b};
  }
  const o=LED_VAR.find(x=>x.id===sel.ledVar);
  return o&&o.min?{fixed:false,min:o.min,max:o.max}:null;
}
function gelFor(fromK,toK){
  const ru=appLang==='ru';
  const d=toK-fromK;
  if(Math.abs(d)<350) return null;
  const warm=[[-2400,'CTO',ru?'полный CTO':'full CTO'],[-1700,'1/2 CTO',ru?'половинный CTO':'half CTO'],[-1000,'1/4 CTO',ru?'четвертной CTO':'quarter CTO']];
  const cool=[[2400,'CTB',ru?'полный CTB':'full CTB'],[1100,'1/2 CTB',ru?'половинный CTB':'half CTB'],[500,'1/4 CTB',ru?'четвертной CTB':'quarter CTB']];
  const set = d<0?warm:cool;
  let best=set[0];
  for(const c of set) if(Math.abs(Math.abs(c[0])-Math.abs(d))<Math.abs(Math.abs(best[0])-Math.abs(d))) best=c;
  return best[1];
}
function fpsObj(){ return FPS_OPTS.find(f=>f.fps===sel.fps) || FPS_OPTS[0]; }
function angleObj(){ return ANGLE_OPTS.find(a=>a.mul===sel.angle) || ANGLE_OPTS[0]; }
function vidShutter(){ return nearest(SH_SERIES, 1/(sel.fps*sel.angle)); }

/* aperture the lens can actually give — widest end used as the limit */
function lensWidest(L){ return L ? Math.min(L.a[0],L.a[1]) : 1.0; }
function lensFocalForCalc(L){ return L ? L.f[1] : 50; }   // tele end = worst case for handheld

function computeExposure(){
  const L=L_(), S=S_(), P=P_(), LN=lensObj();
  if(!L||!S||!P) return null;
  const v=isVideo();
  const widest = LN ? lensWidest(LN) : null;

  let N = S.apT, apLimited=false;
  if (widest && N < widest){ N = widest; apLimited = true; }
  N = nearest(AP_SERIES, N);
  const Ntarget = N;

  const r = { N, Ntarget, apLimited, widest, video:v, nd:null, combo:null,
              apForced:false, apImpossible:false, isoHigh:false, isoOver:false, shutOver:false };

  if (v) {
    const tBase = vidShutter();
    let iso = P.baseIso;
    const need = 2*Math.log2(reqAp(L.ev, iso, tBase) / N);   // stops of light to kill at target aperture
    r.needStops = need;

    const combo = bestCombo(need);
    r.combo = combo;
    r.nd = combo ? {min:combo.min, max:combo.max} : null;

    if (!combo) {
      r.ndApplied = 0;
      if (need > 0.4) {
        r.shortfall = need;
        const Nn = ceilIn(AP_SERIES, N * Math.pow(2, need/2));
        if (Nn > 16) { r.apImpossible = true; r.N = 16; } else { r.N = Nn; }
        r.apForced = true;
      } else if (need < -0.4) {
        r.isoUp = ceilIn(ISO_SERIES, Math.min(iso*Math.pow(2,-need), 25600));
        if (r.isoUp >= 12800) r.isoOver = true;
      }
    } else {
      const applied = Math.min(Math.max(need, combo.min), combo.max);
      r.ndApplied = applied;
      if (combo.variable) r.vndDial = Math.max(0, Math.round((applied - combo.fixAdd)*10)/10);
      const residual = need - applied;
      r.residual = residual;
      if (residual > 0.4) {
        r.shortfall = residual;
        const Nn = ceilIn(AP_SERIES, N * Math.pow(2, residual/2));
        if (Nn > 16) { r.apImpossible = true; r.N = 16; } else { r.N = Nn; }
        r.apForced = true;
      } else if (residual < -0.4) {
        let Nn = N * Math.pow(2, residual/2);
        if (widest && Nn < widest) {
          const stillDark = 2*Math.log2(widest/Nn);
          Nn = widest;
          r.isoUp = ceilIn(ISO_SERIES, Math.min(iso*Math.pow(2,stillDark), 25600));
          if (r.isoUp >= 12800) r.isoOver = true;
        }
        r.N = nearest(AP_SERIES, Nn);
        r.apForced = true;
      }
    }
    r.t = tBase; r.iso = iso;

  } else if (S.id === 'night-sky') {
    /* звёзды: выдержку задаёт правило 500, диафрагму открываем, ISO добирает экспозицию */
    const focal = LN ? LN.f[0] : 20;
    const tStar = Math.min(30, 500/(focal*CROP));
    const below = SH_SERIES.filter(x=>x<=tStar);
    r.t = below.length ? below[below.length-1] : SH_SERIES[SH_SERIES.length-1];
    r.N = widest ? nearest(AP_SERIES, widest) : N;
    r.starRule = tStar;
    r.astro = true;
    r.ndApplied = 0;
    const need = 2*Math.log2(reqAp(L.ev, 100, r.t) / r.N);
    r.iso = ceilIn(ISO_SERIES, Math.min(100*Math.pow(2,-need), 25600));
    r.isoHigh = r.iso >= 3200;
    r.isoOver = r.iso >= 12800;
    r.tooSlow = true;                      // с рук невозможно в принципе
    r.handRule = 1/(focal*CROP);
  } else {
    let iso = Math.max(P.baseIso, L.isoMin);
    const focal = lensFocalForCalc(LN);
    const handRule = 1/(focal*CROP);
    r.handRule = handRule;

    r.ndApplied = 0;
    let t = (N*N) / Math.pow(2, L.ev + Math.log2(iso/100));

    // too bright for the shutter ceiling? fit a filter, or stop down
    if (t < 1/8000) {
      const over = Math.log2((1/8000)/t);           // stops beyond the ceiling
      const combo = bestCombo(over);
      r.combo = combo;
      if (combo) {
        const applied = Math.min(Math.max(over, combo.min), combo.max);
        r.ndApplied = applied;
        if (combo.variable) r.vndDial = Math.max(0, Math.round((applied - combo.fixAdd)*10)/10);
        t = t * Math.pow(2, applied);
      }
      if (t < 1/8000) {
        const still = Math.log2((1/8000)/t);
        const Nn = ceilIn(AP_SERIES, N * Math.pow(2, still/2));
        if (Nn > 16) { r.apImpossible = true; r.N = 16; t = 1/8000; }
        else { r.N = Nn; t = t * Math.pow(2, still); }
        r.apForced = true;
        r.shutOver = true;
      }
    }

    // too slow to hand-hold? lift ISO in steps
    let guard=0;
    while (t > handRule && iso < 12800 && guard++ < 40) {
      iso = ISO_SERIES[Math.min(ISO_SERIES.indexOf(nearest(ISO_SERIES,iso))+1, ISO_SERIES.length-1)];
      t = (r.N*r.N) / Math.pow(2, (L.ev - r.ndApplied) + Math.log2(iso/100));
    }
    if (r.ndApplied > 0.4) t = (r.N*r.N) / Math.pow(2, (L.ev - r.ndApplied) + Math.log2(iso/100));
    r.iso = nearest(ISO_SERIES, iso);
    r.t   = nearest(SH_SERIES, t);
    r.tooSlow  = r.t > handRule*1.3;
    r.isoHigh  = r.iso >= 3200;
    r.isoOver  = r.iso >= 12800;
  }
  return r;
}

const S_  = () => SUBJECT.find(x=>x.id===sel.subject);
const P_  = () => PROFILE.find(x=>x.id===sel.profile);
const txt = (o,i) => o[appLang][i];
const val = x => (x && typeof x==='object' && !Array.isArray(x)) ? x[appLang] : x;

function lensObj(){
  if (!sel.lens) return null;
  if (sel.lens === 'manual') {
    const a=parseFloat(manualLens.apMax), f1=parseFloat(manualLens.fMin), f2=parseFloat(manualLens.fMax);
    if (!a||!f1) return null;
    return { id:'manual', n:`${f1}${f2&&f2!==f1?'–'+f2:''}mm F${a}`, f:[f1, f2||f1], a:[a,a], fmt:'?', oss:false };
  }
  return LENSES.find(x=>x.id===sel.lens) || null;
}
function lensName(){ const L=lensObj(); return L ? (typeof L.n==='object'?val(L.n):L.n) : null; }

const SCREENS = [
 {type:'radio',data:LIGHTING,key:'lighting'},
 {type:'radio',data:SUBJECT, key:'subject'},
 {type:'lens', data:LENSES,  key:'lens'},
 {type:'check',data:GEAR,    key:'gear'},
 {type:'radio',data:PROFILE, key:'profile'}
];
const NSCR = SCREENS.length;

function isVideo(){ return ['slog3','scinetone','pp-custom'].includes(sel.profile) || ['talking','walk'].includes(sel.subject); }
function areaFor(S){ return val(isVideo() ? S.areaV : S.areaS); }

function computeParams(){
  const L=L_(),S=S_(),P=P_(),LN=lensObj(),v=isVideo(),p={},E=computeExposure();
  p[t().p.profile]= P?txt(P,0):null;
  p[t().p.lens]   = lensName();
  p[t().p.eqf]    = LN ? (LN.f[0]===LN.f[1] ? Math.round(LN.f[0]*CROP)+' мм' : Math.round(LN.f[0]*CROP)+'–'+Math.round(LN.f[1]*CROP)+' мм') : null;
  p[t().p.format] = (v&&sel.profile!=='raw-photo')
      ? 'XAVC S 4K '+sel.fps+'p '+fpsObj().mbps+'M'
      : (sel.profile==='raw-photo'?'RAW + JPEG':null);
  p[t().p.shutter]= E?fmtShut(E.t):null;
  p[t().p.ap]     = E?('f/'+E.N):(S?S.apR:null);
  p[t().p.iso]    = E?(E.isoUp?E.isoUp:E.iso):null;
  p[t().p.wb]     = L?val(L.wb):null;
  p[t().p.zebra]  = L?L.zebra:null;
  p[t().p.nd]     = E ? (E.ndApplied>0.4
      ? stops(E.ndApplied) + (E.combo? ' · '+comboLabel(E.combo) : '')
      : (hasFilters()? (appLang==='ru'?'есть, не нужен':'fitted, not needed') : t().noNd)) : null;
  p[t().p.hand]   = (E&&!E.video&&E.handRule) ? fmtShut(nearest(SH_SERIES,E.handRule)) : null;
  p[t().p.focus]  = S?val(S.focus):null;
  p[t().p.area]   = S?areaFor(S):null;
  p[t().p.stab]   = S?(sel.gear.includes('tripod')?t().off:(sel.gear.includes('gimbal')?t().stdStab:val(S.stab))):null;
  const g=sel.gear.filter(x=>x!=='none').map(id=>txt(GEAR.find(x=>x.id===id),0));
  p[t().p.gear]   = sel.gear.length?(sel.gear.includes('none')?t().noGear:g.join(', ')):null;
  return p;
}

function renderPreview(){
  const el=document.getElementById('prev');
  const any=sel.lighting||sel.subject||sel.lens||sel.gear.length||sel.profile;
  if(!any||page===99||page===NSCR+1){ el.style.display='none'; return; }
  el.style.display='block';
  document.getElementById('prevLabel').textContent=t().preview;
  document.getElementById('prevBar').className='prev-bar'+(prevOpen?' open':'');
  const b=document.getElementById('prevBody');
  b.className='prev-body'+(prevOpen?' open':'');
  const E=computeExposure();
  b.innerHTML=Object.entries(computeParams()).map(([k,v])=>{
    let cls = v?'':'empty';
    if(v && E && (k===t().p.shutter||k===t().p.ap||k===t().p.iso||k===t().p.nd||k===t().p.hand)) cls='calc';
    if(v && E && k===t().p.ap)      cls = E.apImpossible?'bad' : (E.apForced||E.apLimited)?'warn' : cls;
    if(v && E && k===t().p.iso)     cls = E.isoOver?'bad' : (E.isoUp||E.isoHigh)?'warn' : cls;
    if(v && E && k===t().p.shutter) cls = E.shutOver?'bad' : E.tooSlow?'warn' : cls;
    return `<div class="prev-row"><span class="pk">${k}</span><span class="pv ${cls}">${v||t().notSet}</span></div>`;
  }).join('');
}

          if(!showDense) block += `<div class="ndmore" onclick="ndDense(event)">${appLang==='ru'?'Плотнее — ND128 и выше ▾':'Denser — ND128 and up ▾'}</div>`;
        }
        block += `</div>`;
      }
      return block;
    };
    html += '<div class="opts">' + primary.map(draw).join('');
    if(secondary.length){
      if(showAll){
        html += `<div class="divider">${appLang==='ru'?'Менее подходящие для этой сцены':'Less suited to this scene'}</div>`
              + secondary.map(draw).join('');
      } else {
        html += `<div class="showall" onclick="revealAll(event)">${appLang==='ru'
                 ? 'Показать остальные ('+secondary.length+') ▾'
                 : 'Show the rest ('+secondary.length+') ▾'}</div>`;
      }
    }
    html += '</div>';
  }
  document.getElementById('body').innerHTML=html;

  const bot=document.getElementById('bot');
  const back = `<button class="btn btn-sec" onclick="navBack()" ${page===0?'disabled':''}>${t().back}</button>`;
  let fwd = '';
  if(S.type==='check')
    fwd = `<button class="btn btn-pri" onclick="goNext()" ${sel[S.key].length?'':'disabled'}>${t().next}</button>`;
  else if(S.key==='profile' && sel.profile && sel.profile!=='raw-photo')
    fwd = `<button class="btn btn-pri" onclick="goNext()">${t().apply}</button>`;
  else if(S.type==='lens' && showManualForm)
    fwd = `<button class="btn btn-pri" onclick="goNext()" ${lensObj()?'':'disabled'}>${t().apply}</button>`;
  bot.style.display='flex';
  bot.innerHTML = back + fwd;
}

/* ── filters actually in the bag ── */
function myVnds(){
  return sel.ndVario.map(id=>{
    if(id==='v-cust'){
      const a=parseFloat(vndCustom.min), b=parseFloat(vndCustom.max);
      if(isNaN(b)) return null;
      return { id, min:isNaN(a)?0:a, max:b, nm:'VND '+(isNaN(a)?0:a)+'–'+b };
    }
    const o=VND_OPTS.find(x=>x.id===id);
    return o ? { id, min:o.min, max:o.max, nm:o.nm||txt(o,0) } : null;
  }).filter(Boolean);
}
function myFixed(){ return sel.ndFixed.map(id=>FIX_OPTS.find(f=>f.id===id)).filter(Boolean); }
function hasFilters(){ return sel.gear.includes('nd') && (myVnds().length||myFixed().length); }

/* subsets of fixed filters up to n elements */
function subsetsOf(arr,n){
  const out=[[]];
  const rec=(start,cur)=>{ if(cur.length>=n) return;
    for(let i=start;i<arr.length;i++){ const nx=[...cur,arr[i]]; out.push(nx); rec(i+1,nx); } };
  rec(0,[]);
  return out;
}

/* pick the best filter combination for the required number of stops */
function bestCombo(need){
  if(!hasFilters()) return null;
  const vnds=myVnds(), fixs=myFixed(), cands=[];
  const fsubs=subsetsOf(fixs,3);
  for(const fs of fsubs){
    if(!fs.length) continue;
    const sum=fs.reduce((a,b)=>a+b.st,0);
    cands.push({min:sum,max:sum,parts:fs.map(x=>x.nm),n:fs.length,variable:false});
  }
  for(const v of vnds){
    for(const fs of fsubs){
      if(fs.length>2) continue;
      const add=fs.reduce((a,b)=>a+b.st,0);
      cands.push({min:v.min+add,max:v.max+add,parts:[v.nm,...fs.map(x=>x.nm)],
                  n:1+fs.length,variable:true,vnd:v,fixAdd:add});
    }
  }
  if(!cands.length) return null;
  const fits=cands.filter(c=>need>=c.min-0.15&&need<=c.max+0.15);
  if(fits.length){
    fits.sort((a,b)=> a.n-b.n || (b.variable?1:0)-(a.variable?1:0) || (a.max-a.min)-(b.max-b.min));
    return {...fits[0], exact:true};
  }
  /* nothing covers it — return the closest reachable */
  cands.sort((a,b)=>{
    const da = need>a.max ? need-a.max : a.min-need;
    const db = need>b.max ? need-b.max : b.min-need;
    return da-db || a.n-b.n;
  });
  return {...cands[0], exact:false};
}
function comboLabel(c){
  if(!c) return null;
  return c.parts.join(' + ');
}

const FIXED_ND=[{f:'ND2',st:1},{f:'ND4',st:2},{f:'ND8',st:3},{f:'ND16',st:4},
                {f:'ND32',st:5},{f:'ND64',st:6},{f:'ND256',st:8},{f:'ND1000',st:10}];
function suggestStack(shortfall){
  const pick = FIXED_ND.find(x=>x.st>=shortfall-0.15) || FIXED_ND[FIXED_ND.length-1];
  return pick;
}
function ndLabel(){
  const r=ndRange(); if(!r) return null;
  return r.min===r.max ? stops(r.max) : r.min+'–'+stops(r.max);
}

/* ═════ STEPS ═════ */
function buildSteps(){
  const L=L_(),S=S_(),P=P_();
  if(!L||!S||!P) return [];
  const LN=lensObj(),g=sel.gear,v=isVideo(),ru=appLang==='ru';
  const E=computeExposure(); const out=[];
  const row=(k,value,o)=>({n:cm(k),v:value,...o});

  out.push({type:'phys',t:ru?'Верхний диск камеры':'Top mode dial',
    i:v?(ru?'Установите режим Movie (значок киноленты)':'Set to Movie (film icon)')
       :(ru?'Установите режим Still (значок фотоаппарата)':'Set to Still (camera icon)'),
    h:ru?'Диск Still / Movie / S&Q находится под диском режима экспозиции'
        :'The Still / Movie / S&Q dial sits under the exposure mode dial'});

  out.push({type:'phys',t:ru?'Режим экспозиции':'Exposure mode',
    i:(S.id==='landscape'||S.id==='architecture')?(ru?'Установите A (приоритет диафрагмы) или M':'Set A (aperture priority) or M')
      :(ru?'Установите M (ручной)':'Set M (manual)'),
    h:ru?'M даёт полный контроль над всеми параметрами':'M gives full control over every parameter'});

  if(sel.profile==='slog3'){
    out.push({type:'menu',crumb:[cm('menu'),cm('shooting'),cm('imgRec')],
      rows:[row('fileFormat','XAVC S 4K'),row('movieSet','…'),row('logSet','›',{hot:true})],
      hint:ru?`Войдите в <b>${cm('logSet')}</b>`:`Open <b>${cm('logSet')}</b>`});
    out.push({type:'menu',crumb:['…',cm('logSet')],
      rows:[row('logShoot','On (Flexible ISO)',{ok:true}),row('colorGamut','S-Gamut3.Cine',{ok:true}),row('embedLut','Off',{ok:true})],
      hint:ru?'На A6700 доступен только Flexible ISO. <b>S-Gamut3.Cine</b> — для грейдинга в Rec.709. <b>Embed LUT: Off</b> — в файл пишется чистый log'
             :'The A6700 only offers Flexible ISO. <b>S-Gamut3.Cine</b> for Rec.709 grading. <b>Embed LUT: Off</b> records clean log'});
    out.push({type:'menu',crumb:[cm('menu'),cm('setup'),cm('dispOpt')],
      rows:[row('dispLut','On',{ok:true}),row('selLut','s709',{ok:true,hot:true})],
      hint:ru?'Превью с LUT — плоскую log-картинку трудно оценивать глазом':'LUT preview — flat log is hard to judge by eye'});
  } else if(sel.profile==='scinetone'){
    out.push({type:'menu',crumb:[cm('menu'),cm('shooting'),cm('imgColor')],
      rows:[row('picProfile','PP11 (S-Cinetone)',{ok:true,hot:true})],
      hint:ru?'Готовая кинематографичная картинка':'Ready cinematic look'});
  } else if(sel.profile==='pp-custom'){
    out.push({type:'menu',crumb:[cm('menu'),cm('shooting'),cm('imgColor'),cm('picProfile')],
      rows:[{n:ru?'Выберите профиль':'Select profile',v:'PP1 – PP6',hot:true},
            {n:'Gamma',v:ru?'по задаче':'per task',ok:true},{n:'Color Mode',v:ru?'по задаче':'per task',ok:true},
            {n:'Detail',v:'−7 … 0',ok:true}],
      hint:ru?'PP1–PP6 свободны для своих настроек. PP7, PP8 и PP9 на A6700 отсутствуют'
             :'PP1–PP6 are free. PP7, PP8 and PP9 do not exist on the A6700'});
  } else if(sel.profile==='creative'){
    out.push({type:'menu',crumb:[cm('menu'),cm('shooting'),cm('imgColor')],
      rows:[row('creative','ST / PT / VV / FL …',{ok:true,hot:true})],
      hint:ru?'ST — нейтральный, PT — портрет, VV — насыщенный, FL — кинематографичный':'ST neutral, PT portrait, VV vivid, FL film-like'});
  } else {
    out.push({type:'menu',crumb:[cm('menu'),cm('shooting'),cm('imgRec')],
      rows:[row('fileFormat','RAW + JPEG',{ok:true,hot:true}),row('rawType',ru?'Без сжатия / со сжатием':'Uncompressed / compressed',{ok:true})],
      hint:ru?'RAW+JPEG даёт свободу обработки и готовые снимки для просмотра':'RAW+JPEG gives editing freedom plus ready files'});
  }

  if(v&&sel.profile!=='raw-photo'){
    out.push({type:'menu',crumb:[cm('menu'),cm('shooting'),cm('imgRec')],
      rows:[row('fileFormat','XAVC S 4K',{ok:true}),
            row('movieSet',sel.fps+'p · '+fpsObj().mbps+'M · 4:2:2 10bit',{ok:true,hot:true})],
      hint:ru?`${sel.fps}p в XAVC S 4K 4:2:2 10-бит идёт на ${fpsObj().mbps} Мбит/с. Система ${fpsObj().sys} — переключается в НАСТРОЙКА → NTSC/PAL`
             :`${sel.fps}p in XAVC S 4K 4:2:2 10-bit runs at ${fpsObj().mbps} Mbps. ${fpsObj().sys} system — switch it in SETUP → NTSC/PAL`,
      note: sel.fps>=100 ? (ru?'На 100p и 120p добавляется кроп 1.6× и Активная стабилизация недоступна'
                              :'At 100p and 120p there is an extra 1.6× crop and Active stabilisation is unavailable') : null});
  }

  /* ---- computed exposure card ---- */
  if(E){
    const rows=[];
    rows.push([ru?'Затвор':'Shutter', fmtShut(E.t), E.shutOver?'bad':(E.tooSlow?'warn':'')]);
    rows.push([ru?'Диафрагма':'Aperture', 'f/'+E.N, E.apImpossible?'bad':((E.apForced||E.apLimited)?'warn':'')]);
    rows.push([ru?'ISO':'ISO', String(E.isoUp||E.iso), E.isoOver?'bad':((E.isoUp||E.isoHigh)?'warn':'')]);
    if(E.combo && E.ndApplied>0.4){
      rows.push([ru?'Фильтр':'Filter', comboLabel(E.combo), '']);
      rows.push([ru?'Плотность':'Density', stops(E.ndApplied)
        + (E.vndDial!=null && E.combo.variable
            ? ' · ' + (ru?'варио на ':'VND at ') + stops(E.vndDial) : ''), '']);
    } else if(hasFilters()){
      rows.push([ru?'Фильтр':'Filter', ru?'не нужен':'not needed','']);
    }
    else if(E.video&&E.needStops>0.4) rows.push([ru?'ND нужен':'ND needed', stops(E.needStops),'warn']);
    if(!E.video&&E.handRule) rows.push([ru?'Предел с рук':'Handheld limit', fmtShut(nearest(SH_SERIES,E.handRule)),'']);

    let warn='', bad='';
    if(E.apLimited) warn += (ru
      ? `Сценарий просит f/${S.apT}, объектив открывается только до f/${E.widest}. Размытие фона будет слабее.`
      : `The scenario calls for f/${S.apT}; the lens only opens to f/${E.widest}. Less background separation.`);
    if(E.apForced && E.N > E.Ntarget) warn += (warn?'<br><br>':'') + (ru
      ? `Диафрагма закрыта с f/${E.Ntarget} до f/${E.N}: ` + (E.combo
          ? `${comboLabel(E.combo)} не хватает, чтобы погасить свет.`
          : `без фильтра свет гасить нечем.`) + ` Глубина резкости вырастет.`
      : `Aperture closed from f/${E.Ntarget} to f/${E.N}: ` + (E.combo
          ? `${comboLabel(E.combo)} cannot absorb all the light.`
          : `there is no filter to absorb the light.`) + ` Depth of field increases.`);
    if(E.apForced && E.N < E.Ntarget) warn += (warn?'<br><br>':'') + (ru
      ? `Диафрагма открыта с f/${E.Ntarget} до f/${E.N}: фильтр плотнее, чем нужно для этой сцены.`
      : `Aperture opened from f/${E.Ntarget} to f/${E.N}: the filter is denser than this scene needs.`);
    if(E.isoUp) warn += (warn?'<br><br>':'') + (ru
      ? `Света не хватает — ISO поднято до ${E.isoUp}.`
      : `Not enough light — ISO raised to ${E.isoUp}.`);
    if(!E.video&&E.isoHigh&&!E.tooSlow&&!E.isoOver&&!E.astro) warn += (warn?'<br><br>':'') + (ru
      ? `Чтобы удержать ${fmtShut(E.t)} с рук на этом фокусном, ISO поднято до ${E.iso}. Со штативом можно вернуться к ISO ${Math.max(P.baseIso,L.isoMin)}.`
      : `Holding ${fmtShut(E.t)} handheld pushes ISO to ${E.iso}. On a tripod you can drop back to ISO ${Math.max(P.baseIso,L.isoMin)}.`);
    if(E.astro){
      warn += (warn?'<br><br>':'') + (ru
        ? `Выдержка ${fmtShut(E.t)} посчитана по правилу 500: дольше — и звёзды вытянутся в чёрточки. Штатив обязателен, спуск через автоспуск или пульт. Фокус вручную на бесконечность с увеличением по яркой звезде.`
        : `${fmtShut(E.t)} comes from the 500 rule: any longer and stars trail. Tripod essential, release via self-timer or remote. Focus manually to infinity, magnified on a bright star.`);
    } else if(!E.video&&E.tooSlow) warn += (warn?'<br><br>':'') + (ru
      ? `Выдержка ${fmtShut(E.t)} длиннее предела для этого фокусного — нужен упор или штатив.`
      : `${fmtShut(E.t)} is slower than the handheld limit — use support.`);
    if(E.video&&E.needStops>0.4&&!hasFilters()) warn += (warn?'<br><br>':'') + (ru
      ? `ND фильтр не выбран, а нужно около ${stops(E.needStops)}. Пока свет гасится диафрагмой.`
      : `No ND selected but about ${Math.round(E.needStops*10)/10} stops are needed. The aperture is absorbing it instead.`);

    /* what to stack on top to keep the target aperture */
    if(E.shortfall>0.4){
      const add = suggestStack(E.shortfall);
      if(E.combo){
        warn += (warn?'<br><br>':'') + (ru
          ? `Чтобы сохранить f/${E.Ntarget}: добавьте <b>${add.f}</b> (${stops(add.st)}) к текущей сборке. Отметьте его в списке фильтров — приложение пересчитает.`
          : `To keep f/${E.Ntarget}: add <b>${add.f}</b> (${add.st} stops) to the current stack. Tick it in the filter list and the app will recalculate.`);
      } else {
        warn += (warn?'<br><br>':'') + (ru
          ? `Чтобы снимать на f/${E.Ntarget}, нужен фильтр примерно на ${stops(E.shortfall)} — ближайший стандартный <b>${add.f}</b>.`
          : `To shoot at f/${E.Ntarget} you need roughly ${E.shortfall.toFixed(1)} stops — the nearest standard is <b>${add.f}</b>.`);
      }
    }
    if(E.combo && !E.combo.exact && E.residual < -0.4){
      warn += (warn?'<br><br>':'') + (ru
        ? `Самая светлая доступная сборка — ${comboLabel(E.combo)}, минимум ${stops(E.combo.min)}. Для этой сцены это плотнее, чем нужно.`
        : `The lightest available stack is ${comboLabel(E.combo)}, minimum ${E.combo.min} stops — denser than this scene needs.`);
    }

    if(E.apImpossible){
      const short16 = Math.max(0, (E.needStops||0) - (E.ndApplied||0) - 2*Math.log2(16/E.Ntarget));
      const add = suggestStack(short16>0.4?short16:1);
      bad = (ru
        ? `Даже на f/16 света слишком много — не хватает примерно ${stops(short16)}. Нужен фильтр плотнее: добавьте <b>${add.f}</b>. Как временный выход — укоротить выдержку, но пропадёт киношное смазывание.`
        : `Even at f/16 there is too much light — about ${Math.round(short16*10)/10} stops over. Add a denser filter such as <b>${add.f}</b>. As a stopgap, shorten the shutter — but the cinematic motion blur goes.`);
    }
    if(E.isoOver) bad += (bad?'<br><br>':'') + (ru
      ? `ISO ${E.isoUp||E.iso} — за пределом комфортного диапазона. Нужен светосильнее объектив, штатив или дополнительный свет.`
      : `ISO ${E.isoUp||E.iso} is past the comfortable range. You need a faster lens, a tripod or more light.`);
    if(E.shutOver) bad += (bad?'<br><br>':'') + (ru
      ? `Выдержка упирается в потолок 1/8000. Нужен ND, иначе снять на такой диафрагме не выйдет.`
      : `The shutter hits the 1/8000 ceiling. An ND filter is required to shoot at this aperture.`);

    out.push({type:'calc',rows,warn,bad,note:t().evNote});
  }

  out.push({type:'menu',crumb:[cm('menu'),cm('shooting'),cm('expColor')],
    rows:[row('shutter',E?fmtShut(E.t):'—',{ok:true}),row('iso',E?String(E.isoUp||E.iso):'—',{ok:true}),
          row('aperture',E?'f/'+E.N:S.apR,{ok:true,hot:true})],
    hint:v?(ru?`Затвор ${fmtShut(vidShutter())} — это ${angleObj().deg}° при ${sel.fps}p. Экспозицию правим диафрагмой и ND`
              :`Shutter ${fmtShut(vidShutter())} is ${angleObj().deg}° at ${sel.fps}p. Control exposure with aperture and ND`)
          :(ru?`Диафрагма определяет глубину резкости. Диапазон под задачу — ${S.apR}`
              :`Aperture drives depth of field. Range for this task — ${S.apR}`)});

  if(g.includes('nd')&&E&&E.ndApplied>0.4){
    out.push({type:'phys',t:ru?'ND или VND фильтр':'ND or VND filter',
      i:(ru?'Установите плотность около ':'Set density to about ')+stops(E.ndApplied),
      h:ru?'Проверьте экспозицию по зебре после установки. При сильном ND автофокус может замедлиться'
          :'Check exposure with zebra afterwards. Strong ND can slow autofocus'});
  }

  out.push({type:'menu',crumb:[cm('menu'),cm('shooting'),cm('expColor')],
    rows:[row('wb',val(L.wb),{ok:true,hot:true}),row('zebraDisp',t().on,{ok:true}),row('zebraLvl',L.zebra,{ok:true})],
    hint:ru?`Освещение: ${txt(L,1).toLowerCase()}. Ручной баланс белого стабильнее автоматического при монтаже`
           :`Lighting: ${txt(L,1).toLowerCase()}. Manual white balance is more consistent in the edit`,
    note:ru?'Готовый ряд зебры — 70 / 75 / 80 / 85 / 90 / 95 / 100 / 100+. Custom 1 и Custom 2 принимают произвольное значение и держат два порога сразу'
           :'Zebra preset list is 70 / 75 / 80 / 85 / 90 / 95 / 100 / 100+. Custom 1 and Custom 2 accept any value and hold two thresholds at once'});

  let sv=val(S.stab);
  if(g.includes('tripod')) sv=t().off; else if(g.includes('gimbal')) sv=t().stdStab;
  const noActive = v && sel.fps>=100;
  if(noActive && sv!==t().off) sv=t().stdStab;
  const sOff=sv===t().off;
  out.push({type:'menu',crumb:[cm('menu'),cm('shooting'),cm('stab')],
    rows:[row('steady',sOff?t().off:t().on,{ok:true,hot:sOff}),
          ...(sOff?[]:[row('steadyMode',sv,{ok:true,hot:true})]),row('steadyAdj','Auto',{ok:true})],
    hint:g.includes('tripod')?(ru?'На штативе стабилизация вносит микродрожание — её отключают':'On a tripod, stabilisation adds micro-jitter')
        :(g.includes('gimbal')?(ru?'Гимбал уже стабилизирует, активный режим может с ним конфликтовать':'The gimbal already stabilises; Active can fight it')
        :(ru?'Активная — максимальная компенсация, но с кропом кадра':'Active gives the most compensation but crops the frame')),
    note: noActive ? (ru?`На ${sel.fps}p Активная стабилизация недоступна — только Стандартная`
                        :`Active stabilisation is unavailable at ${sel.fps}p — Standard only`)
        : ((LN&&!LN.oss&&!g.includes('tripod'))?(ru?'У этого объектива нет оптической стабилизации — работает только матричная в камере'
                                                 :'This lens has no optical stabilisation — only in-body stabilisation applies'):null)});

  const eye=val(S.focus).match(/глаз|eye/i);
  out.push({type:'menu',crumb:[cm('menu'),cm('focus'),cm('afmf')],
    rows:[row('focusMode',val(S.focus).split(',')[0],{ok:true}),
          {n:cm('focusArea'),v:areaFor(S),ok:true,hot:true},
          ...(eye?[row('subjRecog',ru?'Вкл. · Человек':'On · Human',{ok:true})]:[]),
          ...(v?[row('afTrans',S.id==='action'?'6–7':'3–4',{ok:true})]:[]),
          ...(v?[row('afShift',S.id==='action'?'4–5':'2',{ok:true})]:[])],
    hint:`${txt(S,1)}. ${val(S.focus)}`,
    note:v?(ru?'Отслеживание объекта как вариант области фокусировки есть только в фоторежиме. В видео удержание задают AF Transition Speed 1–7 и AF Subj. Shift Sensitivity 1–5'
              :'Subject tracking as a focus area option exists in stills only. In movie mode AF Transition Speed 1–7 and AF Subj. Shift Sensitivity 1–5 govern focus holding')
          :(ru?'В фоторежиме отслеживание доступно для любой области — от широкой до пятна S'
              :'In stills, tracking is available for every area type — from Wide down to Spot S')});

  if(val(S.focus).match(/РФ|MF/)){
    out.push({type:'menu',crumb:[cm('menu'),cm('focus'),cm('focusAsst')],
      rows:[row('autoMag',t().on,{ok:true,hot:true}),row('initMag','x4.0',{ok:true}),
            row('magTime',ru?'5 сек':'5 sec',{ok:true}),row('peaking',t().on,{ok:true}),
            row('peakLvl',ru?'Средний':'Mid',{ok:true})],
      hint:ru?'При повороте кольца фокуса кадр автоматически увеличится':'Turning the focus ring magnifies the frame automatically',
      note:ru?'Доступные значения увеличения — x1.0 и x4.0, для фото и видео задаются отдельно'
             :'Available magnifications are x1.0 and x4.0, set separately for stills and movies'});
  }

  if(g.includes('mic')) out.push({type:'menu',crumb:[cm('menu'),cm('shooting'),cm('audioRec')],
    rows:[row('audioOn',t().on,{ok:true}),row('audioLvl',ru?'Ручной · пик −12 dB':'Manual · peak −12 dB',{ok:true,hot:true}),
          row('windNr',t().off,{ok:true})],
    hint:ru?'Ручной уровень стабильнее автоматического':'Manual level is steadier than auto'});

  if(g.includes('flash')) out.push({type:'menu',crumb:[cm('menu'),cm('shooting'),cm('shootDisp'),cm('liveView')],
    rows:[row('setEffect',t().on,{ok:true}),row('expEffect',ru?'Эксп. и вспышка':'Exposure & Flash',{ok:true,hot:true})],
    hint:ru?'Для студийного импульсного света выберите «Только экспозиция»':'For studio strobes choose “Exposure Only”'});

  if(g.includes('monitor')) out.push({type:'menu',crumb:[cm('menu'),cm('setup'),cm('extOut')],
    rows:[row('hdmiRes',ru?'Auto или 2160p':'Auto or 2160p',{ok:true}),row('hdmiInfo',t().off,{ok:true,hot:true})],
    hint:ru?'Чистая картинка на внешний монитор без служебных данных':'Clean feed to the external monitor',
    note:ru?'Зебра не отображается на устройстве, подключённом по HDMI':'Zebra is not shown on a device connected via HDMI'});

  if(g.includes('light')){
    const led=ledSpec(), amb=ambientK();
    if(!led){
      out.push({type:'phys',t:ru?'Накамерный свет':'On-camera light',
        i:ru?'Укажите параметры лампы на экране оснащения':'Set the light parameters on the rig screen',
        h:ru?'Без температуры лампы посчитать баланс белого нельзя':'Without the light temperature the white balance cannot be computed'});
    } else if(!led.fixed){
      const inRange = amb>=led.min && amb<=led.max;
      const setK = inRange ? amb : (amb<led.min?led.min:led.max);
      out.push({type:'phys',t:ru?'Накамерный свет · bi-color':'On-camera light · bi-colour',
        i:(ru?'Выставьте на панели ':'Set the panel to ')+setK+'K',
        h: inRange
          ? (ru?`Окружающий свет около ${amb}K, панель попадает в него точно. Баланс белого в камере — ${setK}K, смешанного освещения не будет.`
               :`Ambient is around ${amb}K and the panel reaches it exactly. Set camera WB to ${setK}K; no mixed lighting.`)
          : (ru?`Окружающий свет около ${amb}K, панель до него не дотягивает — ставьте край диапазона ${setK}K. Баланс белого в камере — ${setK}K, фон уйдёт в ${amb>setK?'тепло':'холод'}.`
               :`Ambient is around ${amb}K, beyond the panel range — use the ${setK}K end. Camera WB ${setK}K; the background will shift ${amb>setK?'warm':'cool'}.`)});
    } else {
      const d=amb-led.k, gel=gelFor(led.k,amb);
      const close=Math.abs(d)<400;
      out.push({type:'phys',t:ru?'Накамерный свет · фиксированный':'On-camera light · fixed',
        i: close ? (ru?`Лампа ${led.k}K совпадает с окружающим светом`:`The ${led.k}K light matches the ambient`)
                 : (ru?`Лампа ${led.k}K против окружающих ${amb}K — смешанное освещение`
                      :`${led.k}K light against ${amb}K ambient — mixed lighting`),
        h: close ? (ru?`Баланс белого в камере — ${amb}K, конфликта нет.`:`Set camera WB to ${amb}K, no conflict.`)
                 : (ru?`Расхождение ${Math.abs(d)}K. Три выхода. Первый — надеть на лампу гель ${gel||'коррекции'}, тогда WB ${amb}K и всё сойдётся. Второй — выставить WB ${led.k}K по лампе: лицо будет верным, фон уйдёт в ${d>0?'тепло':'холод'}. Третий — компромисс WB ${Math.round((amb+led.k)/2)}K, слегка мимо и там и там.`
                      :`A ${Math.abs(d)}K gap. Three ways out. First, gel the light with ${gel||'a correction gel'}, then WB ${amb}K matches everything. Second, set WB ${led.k}K to the lamp: the face is right, the background shifts ${d>0?'warm':'cool'}. Third, compromise at WB ${Math.round((amb+led.k)/2)}K, slightly off on both.`)});
    }
  }

  if(g.includes('flash') && !v){
    const shut = E ? E.t : 1/160;
    const needHss = shut < SYNC_SPEED - 1e-9;
    const role = sel.flRole==='fill', man = sel.flMode==='man', rear = sel.flCurt==='rear';
    const rows=[
      {n:ru?'Режим вспышки':'Flash mode', v: role?(ru?'Заполняющая':'Fill-flash'):(ru?'Основной свет':'Key light'), ok:true},
      {n:ru?'Мощность':'Power', v: man?(ru?'Ручная':'Manual'):'TTL', ok:true},
      {n:ru?'Синхронизация':'Sync', v: rear?(ru?'По второй шторке':'Rear curtain'):(ru?'По первой шторке':'First curtain'), ok:true},
      {n:ru?'Коррекция вспышки':'Flash comp.', v: role?'−1 … −1.7 EV':'0 … −0.3 EV', ok:true, hot:role},
      {n:'HSS', v: needHss?(ru?'Включить':'Enable'):(ru?'Не нужен':'Not needed'), ok:true, hot:needHss}
    ];
    out.push({type:'menu',crumb:[cm('menu'),cm('shooting'),ru?'Вспышка':'Flash'],rows,
      hint: needHss
        ? (ru?`Расчётная выдержка ${fmtShut(shut)} короче предела синхронизации A6700 в 1/160. Без HSS кадр перечеркнёт тёмная полоса. HSS съедает мощность — вспышка добьёт максимум пару метров.`
             :`The computed ${fmtShut(shut)} is faster than the A6700 sync limit of 1/160. Without HSS a dark band cuts the frame. HSS costs power — expect a couple of metres of reach.`)
        : (ru?`Выдержка ${fmtShut(shut)} укладывается в предел синхронизации 1/160, HSS не нужен. Выдержка правит фон, вспышка — объект.`
             :`${fmtShut(shut)} fits inside the 1/160 sync limit, no HSS needed. Shutter controls the background, flash controls the subject.`),
      note: rear
        ? (ru?'По второй шторке смазанный след остаётся позади движения — работает только на длинных выдержках, на коротких разницы нет'
             :'Rear curtain leaves the blur trail behind the motion — only visible at slow shutter speeds')
        : (man?(ru?'Ручная мощность не пляшет от кадра к кадру, но при смене дистанции её надо пересчитывать'
                  :'Manual power is consistent frame to frame but must be redialled when the distance changes')
              : (ru?'TTL подстраивается сам, но может ошибаться на очень светлом или очень тёмном фоне'
                   :'TTL adapts by itself but can be fooled by very bright or very dark backgrounds'))});
  }
  if(g.includes('flash') && v){
    out.push({type:'phys',t:ru?'Вспышка в видеорежиме':'Flash in movie mode',
      i:ru?'Вспышка при съёмке видео не работает':'Flash does not fire while recording video',
      h:ru?'Для видео нужен постоянный свет — светодиодная панель. Вспышка сработает только в фоторежиме.'
          :'Video needs continuous light — an LED panel. The flash only fires in stills mode.'});
  }

  if(g.includes('tripod')) out.push({type:'phys',t:ru?'Съёмка со штатива':'Tripod shooting',
    i:ru?'Проверьте что стабилизация отключена и камера закреплена':'Check stabilisation is off and the camera is locked down',
    h:ru?'Для длинных выдержек используйте автоспуск или пульт':'For long exposures use the self-timer or a remote'});

  if(g.includes('gimbal')) out.push({type:'phys',t:ru?'Балансировка гимбала':'Gimbal balancing',
    i:ru?'Отбалансируйте: наклон, крен, панорама — в этом порядке':'Balance: tilt, roll, pan — in that order',
    h:ru?'Балансировать с установленным фильтром и полностью собранной камерой':'Balance with the filter fitted and the rig fully assembled'});

  out.push({type:'menu',crumb:[cm('menu'),cm('shooting'),cm('shootMode')],
    rows:[row('regMode','→ M1 / M2 / M3',{ok:true,hot:true})],
    hint:ru?'Вызов — верхний диск камеры в положение 1, 2 или 3':'Recall with the top dial at 1, 2 or 3'});

  return out;
}

function renderSteps(){
  if(!steps || !steps.length){ steps = buildSteps(); }
  if(!steps.length){ page = NSCR-1; renderPicker(); return; }
  if(stepIdx < 0) stepIdx = 0;
  if(stepIdx > steps.length-1) stepIdx = steps.length-1;
  const st=steps[stepIdx];
  document.getElementById('hdrStep').textContent=t().setupTitle;
  document.getElementById('hdrTitle').textContent=t().stepN(stepIdx+1,steps.length);
  renderPreview(); renderChips();
  const dots=steps.map((_,i)=>`<div class="dot ${i<stepIdx?'done':i===stepIdx?'now':''}"></div>`).join('');
  let h=`<div class="prog"><div class="prog-t">${t().doOnCam}</div><div class="dots">${dots}</div></div>`;
  if(st.type==='phys'){
    h+=`<div class="pcard"><div class="pt">⚙ ${st.t}</div><div class="pi">${st.i}</div><div class="ph">${st.h}</div></div>`;
  } else if(st.type==='calc'){
    h+=`<div class="ccard"><div class="ct">∑ ${t().calcH}</div>`+
       st.rows.map(([k,v,c])=>`<div class="crow"><span class="ck">${k}</span><span class="cv ${c||''}">${v}</span></div>`).join('')+
       (st.warn?`<div class="cwarn">${st.warn}</div>`:'')+
       (st.bad?`<div class="cbad">${st.bad}</div>`:'')+`</div>`;
  } else {
    const cr=st.crumb.map((c,i,a)=>i===a.length-1?`<span>${c}</span>`:`<span class="dim">${c}</span><span class="sep">›</span>`).join('');
    h+=`<div class="card"><div class="crumb">${cr}</div>`+
       st.rows.map(r=>`<div class="mrow ${r.hot?'hot':''} ${r.ok?'ok':''}"><span class="mn">${r.n}</span><span class="mv">${r.v}</span></div>`).join('')+
       `</div>`;
    if(st.hint) h+=`<div class="hint">${st.hint}</div>`;
  }
  if(st.note) h+=`<div class="note">${st.note}</div>`;
  document.getElementById('body').innerHTML=h;
  const bot=document.getElementById('bot'); bot.style.display='flex';
  bot.innerHTML=`<button class="btn btn-sec" onclick="navBack()">${t().back}</button>
    <button class="btn ${stepIdx===steps.length-1?'btn-ok':'btn-pri'}" onclick="goNext()">
      ${stepIdx===steps.length-1?t().finish:t().nextStep}</button>`;
}

function renderDone(){
  const L=L_(),S=S_();
  document.getElementById('hdrStep').textContent=t().finHdr;
  document.getElementById('hdrTitle').textContent=t().finSub;
  document.getElementById('prev').style.display='none';
  document.getElementById('chips').style.display='none';
  const rows=Object.entries(computeParams()).filter(([,v])=>v)
    .map(([k,v])=>`<div class="sum-r"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
  document.getElementById('body').innerHTML=`<div class="fin"><div class="fin-i">✓</div>
    <div class="fin-t">${t().finTitle}</div><div class="fin-s">${txt(L,0)}<br>${txt(S,0)}</div>
    <div class="sum"><div class="sum-h">${t().sumTitle}</div>${rows}</div></div>`;
  const bot=document.getElementById('bot'); bot.style.display='flex';
  bot.innerHTML=`<button class="btn btn-sec" onclick="navBack()">${t().backSteps}</button>
    <button class="btn btn-ok" onclick="askReset()">${t().newScen}</button>`;
}

/* ═════ PERSISTENCE ═════ */
const LSKEY='a6700-setup-v1';
function saveState(){
  try{ localStorage.setItem(LSKEY, JSON.stringify({
    appLang, camLang, sel, manualLens, vndCustom, ledCustom, page, stepIdx, showManualForm
  })); }catch(e){}
}
function loadState(){
  try{ const raw=localStorage.getItem(LSKEY); if(!raw) return null; return JSON.parse(raw); }catch(e){ return null; }
}
function applyState(d, withProgress){
  if(!d) return;
  if(d.appLang) appLang=d.appLang;
  if(d.camLang) camLang=d.camLang;
  if(!withProgress) return;
  if(d.sel) sel=Object.assign({lighting:null,subject:null,lens:null,gear:[],profile:null,ndVario:[],ndFixed:[],fps:25,angle:2,ledKind:'var',ledFix:'k5600',ledVar:'v3256',flMode:'ttl',flRole:'fill',flCurt:'first'}, d.sel);
  if(d.manualLens) manualLens=d.manualLens;
  if(d.vndCustom) vndCustom=d.vndCustom;
  if(d.ledCustom) ledCustom=d.ledCustom;
  showManualForm=!!d.showManualForm;
  page=typeof d.page==='number'?d.page:0; stepIdx=d.stepIdx||0;
  if(page===99) page=0;
  if(page>=NSCR) steps=buildSteps();
  if(page===NSCR && stepIdx>steps.length-1) stepIdx=Math.max(0,steps.length-1);
}

/* wrap render so every state change is persisted */
const _render = render;
render = function(){
  try { _render(); }
  catch(e){
    /* аварийный откат: возвращаем рабочий экран вместо пустого */
    try{
      page = Math.min(page, NSCR-1); stepIdx = 0; steps = [];
      _render();
    }catch(e2){}
  }
  saveState();
};

/* ═════ ANDROID BACK BUTTON ═════ */
/* на каждый шаг вперёд кладём метку в историю; кнопка «Назад» — и системная,
   и экранная — снимает её через history.back(), поэтому глубины всегда совпадают */
let guards = 0;
function pushGuard(){ try{ history.pushState({app:1},''); guards++; }catch(e){} }
function syncHistory(){}          // больше не нужна, оставлена чтобы не ломать вызовы

let backPending = false;
function navBack(){
  if(backPending) return;           // защита от частых тапов: history.back() срабатывает не мгновенно
  cancelAdvance();
  if(guards>0){ backPending = true; history.back(); }
  else { goBack(); }
}
try{
  window.addEventListener('popstate', function(){
    backPending = false;
    if(guards>0) guards--;
    cancelAdvance();
    const m=document.getElementById('modal');
    if(m && m.innerHTML){ closeModal(false); return; }
    goBack();
  });
}catch(e){}

/* ═════ BOOT ═════ */
(function boot(){
  const d=loadState();
  applyState(d,false);
  const hasProgress = d && d.sel && (d.sel.lighting||d.sel.subject||d.sel.lens||d.sel.profile||(d.sel.gear&&d.sel.gear.length));
  if(hasProgress){
    render();
    showModal(t().resumeT, t().resumeS, t().resumeYes, t().resumeNo,
      ()=>{ applyState(d,true); render(); },
      ()=>{ reset(); });
  } else {
    render();
  }
})();
</script>
