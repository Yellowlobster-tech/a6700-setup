  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    font-family:'AppCond','Arial Narrow','Liberation Sans Narrow',system-ui,sans-serif;
    font-stretch:condensed; background:#0a0a0a; color:#fff;
    -webkit-font-smoothing:antialiased; overscroll-behavior:none;
    height:100%; overflow:hidden;
      touch-action:manipulation;
  }
  .app {
    max-width:440px; width:100%; margin:0 auto; display:flex; flex-direction:column;
    height:100vh; height:100dvh; background:#141414;
    padding-top:env(safe-area-inset-top); overflow:hidden;
  }
  #body { flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  .hdr,.prev,.chips,.bot { flex:0 0 auto; }
  @media (min-width:700px) and (pointer:fine) {
    body { background:#050505; display:flex; justify-content:center; align-items:center; }
    .app { height:min(900px, calc(100vh - 40px)); border-radius:20px; border:1px solid #2a2a2a; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  }
  .rotate { display:none; position:fixed; inset:0; z-index:999; background:#0a0a0a;
    flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; }
  .rotate .ico { font-size:60px; margin-bottom:20px; }
  .rotate .msg { font-size:19px; font-weight:700; line-height:1.4; color:#ff9500; }
  /* «Поверните телефон» показываем только при НАСТОЯЩЕМ альбомном экране.
     Раньше сюда попадал и обычный портрет с открытой клавиатурой: окно 360×514
     превращается в 360×250, ширина становится больше высоты — браузер считает это
     альбомной ориентацией, приложение получало display:none прямо в момент касания
     поля ввода, фокус терялся и клавиатура закрывалась. Отсюда два предохранителя:
     настоящий альбом вытянут не меньше 1.6:1, и пока в приложении есть фокус,
     прятать его нельзя ни при каких условиях. */
  @media (orientation:landscape) and (max-height:520px) and (pointer:coarse) and (min-aspect-ratio:16/10) {
    .rotate { display:flex; } .app { display:none; }
  }
  body:has(.app :focus) .rotate,
  body:has(.app:focus-within) .rotate { display:none !important; }
  body:has(.app :focus) .app,
  body:has(.app:focus-within) .app { display:flex !important; }

  .hdr { background:#1c1c1c; padding:14px 14px; border-bottom:1px solid #2e2e2e; display:flex; align-items:center; gap:6px; }
  .hdr-btn { font-size:26px; color:#ff9500; cursor:pointer; line-height:1; padding:2px 5px; flex:0 0 auto; }
  .hdr-btn.home svg { display:block; }
  .hdr-btn.hidden { visibility:hidden; }
  .hdr-btn.gear { font-size:20px; }
  .hdr-txt { flex:1; min-width:0; }
  .hdr-step { font-size:11px; color:#ff9500; letter-spacing:1.4px; text-transform:uppercase; font-weight:700; }
  .hdr-title { font-size:20px; font-weight:700; margin-top:1px; line-height:1.15; }

  .prev { background:#131313; border-bottom:1px solid #262626; }
  .prev-bar { padding:11px 16px; display:flex; align-items:center; gap:8px; cursor:pointer;
    font-size:12.5px; font-weight:700; color:#ff9500; text-transform:uppercase; letter-spacing:1px; }
  .prev-bar .caret { margin-left:auto; font-size:14px; transition:transform .2s; color:#888; }
  .prev-bar.open .caret { transform:rotate(180deg); }
  .prev-body { display:none; padding:0 16px 12px; max-height:46vh; overflow-y:auto; }
  .prev-body.open { display:block; }
  .prev-row { display:flex; justify-content:space-between; gap:10px; padding:6.5px 0; border-bottom:1px solid #232323; font-size:13.5px; }
  .prev-row:last-child { border-bottom:none; }
  .prev-row .pk { color:#8a8a8a; font-weight:500; }
  .prev-row .pv { color:#fff; font-weight:700; text-align:right; }
  .prev-row .pv.empty { color:#4a4a4a; font-weight:400; font-style:italic; }
  .prev-row .pv.calc { color:#6cbf6c; }
  .prev-row .pv.warn { color:#ffb340; }
  .prev-row .pv.bad  { color:#ff6b5e; }
  .ndlist { background:#181818; border-bottom:1px solid #262626; padding:4px 0 8px; }
  .ndlist .ndh { padding:11px 16px 6px; font-size:12px; color:#ff9500; text-transform:uppercase;
    letter-spacing:1.1px; font-weight:700; }
  .ndopt { display:flex; align-items:center; gap:12px; padding:12px 16px 12px 30px;
    border-bottom:1px solid #212121; cursor:pointer; min-height:52px; }
  .ndopt:last-child { border-bottom:none; }
  .ndopt:active { background:#232323; }
  .ndopt .radio { width:20px; height:20px; border:2px solid #555; border-radius:50%;
    flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .ndopt.sel .radio { border-color:#ff9500; background:#ff9500; }
  .ndopt.sel .radio::after { content:''; width:8px; height:8px; border-radius:50%; background:#000; }
  .ndopt .nn { font-size:15.5px; font-weight:600; color:#ddd; }
  .ndopt.sel .nn { color:#fff; font-weight:700; }
  .ndopt .nd2 { font-size:12px; color:#7d7d7d; margin-top:2px; }
  .ndcustom { padding:10px 16px 12px 30px; display:flex; align-items:center; gap:10px; }
  .ndcustom input { width:74px; padding:9px 8px; font-family:inherit; font-size:16px; font-weight:700;
    text-align:center; background:#0f0f0f; color:#fff; border:1px solid #3a3a3a; border-radius:8px; }
  .ndcustom input:focus { outline:none; border-color:#ff9500; }
  .ndcustom label { font-size:14px; color:#bbb; flex:1; }
  .ndsec { display:flex; align-items:center; gap:9px; padding:13px 16px; cursor:pointer;
    border-bottom:1px solid #212121; background:#1d1d1d; }
  .ndsec:active { background:#262626; }

  /* ── заставка ── */
  #splash {
    position:fixed; inset:0; z-index:900; cursor:pointer;
    background:linear-gradient(180deg,#101f38 0%,#0a1526 42%,#050a12 74%,#000 100%);
    display:flex; align-items:stretch; justify-content:center;
    transition:opacity .45s ease; opacity:1;
  }
  #splash.gone { opacity:0; pointer-events:none; }
  /* приблизительная рамка по краю экрана — точную границу физического экрана
     из CSS не узнать (разрешения разные), поэтому просто небольшой отступ
     от края вьюпорта + запас под «чёлку»/скруглённые углы там, где есть */
  .phone-frame {
    position:fixed;
    top:max(10px, env(safe-area-inset-top));
    bottom:max(10px, env(safe-area-inset-bottom));
    left:50%;
    transform:translateX(-50%);
    /* на телефоне viewport и есть экран телефона — рамка просто держит отступ
       от его края; на мониторе привязываемся к той же ширине, что и у
       самого приложения (карточка 440px), а не ко всему окну браузера */
    width:min(calc(100% - 20px), 420px);
    border:3px solid #ffc72c;
    border-radius:26px;
    opacity:.9;
    pointer-events:none;
    box-shadow:0 0 14px rgba(255,199,44,.35);
  }
  @media (min-width:700px) and (pointer:fine) {
    /* тот же брейкпоинт, что превращает .app в «карточку телефона» —
       рамка теперь тоже по высоте держится этой карточки, а не всего окна */
    .phone-frame {
      top:50%; bottom:auto;
      transform:translate(-50%,-50%);
      height:min(880px, calc(100vh - 60px));
    }
  }
  /* колонка заставки: пилюли сверху, содержимое по центру,
     лого — по центру полосы между последней строкой текста и рамкой */
  .sp-col {
    width:min(calc(100% - 20px), 420px);
    overflow-y:auto; overscroll-behavior:contain;
    padding-top:calc(max(10px, env(safe-area-inset-top)) + 20px);
    padding-bottom:calc(max(10px, env(safe-area-inset-bottom)) + 3px);
    display:flex; flex-direction:column; align-items:center;
  }
  @media (min-width:700px) and (pointer:fine) {
    .sp-col { height:min(880px, calc(100vh - 60px)); align-self:center;
              padding-top:26px; padding-bottom:3px; }
  }

/* ═════ ИНТЕРФЕЙС: французский и немецкий ═════
   Строятся на базе английского: любой не переведённый ключ остаётся
   английским, а не пропадает. Так добавляется и любой следующий язык. */
function _tmerge(base, over){
  const out = Object.assign({}, base);
  for(const k in over){
    const v = over[k], b = base[k];
    out[k] = (v && typeof v === 'object' && !Array.isArray(v) && typeof v !== 'function'
              && b && typeof b === 'object' && !Array.isArray(b) && typeof b !== 'function')
             ? _tmerge(b, v) : v;
  }
  return out;
}

/* ═════ студийный свет: Key + до 3 источников, чисто ручной расчёт, отдельно от computeExposure() ═════ */
function studioRoles(){
  const n = sel.stN;
  if(n<=1) return ['key'];
  if(n===2) return ['key', sel.stSecond==='rim'?'rim':'fill'];
  if(n===3) return ['key','fill','rim'];
  return ['key','fill','rim','bg'];
}
function studioEv(role){
  if(role==='fill') return sel.stEvFill;
  if(role==='rim')  return sel.stEvRim;
  if(role==='bg')   return sel.stEvBg;
  return 0;
}
function studioEvSet(role,v){
  const n = isNaN(parseFloat(v)) ? 0 : Math.max(-3,Math.min(3,parseFloat(v)));
  if(role==='fill') sel.stEvFill=n; else if(role==='rim') sel.stEvRim=n; else if(role==='bg') sel.stEvBg=n;
}
function computeStudio(){
  if(sel.mode!=='photo' || !sel.gear.includes('studioLight')) return null;
  const N = parseFloat(sel.stAp)||8, iso = parseInt(sel.stIso,10)||100;
  const groups = studioRoles().map(role=>({role, ev: role==='key'?0:studioEv(role)}));
  return { t:SYNC_SPEED, N, iso, groups, curt:sel.stCurt };
}

  const bright = ['sun-hard','sun-soft','partly','bright-cloud'].includes(L);

  switch(id){
    case 'nd':      return bright || L==='overcast';
    case 'tripod':  return dark || L==='studio' || ['landscape','architecture','detail','macro','night-sky','talking'].includes(S);
    case 'gimbal':  return vid;
    case 'mic':     return vid;
    case 'light':   return dark || L==='studio' || L==='indoor-window';

    case 'studioLight': return L==='studio';
    case 'monitor': return true;   /* монитор нужен и для фото, и для видео */
    default:        return true;
  }
}

function stops(n){

  if(appLang==='de'){ const r=Math.round(n*10)/10; return r+(Math.abs(r)===1?' Blendenstufe':' Blendenstufen'); }

const nearest = (arr,v) => arr.reduce((p,c)=>Math.abs(c-v)<Math.abs(p-v)?c:p);
const ceilIn   = (arr,v) => arr.find(x=>x>=v) ?? arr[arr.length-1];
const evScene  = (ev100,iso) => ev100 + Math.log2(iso/100);
const reqAp    = (ev100,iso,t) => Math.sqrt(t * Math.pow(2, evScene(ev100,iso)));
const calcShut = (ev100,iso,N) => (N*N) / Math.pow(2, evScene(ev100,iso));

function ledSpec(){

function gelFor(fromK,toK){
  const ru=appLang==='ru';
  const d=toK-fromK;
  if(Math.abs(d)<350) return null;
  const warm=[[-2400,'CTO',ru?'полный CTO':'full CTO'],[-1700,'1/2 CTO',ru?'половинный CTO':'half CTO'],[-1000,'1/4 CTO',ru?'четвертной CTO':'quarter CTO']];
  const cool=[[2400,'CTB',ru?'полный CTB':'full CTB'],[1100,'1/2 CTB',ru?'половинный CTB':'half CTB'],[500,'1/4 CTB',ru?'четвертной CTB':'quarter CTB']];
  const set = d<0?warm:cool;
  let best=set[0];
  for(const c of set) if(Math.abs(Math.abs(c[0])-Math.abs(d))<Math.abs(Math.abs(best[0])-Math.abs(d))) best=c;
  return best[1];
}
function fpsObj(){ return FPS_OPTS.find(f=>f.fps===sel.fps) || FPS_OPTS[0]; }
function angleObj(){ return ANGLE_OPTS.find(a=>a.mul===sel.angle) || ANGLE_OPTS[0]; }
function vidShutter(){ return nearest(SH_SERIES, 1/(sel.fps*sel.angle)); }

/* aperture the lens can actually give — widest end used as the limit */
function lensWidest(L){ return L ? Math.min(L.a[0],L.a[1]) : 1.0; }
function lensFocalForCalc(L){ return L ? L.f[1] : 50; }   // tele end = worst case for handheld

function computeExposure(){
  const L=L_(), S=S_(), P=P_(), LN=lensObj();
  if(!L||!S||!P) return null;
  const v=isVideo();
  const widest = LN ? lensWidest(LN) : null;

  let N = S.apT, apLimited=false;
  if (widest && N < widest){ N = widest; apLimited = true; }
  N = nearest(AP_SERIES, N);
  const Ntarget = N;

  const r = { N, Ntarget, apLimited, widest, video:v, nd:null, combo:null,
              apForced:false, apImpossible:false, isoHigh:false, isoOver:false, shutOver:false };

  if (v) {
    const tBase = vidShutter();
    let iso = P.baseIso;
    const need = 2*Math.log2(reqAp(L.ev, iso, tBase) / N);   // stops of light to kill at target aperture
    r.needStops = need;

    const combo = bestCombo(need);
    r.combo = combo;
    r.nd = combo ? {min:combo.min, max:combo.max} : null;

    if (!combo) {
      r.ndApplied = 0;
      if (need > 0.4) {
        r.shortfall = need;
        const Nn = ceilIn(AP_SERIES, N * Math.pow(2, need/2));
        if (Nn > 16) { r.apImpossible = true; r.N = 16; } else { r.N = Nn; }
        r.apForced = true;
      } else if (need < -0.4) {
        r.isoUp = ceilIn(ISO_SERIES, Math.min(iso*Math.pow(2,-need), 25600));
        if (r.isoUp >= 12800) r.isoOver = true;
      }
    } else {
      const applied = Math.min(Math.max(need, combo.min), combo.max);
      r.ndApplied = applied;
      if (combo.variable) r.vndDial = Math.max(0, Math.round((applied - combo.fixAdd)*10)/10);
      const residual = need - applied;
      r.residual = residual;
      if (residual > 0.4) {
        r.shortfall = residual;
        const Nn = ceilIn(AP_SERIES, N * Math.pow(2, residual/2));
        if (Nn > 16) { r.apImpossible = true; r.N = 16; } else { r.N = Nn; }
        r.apForced = true;
      } else if (residual < -0.4) {
        let Nn = N * Math.pow(2, residual/2);
        if (widest && Nn < widest) {
          const stillDark = 2*Math.log2(widest/Nn);
          Nn = widest;
          r.isoUp = ceilIn(ISO_SERIES, Math.min(iso*Math.pow(2,stillDark), 25600));
          if (r.isoUp >= 12800) r.isoOver = true;
        }
        r.N = nearest(AP_SERIES, Nn);
        r.apForced = true;
      }
    }
    r.t = tBase; r.iso = iso;

  } else if (S.id === 'night-sky') {
    /* звёзды: выдержку задаёт правило 500, диафрагму открываем, ISO добирает экспозицию */
    const focal = LN ? LN.f[0] : 20;
    const tStar = Math.min(30, 500/(focal*CROP));
    const below = SH_SERIES.filter(x=>x<=tStar);
    r.t = below.length ? below[below.length-1] : SH_SERIES[SH_SERIES.length-1];
    r.N = widest ? nearest(AP_SERIES, widest) : N;
    r.starRule = tStar;
    r.astro = true;
    r.ndApplied = 0;
    const need = 2*Math.log2(reqAp(L.ev, 100, r.t) / r.N);
    r.iso = ceilIn(ISO_SERIES, Math.min(100*Math.pow(2,-need), 25600));
    r.isoHigh = r.iso >= 3200;
    r.isoOver = r.iso >= 12800;
    r.tooSlow = true;                      // с рук невозможно в принципе
    r.handRule = 1/(focal*CROP);
  } else {
    let iso = Math.max(P.baseIso, L.isoMin);
    const focal = lensFocalForCalc(LN);
    const handRule = 1/(focal*CROP);
    r.handRule = handRule;

    r.ndApplied = 0;
    let t = (N*N) / Math.pow(2, L.ev + Math.log2(iso/100));

    // too bright for the shutter ceiling? fit a filter, or stop down
    if (t < 1/8000) {
      const over = Math.log2((1/8000)/t);           // stops beyond the ceiling
      const combo = bestCombo(over);
      r.combo = combo;
      if (combo) {
        const applied = Math.min(Math.max(over, combo.min), combo.max);
        r.ndApplied = applied;
        if (combo.variable) r.vndDial = Math.max(0, Math.round((applied - combo.fixAdd)*10)/10);
        t = t * Math.pow(2, applied);
      }
      if (t < 1/8000) {
        const still = Math.log2((1/8000)/t);
        const Nn = ceilIn(AP_SERIES, N * Math.pow(2, still/2));
        if (Nn > 16) { r.apImpossible = true; r.N = 16; t = 1/8000; }
        else { r.N = Nn; t = t * Math.pow(2, still); }
        r.apForced = true;
        r.shutOver = true;
      }
    }

    // too slow to hand-hold? lift ISO in steps
    let guard=0;
    while (t > handRule && iso < 12800 && guard++ < 40) {
      iso = ISO_SERIES[Math.min(ISO_SERIES.indexOf(nearest(ISO_SERIES,iso))+1, ISO_SERIES.length-1)];
      t = (r.N*r.N) / Math.pow(2, (L.ev - r.ndApplied) + Math.log2(iso/100));
    }
    if (r.ndApplied > 0.4) t = (r.N*r.N) / Math.pow(2, (L.ev - r.ndApplied) + Math.log2(iso/100));
    r.iso = nearest(ISO_SERIES, iso);
    r.t   = nearest(SH_SERIES, t);
    r.tooSlow  = r.t > handRule*1.3;
    r.isoHigh  = r.iso >= 3200;
    r.isoOver  = r.iso >= 12800;
  }
  return r;
}

function zebraLvl(){
  const L = L_(); if(!L) return null;
  if(sel.profile==='slog3') return '95';

function focusModeName(){
  const S=S_(), v=isVideo(), ru=appLang==='ru';

  if(v) return manual ? (ru?'Ручной фокус':'Manual Focus') : (ru?'Непрерывн. AF':'Continuous AF');

  if(/АФ-C|AF-C/.test(val(S.focus))) return ru?'Непрерывн. AF':'Continuous AF';
  return ru?'Покадровая AF':'Single-shot AF';
}
function isVideo(){
  if(sel.mode==='video'||sel.mode==='sq') return true;

  return ['slog3','scinetone','pp-custom'].includes(sel.profile) || ['talking','walk'].includes(sel.subject);
}
function isSQ(){ return sel.mode==='sq'; }
function modeOk(o){
  if(!o.m || o.m==='b') return true;

  return sel.mode!=='photo';   // 'v' = видео + S&Q
}
function areaFor(S){ return val(isVideo() ? S.areaV : S.areaS); }

function computeParams(){
  const L=L_(),S=S_(),P=P_(),LN=lensObj(),v=isVideo(),p={},E=computeExposure();
  p[t().p.profile]= P?txt(P,0):null;
  p[t().p.lens]   = lensName();
  p[t().p.eqf]    = LN ? (LN.f[0]===LN.f[1] ? Math.round(LN.f[0]*CROP)+' мм' : Math.round(LN.f[0]*CROP)+'–'+Math.round(LN.f[1]*CROP)+' мм') : null;
  p[t().p.format] = (v&&sel.profile!=='raw-photo')
      ? 'XAVC S 4K '+sel.fps+'p '+fpsObj().mbps+'M'
      : (sel.profile==='raw-photo'?'RAW + JPEG':null);
  p[t().p.shutter]= E?fmtShut(E.t):null;
  p[t().p.ap]     = E?('f/'+E.N):(S?S.apR:null);
  p[t().p.iso]    = E?(E.isoUp?E.isoUp:E.iso):null;
  p[t().p.wb]     = L?val(L.wb):null;
  p[t().p.zebra]  = zebraLvl();
  p[t().p.nd]     = E ? (E.ndApplied>0.4
      ? stops(E.ndApplied) + (E.combo? ' · '+comboLabel(E.combo) : '')
      : (hasFilters()? (appLang==='ru'?'есть, не нужен':'fitted, not needed') : t().noNd)) : null;
  p[t().p.hand]   = (E&&!E.video&&E.handRule) ? fmtShut(nearest(SH_SERIES,E.handRule)) : null;
  p[t().p.focus]  = S?val(S.focus):null;
  p[t().p.area]   = S?areaFor(S):null;
  p[t().p.stab]   = S?(sel.gear.includes('tripod')?t().off:(sel.gear.includes('gimbal')?t().stdStab:val(S.stab))):null;
  if(!v && p[t().p.stab] && p[t().p.stab]!==t().off) p[t().p.stab] = t().on;   /* в фото SteadyShot только Вкл/Откл */
  const g=sel.gear.filter(x=>x!=='none').map(id=>txt(GEAR.find(x=>x.id===id),0));
  p[t().p.gear]   = sel.gear.length?(sel.gear.includes('none')?t().noGear:g.join(', ')):null;
  return p;
}

    if(v && E && (k===t().p.shutter||k===t().p.ap||k===t().p.iso||k===t().p.nd||k===t().p.hand)) cls='calc';
    if(v && E && k===t().p.ap)      cls = E.apImpossible?'bad' : (E.apForced||E.apLimited)?'warn' : cls;

      if(S.type==='check' && o.id==='studioLight' && isS){

            + rad(sel.stSecond==='rim',  appLang==='ru'?'Контровой (Rim/Hair)':'Rim/Hair', appLang==='ru'?'−0.5…+1 EV от Key':'−0.5…+1 EV from Key', `setLed(event,'stSecond','rim')`);

          + `<div class="ndh" style="padding-top:14px">${appLang==='ru'?'Синхронизация затвора':'Shutter sync'}</div>`
          + FL_CURT.map(k=>rad(sel.stCurt===k.id,txt(k,0),txt(k,1),`setLed(event,'stCurt','${k.id}')`)).join('')
          + `<div class="ndmore" style="color:#8a8a8a;cursor:default">${appLang==='ru'
               ? 'Затвор зафиксирован на пределе синхронизации: '+fmtShut(SYNC_SPEED)
               : 'Shutter fixed at the sync limit: '+fmtShut(SYNC_SPEED)}</div>`
          + `</div>`;
      }
      if(S.type==='check' && o.id==='nd' && isS){
        const nV=sel.ndVario.length, nF=sel.ndFixed.length;
        const cnt=n=> n? `<span class="ndcount">${n}</span>` : '';
        block += `<div class="ndlist">
          <div class="ndh">${appLang==='ru'?'Какие фильтры с собой':'Which filters do you carry'}</div>
          <div class="ndsec ${ndSection==='vario'?'open':''}" onclick="ndSec(event,'vario')">
            <span class="arw">▸</span><span class="sn">${appLang==='ru'?'Переменные (варио)':'Variable (VND)'}</span>${cnt(nV)}

        if(ndSection==='vario'){
          block += VND_OPTS.map(v=>{
            const on=sel.ndVario.includes(v.id);
            return `<div class="ndopt ${on?'sel':''}" onclick="ndTog(event,'ndVario','${v.id}')">

          if(sel.ndVario.includes('v-cust')){

        block += `<div class="ndsec ${ndSection==='fixed'?'open':''}" onclick="ndSec(event,'fixed')">
            <span class="arw">▸</span><span class="sn">${appLang==='ru'?'Фиксированные':'Fixed'}</span>${cnt(nF)}
          </div>`;
        if(ndSection==='fixed'){
          block += FIX_OPTS.filter(f=>!f.dense||showDense).map(f=>{
            const on=sel.ndFixed.includes(f.id);
            return `<div class="ndopt ${on?'sel':''}" onclick="ndTog(event,'ndFixed','${f.id}')">
              <div class="check"></div><div><div class="nn">${f.nm}</div><div class="nd2">${stops(f.st)}</div></div></div>`;
          }).join('');
          if(!showDense) block += `<div class="ndmore" onclick="ndDense(event)">${appLang==='ru'?'Плотнее — ND128 и выше ▾':'Denser — ND128 and up ▾'}</div>`;
        }
        block += `</div>`;
      }
      return block;
    };
    html += '<div class="opts">' + primary.map(draw).join('');
    if(secondary.length){
      if(showAll){
        html += `<div class="divider">${appLang==='ru'?'Менее подходящие для этой сцены':'Less suited to this scene'}</div>`
              + secondary.map(draw).join('');
      } else {
        html += `<div class="showall" onclick="revealAll(event)">${appLang==='ru'
                 ? 'Показать остальные ('+secondary.length+') ▾'
                 : 'Show the rest ('+secondary.length+') ▾'}</div>`;
      }
    }
    html += '</div>';
  }
  document.getElementById('body').innerHTML=html;

  const bot=document.getElementById('bot');
  const back = `<button class="btn btn-sec" onclick="navBack()">${t().back}</button>`;
  let fwd = '';
  if(S.type==='check')
    fwd = `<button class="btn btn-pri" onclick="goNext()" ${sel[S.key].length?'':'disabled'}>${t().next}</button>`;
  else if(S.key==='profile' && sel.profile && isVideo())
    fwd = `<button class="btn btn-pri" onclick="goNext()">${t().apply}</button>`;
  else if(S.type==='lens' && showManualForm)
    fwd = `<button class="btn btn-pri" onclick="goNext()" ${lensObj()?'':'disabled'}>${t().apply}</button>`;
  bot.style.display='flex';
  bot.innerHTML = back + fwd;
}

let advTimer = null;
function cancelAdvance(){ if(advTimer){ clearTimeout(advTimer); advTimer=null; } }
function scheduleAdvance(){ cancelAdvance(); advTimer = setTimeout(()=>{ advTimer=null; goNext(); }, 180); }

function pick(key,id,type){
  if(type==='radio'){
    sel[key]=id;
    if(key==='profile' && isVideo()){ renderPicker(); return; }
    renderPicker();           // перерисовать целиком: при фильтрации порядок в DOM не совпадает со списком
    scheduleAdvance();
  } else {
    const o=GEAR.find(g=>g.id===id);
    if(o&&o.exclusive) sel[key]=sel[key].includes(id)?[]:[id];
    else{ let a=sel[key].filter(x=>x!=='none'); sel[key]=a.includes(id)?a.filter(x=>x!==id):[...a,id]; }
    renderPicker();
  }
}
function pickLens(id){
  sel.lens=id;
  if(id==='manual'){ showManualForm=true; renderPicker(); }
  else { showManualForm=false; renderPicker(); scheduleAdvance(); }
}

/* порядок в списках: English первым, дальше es / fr / de, затем ru и остальные */
const SP_LANG_APP = [['en','English'],['es','Español'],['fr','Français'],['de','Deutsch'],['ru','Русский'],['pt','Português'],['it','Italiano'],['tr','Türkçe']];
const SP_LANG_CAM = SP_LANG_APP;
/* подпись в пилюле: к чему относится язык — к камере или к приложению */
function spKind(kind){
  const i = ['ru','en','es','fr','de','pt','it','tr'].indexOf(appLang), k = i<0?1:i;
  return SP_USP[kind==='cam'?'kCam':'kApp'][k];
}
function splashLangsHtml(){
  const pill = (kind, cur, opts, ic, title) => {
    const found = opts.find(o=>o[0]===cur);
    const name  = found ? found[1] : (opts[0][1]);
    return `<div class="sp-pill" data-k="${kind}">
      <button class="pl-head" title="${title}" onclick="splashPillToggle(event,'${kind}')">
        <span class="pl-ic">${ic}</span><span class="pl-val">${esc(name)}</span><span class="pl-sub">· ${esc(spKind(kind))}</span><span class="pl-arw">▾</span>
      </button>
      <div class="pl-menu">${opts.map(o=>
        `<button class="pl-opt ${o[0]===cur?'sel':''}" onclick="splashPickLang(event,'${kind}','${o[0]}')">${esc(o[1])}</button>`
      ).join('')}</div></div>`;
  };
  const ru = appLang==='ru';
  return pill('cam', camLang, SP_LANG_CAM, '▣', ru?'Язык меню камеры':'Camera menu language')
       + pill('app', appLang, SP_LANG_APP, '⌾', ru?'Язык приложения':'App language');
}
function renderSplashLangs(){
  const host=document.getElementById('spLangs');
  if(host) host.innerHTML = splashLangsHtml();
  const lg=document.getElementById('spLogo');

function splashPillToggle(e, kind){
  e.stopPropagation(); e.preventDefault();
  const host=document.getElementById('spLangs'); if(!host) return;
  const el=host.querySelector('.sp-pill[data-k="'+kind+'"]'); if(!el) return;
  const was=el.classList.contains('open');
  host.querySelectorAll('.sp-pill').forEach(p=>{ p.classList.remove('open');
    const m=p.querySelector('.pl-menu'); if(m){ m.style.maxHeight=''; m.scrollTop=0; } });
  if(was) return;
  el.classList.add('open');
  /* постоянная высота: ровно три строки, четвёртая обрезана — видно, что список
     прокручивается. Сколько бы языков ни добавили, список не растёт. */
  const menu=el.querySelector('.pl-menu'), title=document.querySelector('.sp-title');
  if(menu){
    const opt=menu.querySelector('.pl-opt');
    const ih = opt ? opt.getBoundingClientRect().height : 34;
    let cap = Math.round(ih*3 + 10);
    if(title){
      const room = Math.round(title.getBoundingClientRect().top - menu.getBoundingClientRect().top - 14);
      if(room > 0) cap = Math.min(cap, Math.max(40, room));
    }
    menu.style.maxHeight = cap+'px';
    const cur = menu.querySelector('.pl-opt.sel');       /* выбранный язык — сразу видно */
    if(cur) menu.scrollTop = Math.max(0, cur.offsetTop - 4);
  }
}

  if(typeof window.splashBuild==='function') window.splashBuild();
  render();
}

/* ═════ ДИАГНОСТИКА ВВОДА ═════
   Страница ничего не перерисовывает во время событий: строки лога дописываются
   в textContent. Нужна, чтобы увидеть, что именно снимает фокус с поля на телефоне. */
let diagOn = false;
function openDiag(){ pushGuard(); page=95; render(); }
function diagLog(msg){
  const el=document.getElementById('dgLog'); if(!el) return;
  const t=(performance.now()/1000).toFixed(2);
  el.textContent = t+'  '+msg+'\n' + el.textContent;
  if(el.textContent.length>6000) el.textContent = el.textContent.slice(0,6000);
}
let dgOutCount=0, dgLastOut='—';
function dgSum(){
  const el=document.getElementById('dgSum'); if(!el) return;
  const vv=window.visualViewport, a=document.activeElement;
  el.textContent =
    'потерь фокуса: '+dgOutCount+'   куда уходил: '+dgLastOut+'\n'+
    'сейчас в фокусе: '+(a?(a.id||a.tagName):'—')+'\n'+
    'окно '+window.innerWidth+'×'+window.innerHeight+
    (vv?('   видимая часть '+Math.round(vv.width)+'×'+Math.round(vv.height)+'   масштаб '+vv.scale.toFixed(2)):'   visualViewport нет')+'\n'+
    'во встроенном окне: '+(window.top!==window.self?'да':'нет')+
    '   viewport: '+((document.querySelector('meta[name=viewport]')||{}).content||'нет');
}
function renderDiag(){
  document.getElementById('hdrStep').textContent='DIAG';
  document.getElementById('hdrTitle').textContent=R('Диагностика ввода','Input diagnostics');
  document.getElementById('prev').style.display='none';
  document.getElementById('chips').style.display='none';
  const mono='font:11.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;background:#111;border:1px solid #2a2a2a;border-radius:10px;padding:10px;margin:0';
  document.getElementById('body').innerHTML = `
    <div class="sect-note">${R('Нажмите поле, наберите три буквы. Потом сфотографируйте экран — этого достаточно, копировать ничего не нужно.','Tap the field, type three letters, then screenshot this screen.')}</div>
    <div class="fbox"><input id="dgIn" type="text" autocomplete="off" placeholder="${R('наберите здесь','type here')}"></div>
    <div class="sect-h">${R('Итог','Summary')}</div>
    <pre id="dgSum" style="${mono};color:#ffd66b"></pre>
    <div class="sect-h">${R('Что происходило','Event log')}</div>
    <pre id="dgLog" style="${mono};color:#9ad;max-height:38vh;overflow:auto"></pre>
    <div class="bkp" style="padding:10px 0">
      <button class="btn btn-sec" onclick="dgSelect()">${R('Выделить лог','Select log')}</button>
      <button class="btn btn-sec" onclick="document.getElementById('dgLog').textContent='';dgOutCount=0;dgLastOut='—';dgSum()">${R('Очистить','Clear')}</button></div>
    <pre id="dgUA" style="${mono};color:#777;font-size:10.5px"></pre>`;
  const bot=document.getElementById('bot'); bot.style.display='flex';
  bot.innerHTML=`<button class="btn btn-sec" style="flex:1" onclick="navBack()">${t().back}</button>`;
  document.getElementById('dgUA').textContent = 'экран '+screen.width+'×'+screen.height+
    '   dpr '+(window.devicePixelRatio||1)+'\n'+navigator.userAgent;
  dgSum();
  const inp=document.getElementById('dgIn');
  if(!diagOn){
    diagOn=true;
    const vv=window.visualViewport;
    if(vv){
      vv.addEventListener('resize', ()=>{ diagLog('видимая часть изменилась: h='+Math.round(vv.height)+' масштаб='+vv.scale.toFixed(2)); dgSum(); });
      vv.addEventListener('scroll', ()=>diagLog('видимая часть сдвинулась: top='+Math.round(vv.offsetTop)));
    }
    window.addEventListener('resize', ()=>{ diagLog('окно '+window.innerWidth+'×'+window.innerHeight); dgSum(); });
    document.addEventListener('visibilitychange', ()=>diagLog('видимость страницы: '+document.visibilityState));
    document.addEventListener('focusin',  e=>{ diagLog('ФОКУС ПРИШЁЛ  '+(e.target.id||e.target.tagName)); dgSum(); });
    document.addEventListener('focusout', e=>{
      dgOutCount++; dgLastOut = e.relatedTarget ? (e.relatedTarget.id||e.relatedTarget.tagName) : 'никуда';
      diagLog('ФОКУС УШЁЛ    '+(e.target.id||e.target.tagName)+'  → '+dgLastOut); dgSum(); });
  }
  if(inp){
    ['touchstart','touchend','pointerdown','pointerup','click','keydown','input',
     'compositionstart','compositionend','beforeinput'].forEach(ev=>{
      inp.addEventListener(ev, e=>diagLog(ev+(e.key?(' key='+e.key):'')+(e.data?(' data='+e.data):'')+
        '  поле="'+inp.value+'"  фокус='+(document.activeElement?(document.activeElement.id||document.activeElement.tagName):'—')));
    });
    inp.addEventListener('focus', ()=>{
      [300,1000,2500].forEach(ms=>setTimeout(()=>{
        diagLog('через '+ms+'мс фокус='+(document.activeElement?(document.activeElement.id||document.activeElement.tagName):'—')); dgSum(); }, ms));
    });
  }
}
/* clipboard на file:// недоступен, поэтому просто выделяем текст — дальше «Копировать» в меню */
function dgSelect(){
  const el=document.getElementById('dgLog'); if(!el) return;
  const r=document.createRange(); r.selectNodeContents(el);
  const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r);
  try{ navigator.clipboard.writeText(el.textContent); diagLog('лог скопирован в буфер'); }
  catch(e){ diagLog('буфер недоступен — лог выделен, скопируйте через меню или сделайте снимок'); }
}

function goNext(){
  cancelAdvance(); showAll=false; pushGuard();
  if(page<NSCR-1){page++; if(page===3 && lensAuto()){ sel.lens=MY.lenses[0]; showManualForm=false; lensSkipped=true; page++; } render();}
  else if(page===NSCR-1){ if(!activeScen) countUse(); steps=buildSteps();stepIdx=0;page=NSCR;render();}
  else if(page===NSCR){ stepIdx<steps.length-1?(stepIdx++,render()):(page=NSCR+1,render()); }
}
function goBack(){
  cancelAdvance(); showAll=false;
  if(page===94 && cfFrom==='done'){ cfFrom=''; page=NSCR+1; render(); return; }
  if(page===94||page===95){ page=99; render(); return; }
  if(page===96){ page=findPrev||0; if(page===NSCR && !steps.length) steps=buildSteps(); render(); return; }
  if(page===97||page===98){ if(wizard){ wizard=false; page=0; applyMyDefaults(); render(); return; } page=99; render(); return; }
  if(page===99){closeSettings();return;}
  if(page===NSCR&&stepIdx>0){stepIdx--;render();return;}
  if(page===NSCR){page=NSCR-1;render();return;}
  if(page===NSCR+1){page=NSCR;stepIdx=steps.length-1;render();return;}
  if(page>0){page--; if(page===3 && lensSkipped) page--; render(); return;}
  if(page===0){ goSplash(1); return; }   /* первый шаг → стартовое меню */
}

/* ── filters actually in the bag ── */
function myVnds(){
  return sel.ndVario.map(id=>{
    if(id==='v-cust'){
      const a=parseFloat(vndCustom.min), b=parseFloat(vndCustom.max);
      if(isNaN(b)) return null;
      return { id, min:isNaN(a)?0:a, max:b, nm:'VND '+(isNaN(a)?0:a)+'–'+b };
    }
    const o=VND_OPTS.find(x=>x.id===id);
    return o ? { id, min:o.min, max:o.max, nm:o.nm||txt(o,0) } : null;
  }).filter(Boolean);
}
function myFixed(){ return sel.ndFixed.map(id=>FIX_OPTS.find(f=>f.id===id)).filter(Boolean); }
function hasFilters(){ return sel.gear.includes('nd') && (myVnds().length||myFixed().length); }

/* subsets of fixed filters up to n elements */
function subsetsOf(arr,n){
  const out=[[]];
  const rec=(start,cur)=>{ if(cur.length>=n) return;
    for(let i=start;i<arr.length;i++){ const nx=[...cur,arr[i]]; out.push(nx); rec(i+1,nx); } };
  rec(0,[]);
  return out;
}

/* pick the best filter combination for the required number of stops */
function bestCombo(need){
  if(!hasFilters()) return null;
  const vnds=myVnds(), fixs=myFixed(), cands=[];
  const fsubs=subsetsOf(fixs,3);
  for(const fs of fsubs){
    if(!fs.length) continue;
    const sum=fs.reduce((a,b)=>a+b.st,0);
    cands.push({min:sum,max:sum,parts:fs.map(x=>x.nm),n:fs.length,variable:false});
  }
  for(const v of vnds){
    for(const fs of fsubs){
      if(fs.length>2) continue;
      const add=fs.reduce((a,b)=>a+b.st,0);
      cands.push({min:v.min+add,max:v.max+add,parts:[v.nm,...fs.map(x=>x.nm)],
                  n:1+fs.length,variable:true,vnd:v,fixAdd:add});
    }
  }
  if(!cands.length) return null;
  const fits=cands.filter(c=>need>=c.min-0.15&&need<=c.max+0.15);
  if(fits.length){
    fits.sort((a,b)=> a.n-b.n || (b.variable?1:0)-(a.variable?1:0) || (a.max-a.min)-(b.max-b.min));
    return {...fits[0], exact:true};
  }
  /* nothing covers it — return the closest reachable */
  cands.sort((a,b)=>{
    const da = need>a.max ? need-a.max : a.min-need;
    const db = need>b.max ? need-b.max : b.min-need;
    return da-db || a.n-b.n;
  });
  return {...cands[0], exact:false};
}
function comboLabel(c){
  if(!c) return null;
  return c.parts.join(' + ');
}

const FIXED_ND=[{f:'ND2',st:1},{f:'ND4',st:2},{f:'ND8',st:3},{f:'ND16',st:4},
                {f:'ND32',st:5},{f:'ND64',st:6},{f:'ND256',st:8},{f:'ND1000',st:10}];
function suggestStack(shortfall){
  const pick = FIXED_ND.find(x=>x.st>=shortfall-0.15) || FIXED_ND[FIXED_ND.length-1];
  return pick;
}
function ndLabel(){
  const r=ndRange(); if(!r) return null;
  return r.min===r.max ? stops(r.max) : r.min+'–'+stops(r.max);
}

          : `To keep f/${E.Ntarget}: add <b>${add.f}</b> (${add.st} stops) to the current stack. Tick it in the filter list and the app will recalculate.`);

                :"This lens's closest focusing distance is not in the app database — check the lens spec sheet.")});
  }
  if(S.id==='night-sky'){
    out.push({type:'menu',crumb:[cm('menu'),cm('shooting'),cm('imgRec'),cm('longExpNr')],
      rows:[{n:cm('longExpNr'), v: ru?'Выкл — для стекинга/таймлапса · Вкл — для одиночного кадра':'Off — for stacking/timelapse · On — for a single frame', ok:true, hot:true}],
      hint: ru?'На длинных выдержках (примерно от 1 с) камера может снять второй, тёмный кадр той же длительности и вычесть его шум — это удваивает время между кадрами. Для одного астрокадра — Вкл, для серии на стекинг или таймлапса — Выкл.'

  }

  if(g.includes('mic')) out.push({type:'menu',crumb:[cm('menu'),cm('shooting'),cm('audioRec')],
    rows:[row('audioOn',t().on,{ok:true}),row('audioLvl',ru?'Ручной · пик −12 dB':'Manual · peak −12 dB',{ok:true,hot:true}),
          row('windNr',t().off,{ok:true})],
    hint:ru?'Ручной уровень стабильнее автоматического':'Manual level is steadier than auto'});

  if(g.includes('flash')) out.push({type:'menu',crumb:[cm('menu'),cm('shooting'),cm('shootDisp'),cm('liveView')],

             :`The computed ${fmtShut(shut)} is faster than the A6700 sync limit of 1/160. Without HSS a dark band cuts the frame. HSS costs power — expect a couple of metres of reach.`)

  if(g.includes('studioLight')){

        note: ru?'Собственный расчёт для студийного света (Manual) — не связан с расчётом по окружающему освещению выше.'

      out.push({type:'menu',crumb:[cm('menu'),cm('shooting'),cm('expColor')],
        rows:[row('shutter', fmtShut(stC.t), {ok:true,hot:true}), row('iso', String(stC.iso), {ok:true}), row('aperture','f/'+stC.N,{ok:true})],

      out.push({type:'menu',crumb:[cm('menu'),cm('shooting'), ru?'Вспышка':'Flash'],
        rows:[{n:ru?'Режим':'Mode', v: ru?'Ручной (M)':'Manual (M)', ok:true, hot:true},

                :'The “Flash” item is a generalisation on the A6700 — the exact items depend on how the studio light is triggered (X-sync port, radio trigger, optical slave off the built-in flash).'});
    }
  }

  if(g.includes('tripod')) out.push({type:'phys',t:ru?'Съёмка со штатива':'Tripod shooting',
    i:ru?'Проверьте что стабилизация отключена и камера закреплена':'Check stabilisation is off and the camera is locked down',
    h:ru?'Для длинных выдержек используйте автоспуск или пульт':'For long exposures use the self-timer or a remote'});

  if(g.includes('gimbal')) out.push({type:'phys',t:ru?'Балансировка гимбала':'Gimbal balancing',
    i:ru?'Отбалансируйте: наклон, крен, панорама — в этом порядке':'Balance: tilt, roll, pan — in that order',
    h:ru?'Балансировать с установленным фильтром и полностью собранной камерой':'Balance with the filter fitted and the rig fully assembled'});

  out.push({type:'menu',crumb:[cm('menu'),cm('shooting'),cm('shootMode')],
    rows:[row('regMode', scenMR() ? '→ '+scenMR() : '→ 1 / 2 / 3 / M1–M4',{ok:true,hot:true})],
    hint:ru?'Вызов — верхний диск камеры в положение 1, 2 или 3':'Recall with the top dial at 1, 2 or 3'});

  /* Физические действия не требуют хождения по меню — собираем их на один экран */
  const physList = out.filter(x=>x.type==='phys');
  if(physList.length>1){
    const at = out.findIndex(x=>x.type==='phys');
    const rest = out.filter(x=>x.type!=='phys');
    rest.splice(at,0,{type:'physgroup',items:physList});
    return rest;
  }
  return out;
}

function renderSteps(){
  if(!steps || !steps.length){ steps = buildSteps(); }
  if(!steps.length){ page = NSCR-1; renderPicker(); return; }
  if(stepIdx < 0) stepIdx = 0;
  if(stepIdx > steps.length-1) stepIdx = steps.length-1;
  const st=steps[stepIdx];
  document.getElementById('hdrStep').textContent=t().setupTitle;
  document.getElementById('hdrTitle').textContent=t().stepN(stepIdx+1,steps.length);
  renderPreview(); renderChips();
  const dots=steps.map((_,i)=>`<div class="dotw" onclick="jumpStep(${i})"><div class="dot ${i<stepIdx?'done':i===stepIdx?'now':''}"></div></div>`).join('');
  document.querySelector('.hdr').classList.add('slim');
  let h=`<div class="prog"><div class="prog-t">${t().doOnCam}</div><div class="dots">${dots}</div></div>`;
  if(st.type==='physgroup'){
    h+=`<div class="pcard"><div class="pt">⚙ ${appLang==='ru'?'Приготовьте камеру':'Set up the camera'}</div>`
      + st.items.map(x=>`<div style="margin-top:12px"><div class="pi">${x.t} — ${x.i}</div>`
          + (x.h?`<div class="ph">${x.h}</div>`:'') + `</div>`).join('')
      + `</div>`;
    h+=`<div class="hint">${appLang==='ru'
        ?'Всё это делается руками, без меню. Сделайте и переходите дальше — дальше пойдут настройки по меню'

/* меньше нажатий: соседние экраны с одинаковым путём — в один; расчёт экспозиции — в экран экспозиции */
function compactSteps(list){
  list = list.slice(); const out = [];
  const same = (p,q)=>p.crumb.join('>')===q.crumb.join('>');
  const cat = (a,b)=>[a,b].filter(Boolean).join('<br><br>') || null;
  for(let i=0;i<list.length;i++){
    const st = list[i];
    if(st.type==='calc' && list[i+1] && list[i+1].type==='menu'){ list[i+1] = Object.assign({}, list[i+1], {calc:st}); continue; }
    const p = out[out.length-1];
    if(p && p.type==='menu' && st.type==='menu' && !p.nav && !st.nav && same(p,st)){
      out[out.length-1] = Object.assign({}, p, {rows:[...p.rows, ...st.rows], hint:cat(p.hint,st.hint),
        tip:cat(p.tip,st.tip), note:cat(p.note,st.note), calc:p.calc||st.calc});
      continue;
    }
    out.push(st);
  }
  /* одна и та же страница дважды (переход в Log + формат/частота) — всё на первом заходе */
  for(let i=0;i<out.length;i++){
    const nv = out[i]; if(nv.type!=='menu' || !nv.nav) continue;
    const j = out.findIndex((q,x)=>x>i && q.type==='menu' && !q.nav && same(nv,q));
    if(j<0) continue;
    const q = out[j], rows = nv.rows.map(r=>Object.assign({},r));
    q.rows.forEach(r=>{
      const at = rows.findIndex(x=>x.k && x.k===r.k);
      if(at>=0) rows[at] = Object.assign({}, rows[at], {v:r.v, ok:r.ok});
      else { const h = rows.findIndex(x=>x.hot); rows.splice(h<0?rows.length:h, 0, Object.assign({}, r, {hot:false})); }
    });
    out[i] = Object.assign({}, nv, {rows, hint:cat(nv.hint,q.hint), note:cat(nv.note,q.note)});
    out.splice(j,1);
  }
  return out;
}

  }).join('');
  let h = `<div class="card path-card" style="--sc:${col}"><div class="ladder">`
    + `<div class="lad-top">${iconHtml(cr)}<span class="lad-lbl">${ru?'Путь в меню камеры':'Camera menu path'}</span>`
    + (A?`<span class="lad-hint">${ru?'нажмите на шаг':'tap a step'}</span>`:'')
    + `</div>${lv}</div>`
    + `<div class="rows-h">${ru?'На этой странице установите':'On this page set'}${B?` <span style="text-transform:none;letter-spacing:0;color:#5f5f5f">· ${ru?'нажмите — варианты':'tap for options'}</span>`:''}</div>`;
  h += st.rows.map((r,ri)=>{
    const go = st.nav && r.hot;
    const tv = B && !go;
    const has = tv && !!valsForRow(r);
    const click = go ? ' onclick="goNext()"' : (has ? ` onclick="openValues(${ri})"` : '');
    return `<div class="mrow ${r.hot?'hot':''} ${r.ok?'ok':''} ${go?'tap':''} ${has?'tapv':''}"${click}>`
      + `<span class="mn">${r.n}</span><span class="mv">${r.v}</span>`
      + (has?`<span class="vmore">▾</span>`:'') + `</div>`;
  }).join('') + `</div>`;
  if(st.calc){
    const c = st.calc;
    h += `<div class="ccard mini"><div class="ct">∑ ${t().calcH}</div>`
      + c.rows.map(([k,v,cl])=>`<div class="crow"><span class="ck">${k}</span><span class="cv ${cl||''}">${v}</span></div>`).join('')
      + (c.warn?`<div class="cwarn">${c.warn}</div>`:'') + (c.bad?`<div class="cbad">${c.bad}</div>`:'')
      + (c.note?`<div class="cnote">${c.note}</div>`:'') + `</div>`;
  }
  return h;
}

let sheetOpen = false;
function showSheet(kicker, title, body){
  cancelAdvance(); pushGuard(); sheetOpen = true;
  const s = document.getElementById('sheet');
  s.innerHTML = `<div class="sh-bg" onclick="navBack()"></div><div class="sh-box"><div class="sh-grip"></div>`
    + `<div class="sh-k">${kicker}</div><div class="sh-t">${title}</div>${body}`
    + `<button class="btn btn-sec sh-close" onclick="navBack()">${appLang==='ru'?'Закрыть':'Close'}</button></div>`;
  s.className = 'open';
}
function hideSheet(){ sheetOpen = false; const s = document.getElementById('sheet'); s.className = ''; s.innerHTML = ''; }

/* ВАРИАНТ A: нажали шаг пути — что внутри него, куда идти дальше */
function openLevel(i){
  const st = steps[stepIdx], cr = st.crumb, ru = appLang==='ru', col = iconFor(cr).c;
  const node = TREE[KEY_OF(cr[i])];
  const nm = String(cr[i]).split('|')[0];
  const last = i===cr.length-1;
  const cur = last ? st.rows.map(r=>r.k).filter(Boolean) : [KEY_OF(cr[i+1])];
  let body;
  if(!node){
    body = `<div class="sh-gap">${ru?'Для этого уровня в приложении пока нет данных — нужен скрин этой страницы меню.':'No data for this level yet — a screenshot of this menu page is needed.'}</div>`;
  } else {
    body = node.kids.map((kd,j)=>{
      const key = typeof kd==='string' ? kd : null;
      const name = key ? cm(key) : nmv(kd,camLang);
      if(!name) return '';
      const isCur = key && cur.includes(key);
      const num = node.nums ? `<span class="sh-num" style="background:${col}">${node.nums[j]}</span>` : '';
      const rv = (isCur && last) ? (st.rows.find(r=>r.k===key)||{}).v : null;
      const tag = isCur ? (last ? `<span class="val">${rv||''}</span>` : `<span class="go">›</span>`)
                : '';
      return `<div class="sh-i ${isCur?'cur':''}">${num}<span>${name}</span>${tag}</div>`;
    }).join('');
    body += `<div class="sh-note">${node.ordered
      ? (ru?'Номера групп — как на экранах вкладки.':'Group numbers as on the tab screens.')
      : (ru?'Показаны только пункты, которые уже есть в приложении. Полный состав и порядок — после скрина этой страницы.':'Only items already in the app are shown. Full list and order after a screenshot of this page.')}</div>`;
  }
  const kicker = last ? (ru?'Последний шаг · что установить':'Last step · what to set')
                      : (ru?`Шаг ${i+1} из ${cr.length} · что внутри`:`Step ${i+1} of ${cr.length} · what is inside`);
  showSheet(kicker, nm, body);
}

/* ВАРИАНТ B: нажали пункт — все варианты его значения, наш подсвечен */
function nrm(x){ return String(x).toLowerCase().replace(/[\s.,()]/g,''); }
function matchVals(list, v){
  const out = [], nv = nrm(v), m = String(v).match(/^(\d+)\s*[–-]\s*(\d+)$/);
  list.forEach((o,j)=>{ if(nrm(o)===nv || (m && +o>=+m[1] && +o<=+m[2])) out.push(j); });
  return out;
}
function openValues(ri){
  const st = steps[stepIdx], r = st.rows[ri], ru = appLang==='ru';
  const d = valsForRow(r);
  const goal = String(st.crumb[st.crumb.length-1]).split('|')[0];
  let body;
  if(!d){
    body = `<div class="sh-note">${ru?'Ставим':'Set'}: <b>${r.v}</b></div>`;
  } else {
    const list = d[camLang] || d.en || d.ru, hit = matchVals(list, r.v);
    body = list.map((o,j)=>`<div class="sh-i ${hit.includes(j)?'cur':''}"><span>${o}</span>`
      + (hit.includes(j)?`<span class="tag">${ru?'ставим':'set'}</span>`:'') + `</div>`).join('');
    if(d.partial) body += `<div class="sh-gap">${ru?'… есть и другие варианты — полный список после скрина':'… more options exist — full list after a screenshot'}</div>`;
    if(!hit.length) body += `<div class="sh-note">${ru?'Ставим':'Set'}: <b>${r.v}</b></div>`;
    body += `<div class="sh-note">${ru?'Список взят из данных приложения.':'List taken from the app data.'}</div>`;
  }
  showSheet(goal, r.n, body);
}

function jumpStep(i){ cancelAdvance(); if(i===stepIdx) return; stepIdx = i; render(); }

/* оболочка артефакта ставит свой viewport без interactive-widget: дописываем,
   иначе Android при появлении клавиатуры не уменьшает страницу и поле ввода
   остаётся под клавиатурой (а IME от этого закрывается) */
(function(){
  try{
    const m=document.querySelector('meta[name="viewport"]');
    if(!m) return;
    let c=m.getAttribute('content')||'';
    c=c.replace(/,?\s*(maximum-scale|user-scalable)\s*=\s*[^,]+/gi,'');
    if(!/interactive-widget/i.test(c)) c=c.replace(/\s*$/,'')+', interactive-widget=resizes-content';
    m.setAttribute('content', c.replace(/^\s*,\s*/,''));
  }catch(e){}
})();

/* ── клавиатура и поля ввода ──
   Ничего не перестраиваем в момент появления клавиатуры: изменение высоты предка
   или scrollIntoView во время подъёма IME на Android гасит клавиатуру.
   Единственное, что делаем — через полсекунды аккуратно подкручиваем #body,
   если поле оказалось за нижней кромкой. Меняем только scrollTop списка. */
(function(){
  const nudge = el => {
    const box = document.getElementById('body');
    if(!box || !el || !box.contains(el)) return;
    const r = el.getBoundingClientRect(), b = box.getBoundingClientRect();
    const below = r.bottom - b.bottom;
    if(below > 0) box.scrollTop += below + 16;
  };
  document.addEventListener('focusin', e => {
    const el = e.target;
    if(!el || !(el.tagName==='INPUT' || el.tagName==='TEXTAREA')) return;
    setTimeout(()=>nudge(el), 500);
  });
})();

/* свайп влево / вправо на экране шагов */
(function(){
  const b = document.getElementById('body'); if(!b) return;
  let sx=0, sy=0, t0=0;
  b.addEventListener('touchstart', e=>{ const p=e.touches[0]; sx=p.clientX; sy=p.clientY; t0=Date.now(); }, {passive:true});
  b.addEventListener('touchend', e=>{
    if(page!==NSCR || sheetOpen) return;
    const p=e.changedTouches[0], dx=p.clientX-sx, dy=p.clientY-sy;
    if(Math.abs(dx)>70 && Math.abs(dy)<50 && Date.now()-t0<700){ if(dx<0) goNext(); else navBack(); }
  }, {passive:true});
})();

function rxLookup(en){
  const k = appLang==='it' ? 0 : 1;
  if(typeof en!=='string') return en;
  const hit = RX[en]; if(hit) return hit[k];
  for(const p of RXP){ if(p[0].test(en)) return en.replace(p[0], p[1+k]); }
  return en;
}
const R = (ru,en,es,fr,de,pt) => {
  if(appLang==='ru') return ru;
  if(appLang==='es') return es!==undefined?es:en;

  if(appLang==='de') return de!==undefined?de:en;
  if(appLang==='pt') return pt!==undefined?pt:en;
  if(appLang==='it'||appLang==='tr') return rxLookup(en);
  return en;
};

/* умный поиск: понимает 4/16-70, 1.4/15, 12/2, sel35f18, f1.8, 16-70mm, опечатку в одну букву */
function lev(a,b){
  if(Math.abs(a.length-b.length)>1) return 9;
  const d=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){ let p=d[0]; d[0]=i;
    for(let j=1;j<=b.length;j++){ const t=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=t; } }
  return d[b.length];
}
function parseQ(v){
  const q = v.toLowerCase().replace(/,/g,'.').replace(/мм|mm/g,' ')
    .replace(/([a-zа-яё])(\d)/g,'$1 $2').replace(/(\d)([a-zа-яё])/g,'$1 $2');
  const toks = q.split(/[\s\/\-–—:;+*()|]+/).filter(Boolean);
  const nums=[], words=[];
  toks.forEach(t=>{ if(/^\d+(\.\d+)?$/.test(t)) nums.push(parseFloat(t)); else if(!['f','ф','e'].includes(t)) words.push(t); });
  return {nums, words};
}
function numHit(n, f, a){
  const eq=(x,y)=>Math.abs(x-y)<1e-6;
  if(f.some(x=>eq(x,n)) || a.some(x=>eq(x,n))) return true;
  if(Number.isInteger(n) && n>=10 && n<100 && a.some(x=>eq(x*10,n))) return true;   // 18 → f/1.8
  return false;
}
function wordHit(w, s){
  if(s.includes(w)) return true;
  if(w.length<4) return false;
  return s.split(/[\s|]+/).some(t=>t.length>=3 && (lev(t,w)<=1 || (t.length>w.length && lev(t.slice(0,w.length),w)<=1)));
}
function lensQ(v){
  lensQuery = v; const {nums, words} = parseQ(v);
  const code = v.toLowerCase().replace(/[^a-z0-9]/g,'');
  const byCode = /^sel/.test(code) && code.length>=5 && [...document.querySelectorAll('.lopt')].some(el=>el.dataset.m.startsWith(code));
  const seen = {}; let n=0;
  document.querySelectorAll('.lopt').forEach(el=>{
    const f = el.dataset.f.split(',').map(Number), a = el.dataset.a.split(',').map(Number);
    const ok = byCode ? el.dataset.m.startsWith(code) : (nums.every(x=>numHit(x,f,a)) && words.every(w=>wordHit(w, el.dataset.s)));
    el.style.display = ok ? '' : 'none';
    if(ok){ seen[el.dataset.b]=1; n++; }
  });
  document.querySelectorAll('.lbrand[data-b]').forEach(el=>{ el.style.display = seen[el.dataset.b] ? '' : 'none'; });
  const nn = document.getElementById('lnone'); if(nn) nn.style.display = (n || !v.trim()) ? 'none' : '';
}
function showLensAll(e){ e.stopPropagation(); lensAll=true; renderPicker(); }
function toggleMyLens(e,id){

  MY.lenses = MY.lenses.includes(id) ? MY.lenses.filter(x=>x!==id) : [...MY.lenses, id];
  if(id.startsWith('c_') && !MY.lenses.includes(id)){ MY.custom=(MY.custom||[]).filter(c=>c.id!==id); mergeCustom(); }

  const b = document.getElementById('body'), st = b.scrollTop;

  b.scrollTop = st;
}

  pickHint:['Файл создаётся из встроенного шаблона: при загрузке на камеру все остальные настройки камеры станут такими, как в шаблоне, а изменятся только ISO, Кельвины и зебра. Чтобы остальные настройки остались вашими, сохраните настройки в камере ({p}) и выберите этот файл как основу (карта вставлена в компьютер, PRIVATE/SONY/SETTING/6700/CAMSET).','The file is made from a built-in template: when loaded on the camera, all other camera settings become those of the template, and only ISO, Kelvin and zebra change. To keep your other settings, save the settings on the camera ({p}) and choose that file as the base (card inserted in the computer, PRIVATE/SONY/SETTING/6700/CAMSET).','El archivo se crea a partir de una plantilla integrada: al cargarlo en la cámara, el resto de ajustes pasan a ser los de la plantilla y solo cambian ISO, Kelvin y zebra. Para conservar sus demás ajustes, guárdelos en la cámara ({p}) y elija ese archivo como base (tarjeta en el ordenador, PRIVATE/SONY/SETTING/6700/CAMSET).','Le fichier est créé à partir d’un modèle intégré : une fois chargé dans l’appareil, tous les autres réglages deviennent ceux du modèle, seuls l’ISO, les Kelvin et le zebra changent. Pour garder vos autres réglages, enregistrez-les dans l’appareil ({p}) et choisissez ce fichier comme base (carte dans l’ordinateur, PRIVATE/SONY/SETTING/6700/CAMSET).','Die Datei entsteht aus einer eingebauten Vorlage: Beim Laden in die Kamera werden alle anderen Einstellungen die der Vorlage, nur ISO, Kelvin und Zebra ändern sich. Um Ihre übrigen Einstellungen zu behalten, speichern Sie sie in der Kamera ({p}) und wählen Sie diese Datei als Basis (Karte im Computer, PRIVATE/SONY/SETTING/6700/CAMSET).','O arquivo é criado a partir de um modelo embutido: ao carregar na câmera, os demais ajustes passam a ser os do modelo e só ISO, Kelvin e zebra mudam. Para manter seus outros ajustes, salve-os na câmera ({p}) e escolha esse arquivo como base (cartão no computador, PRIVATE/SONY/SETTING/6700/CAMSET).','Il file nasce da un modello integrato: caricandolo sulla fotocamera, tutte le altre impostazioni diventano quelle del modello e cambiano solo ISO, Kelvin e zebra. Per mantenere le altre impostazioni, salvale sulla fotocamera ({p}) e scegli quel file come base (scheda nel computer, PRIVATE/SONY/SETTING/6700/CAMSET).','Dosya yerleşik bir şablondan oluşturulur: kameraya yüklenince diğer tüm ayarlar şablondaki gibi olur, yalnızca ISO, Kelvin ve zebra değişir. Diğer ayarlarınızı korumak için onları kamerada kaydedin ({p}) ve o dosyayı taban olarak seçin (kart bilgisayarda, PRIVATE/SONY/SETTING/6700/CAMSET).'],

let cfFrom = '', cfBuf = null, cfName = '', cfP = null, cfSrc = null, cfPick = {iso:true,wb:true,zebra:true}, cfNum = '01', cfMsg = '';

function cfParse(u8){
  if(u8.length!==162188) return {err:'file'};
  const hd = String.fromCharCode.apply(null, Array.from(u8.slice(0,14)));
  if(hd.slice(0,5)!=='SONY1' || hd.indexOf('ILCE-6700')<0) return {err:'file'};
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let off = 0x3c; const blocks = [];
  for(let b=0;b<13;b++){
    if(off+4>0x27988) return {err:'file'};
    const n = dv.getUint32(off,true); let p = off+4; const recs = {};
    for(let i=0;i<n;i++){
      if(p+8>0x27988 || dv.getUint16(p+2,true)!==0x02cf) return {err:'file'};
      const tag = dv.getUint16(p,true), len = dv.getUint16(p+4,true)*dv.getUint16(p+6,true);
      recs[tag] = {off:p+8, len:len}; p += 8+len;
    }
    blocks.push(recs); off = p;
  }
  if(off!==0x27988) return {err:'file'};
  let sum = 0; for(let i=0x3c;i<off;i++) sum = (sum+u8[i])>>>0;
  const head = String.fromCharCode.apply(null, Array.from(u8.slice(0,0x30)));
  const m = head.match(/\d{8}_\d{6}/);
  return {blocks:blocks, end:off, sumOk: sum===dv.getUint32(off,true), ts: m?m[0]:''};
}
function cfGet(u8,P,tag,size){
  const r = P.blocks[0][tag]; if(!r || r.len!==size) return null;
  if(size===4) return new DataView(u8.buffer,u8.byteOffset).getInt32(r.off,true);
  return u8[r.off];
}
function cfAny(u8,P,tag){
  const r = P.blocks[0][tag]; if(!r) return null;
  if(r.len===4) return new DataView(u8.buffer,u8.byteOffset).getInt32(r.off,true);
  if(r.len===1) return u8[r.off]; return null;
}
/* значения из файла — без привязки к языку (хранятся в снимке) */
function cfVals(u8,P){
  const g = (t)=>cfAny(u8,P,t), v = {};
  let x;
  if((x=g(0x332))!==null) v.iso = x;
  if((x=g(0x112))!==null) v.wb = x*100;
  if((x=g(0x377))!==null) v.zebra = x;
  if((x=g(0x53))!==null) v.pp = x;
  if((x=g(0x2f5))!==null) v.ss = x;
  if(v.ss===0 && (x=g(0x2f7))!==null) v.ssm = x;
  if((x=g(0x1018))!==null) v.log = x;
  if((x=g(0x3b9))!==null) v.pk = x;
  if((x=g(0x3bb))!==null) v.pkl = x;
  if((x=g(0x3bd))!==null) v.pkc = x;
  if((x=g(0x34e))!==null) v.meter = x;
  if((x=g(0x100))!==null) v.ec = x;
  return v;
}
function cfValRows(v){
  const rows = [];
  if(v.iso!==undefined) rows.push([cft('fISO'), v.iso===0 ? cft('vAuto') : (CF_ISO[v.iso-5]||('#'+v.iso))]);
  if(v.wb!==undefined) rows.push([cft('fWB'), v.wb]);
  if(v.zebra!==undefined) rows.push([cft('fZebra'), v.zebra<=6 ? 70+5*v.zebra : '#'+v.zebra]);
  if(v.pp!==undefined) rows.push([cft('fPP'), v.pp===0 ? cft('vOff') : 'PP'+v.pp]);
  if(v.log!==undefined) rows.push([cft('fLog'), v.log ? cft('vOn') : cft('vOff')]);
  if(v.ss!==undefined) rows.push([cft('fSS'), v.ss===0 ? cft('vOn')+(v.ssm?' · '+(v.ssm===1?'Active':'Standard'):'') : cft('vOff')]);
  if(v.pk!==undefined) rows.push([cft('fPk'), v.pk ? cft('vOn') : cft('vOff')]);
  if(v.pk && v.pkl!==undefined) rows.push([cft('fPkL'), [cft('vHi'),cft('vMid'),cft('vLo')][v.pkl]||'#'+v.pkl]);
  if(v.pk && v.pkc!==undefined) rows.push([cft('fPkC'), [cft('vRed'),cft('vYel'),cft('vBlue'),cft('vWhite')][v.pkc]||'#'+v.pkc]);
  return rows;
}
function cfRows(u8,P){ return cfValRows(cfVals(u8,P)); }
/* значения выбранного сценария: ISO, Кельвины, зебра */
function cfScenVals(src){
  const keep = {sel:sel, ml:manualLens, vc:vndCustom, lc:ledCustom};
  try{
    if(src!=='cur'){
      const s = scenById(src); if(!s || !s.data) return null;
      sel = Object.assign({}, sel, JSON.parse(JSON.stringify(s.data.sel||{})));
      if(s.data.manualLens) manualLens = Object.assign({}, s.data.manualLens);
      if(s.data.vndCustom) vndCustom = Object.assign({}, s.data.vndCustom);
      if(s.data.ledCustom) ledCustom = Object.assign({}, s.data.ledCustom);
    }
    const out = {}, E = computeExposure(), L = L_();
    const iso = E ? (E.isoUp || E.iso) : null;
    if(iso && iso>=100 && iso<=51200){ const k = Math.round(3*Math.log2(iso/100)); if(k>=0 && k<=27) out.iso = {v:5+k, shown:CF_ISO[k]}; }
    if(L){
      const w = val(L.wb), nums = (typeof w==='string' ? (w.match(/\d{4}/g)||[]) : []).map(Number);
      if(nums.length){ const K = Math.round((nums.reduce((a,b)=>a+b,0)/nums.length)/100)*100; if(K>=2500 && K<=9900) out.wb = K; }
      const z = parseInt(zebraLvl(),10); if(z>=70 && z<=100 && (z-70)%5===0) out.zebra = z;
      if(sel.profile==='scinetone') out.pp = 11; else if(sel.profile==='slog3') out.pp = 0;
      if(sel.profile) out.log = (sel.profile==='slog3') ? 1 : 0;
      const S2 = S_(), LN2 = lensObj();
      if(S2){ const gg = sel.gear||[]; let sv = val(S2.stab);
        if(gg.includes('tripod')) sv = t().off; else if(gg.includes('gimbal')) sv = t().stdStab;
        if(isVideo() && sel.fps>=100 && sv!==t().off) sv = t().stdStab;
        if(sv!==undefined && sv!==null && sv!=='') out.ss = (sv===t().off) ? 1 : 0;
        if(out.ss===0) out.ssm = /activ|актив/i.test(String(sv)) ? 1 : 2; }
      out.vid = isVideo();
      if(!out.vid){ delete out.log; delete out.ssm; }
      if((S2 && /РФ|MF/.test(val(S2.focus)||'')) || (LN2 && LN2.af===false))
        out.peak = (['night-street','indoor-lamp','dusk'].includes(L.id)) ? 3 : (['sun-hard','sun-soft'].includes(L.id) ? 0 : 1);
    }
    return out;
  } finally { sel = keep.sel; manualLens = keep.ml; vndCustom = keep.vc; ledCustom = keep.lc; }
}
function cfApply(u8,P,ch){
  const o = new Uint8Array(u8), r = P.blocks[0], dv = new DataView(o.buffer);
  const set1 = (t,v)=>{ if(!r[t] || r[t].len!==1) throw new Error('tag'); o[r[t].off] = v & 255; };
  if(ch.iso){ set1(0xe5, ch.iso.v+6); [0x332,(ch.vid?0xdee:0xdec),0xfd8,0xfda].forEach(t=>set1(t,ch.iso.v)); }
  if(ch.wb){ const q = ch.wb/100; if(!r[0x112] || r[0x112].len!==4) throw new Error('tag'); dv.setInt32(r[0x112].off,q,true); set1(0xb8b,q-25);
    if(ch.vid){
      /* видео: режим «Цв.темп./Фильтр» (как записала камера при ручном выборе 4300K) */
      set1(0xb8f,q-25); set1(0x10a,0x0e); set1(0x365,0x0b); set1(0xe0a,0x0b);
      [0xc5d,0xc7b,0xebd,0xef5,0x11cc,0x1208,0x1226].forEach(t=>{ if(!r[t]||r[t].len!==4) throw new Error('tag'); dv.setInt32(r[t].off,0,true); });
      if(!r[0x1004]||r[0x1004].len!==4) throw new Error('tag'); dv.setInt32(r[0x1004].off,0x1b58,true);
    } else set1(0xb8d,q-25); }
  if(ch.zebra){ set1(0x377,(ch.zebra-70)/5); }
  if(ch.log!==undefined){ set1(0x1018,ch.log);
    if(ch.log){ set1(0x101a,0); set1(0x101c,1); set1(0x480,1); set1(0x481,2); } }
  if(ch.pp!==undefined){ set1(0x53,ch.pp); set1(0xe0c,ch.pp); }
  if(ch.ss!==undefined){ set1(0x2f5,ch.ss); if(ch.ss===0 && ch.ssm) set1(0x2f7,ch.ssm); }
  if(ch.peak!==undefined){ set1(0x3b9,1); set1(0x3bb,1); set1(0x3bd,ch.peak); }
  let sum = 0; for(let i=0x3c;i<P.end;i++) sum = (sum+o[i])>>>0;
  dv.setUint32(P.end,sum,true);
  return o;
}

function cfB64(u8){ let r=''; for(let i=0;i<u8.length;i+=8192) r += String.fromCharCode.apply(null,u8.subarray(i,i+8192)); return btoa(r); }
async function cfZip(u8){

async function cfUnzip(c){

  if(!c.z) return bin;

let camEdit = null;
function camById(id){ return (MY.cams||[]).find(x=>x.id===id); }
function camFile(inp){
  const f = inp.files && inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = async ()=>{
    inp.value = '';
    const u8 = new Uint8Array(rd.result), P = cfParse(u8);
    if(P.err || !P.sumOk){ cfMsg = cft('camBadModel'); renderMyScen(); return; }
    const m = f.name.match(/CAMSET(\d+)/i), ts = P.ts ? P.ts.replace(/^(\d{4})(\d\d)(\d\d)_(\d\d)(\d\d).*$/,'$3.$2.$1 $4:$5') : '';
    const c = await cfZip(u8);
    const item = {id:'c'+Date.now().toString(36), name:'A6700 '+(m?m[1]+' ':'')+(ts?'· '+ts:''), created:Date.now(), z:c.z, b:c.b, v:cfVals(u8,P)};
    const prev = (MY.cams||[]).slice(); MY.cams = prev.concat([item]);
    try{ localStorage.setItem(MYKEY, JSON.stringify(MY)); cfMsg = cft('camAdded')+': '+item.name; }
    catch(e){ MY.cams = prev; cfMsg = cft('camLimit'); }
    renderMyScen();
  };

function cfSources(){

function cfFile(inp){
  const f = inp.files && inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    const u8 = new Uint8Array(rd.result), P = cfParse(u8);
    cfMsg = ''; cfName = f.name;
    if(P.err){ cfBuf = null; cfP = null; cfMsg = cft('badFile'); cfTplTried = false; }
    else{ cfBuf = u8; cfP = P; cfIsTpl = false; if(!P.sumOk) cfMsg = cft('badSum');
      const mm = f.name.match(/CAMSET(\d\d)/i); if(mm && +mm[1]>=1 && +mm[1]<=10) cfNum = mm[1]; }
    const src = cfSources(); if(!cfSrc || !src.find(x=>x.id===cfSrc)) cfSrc = src.length ? src[0].id : null;
    renderCamFile();
  };
  rd.readAsArrayBuffer(f);
}

async function cfSave(){
  if(typeof cfSrc==='string' && cfSrc.indexOf('cam:')===0){
    const c = camById(cfSrc.slice(4)); if(!c || cfNum.length!==2) return;
    try{
      const out = await cfUnzip(c), chk = cfParse(out);
      if(chk.err || !chk.sumOk) throw new Error('verify');
      const blob = new Blob([out], {type:'application/octet-stream'}), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'CAMSET'+cfNum+'.DAT';
      document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      cfMsg = 'CAMSET'+cfNum+'.DAT — '+cft('saved');
    }catch(e){ cfMsg = cft('badFile'); }
    renderCamFile(); return;
  }
  if(!cfBuf || !cfP || !cfP.sumOk || cfNum.length!==2) return;
  const vals = cfSrc ? (cfScenVals(cfSrc)||{}) : {}, ch = {};
  ['iso','wb','zebra','peak','ss','ssm','pp','log','vid'].forEach(k=>{ if(vals[k]!==undefined) ch[k] = vals[k]; });
  try{
    const out = cfApply(cfBuf, cfP, ch), chk = cfParse(out);
    if(chk.err || !chk.sumOk) throw new Error('verify');
    const blob = new Blob([out], {type:'application/octet-stream'}), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'CAMSET'+cfNum+'.DAT';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    cfMsg = 'CAMSET'+cfNum+'.DAT — '+cft('saved');
  }catch(e){ cfMsg = cft('badFile'); }
  renderCamFile();
}
function renderCamFile(){
  document.getElementById('hdrStep').textContent = t().settings;
  document.getElementById('hdrTitle').textContent = cft('title');
  document.getElementById('prev').style.display='none';
  document.getElementById('chips').style.display='none';
  if(!cfBuf && !cfTplTried){ cfTplTried = true; cfLoadTpl().then(()=>{ if(page===94) renderCamFile(); }); }
  const path = cfMenuPath();
  let h = (typeof cfSrc==='string' && cfSrc.indexOf('cam:')===0) ? '' : `<div class="sect-note">${esc(cft('exp'))}</div>`;
  if(cfMsg) h += `<div class="my-note">${esc(cfMsg)}</div>`;
  if(cfBuf && cfP){
    const src = cfSources();
    if(!src.length) h += `<div class="my-note">${esc(cft('noScen'))}</div>`;

      if(src.length>1) h += `<div class="sect-h">${esc(cft('scenH'))}</div>` + src.map(s=>`<div class="opt ${cfSrc===s.id?'sel':''}" onclick="cfSetSrc('${s.id}')"><div class="radio"></div><div class="opt-body"><div class="opt-name">${esc(s.name)}</div></div></div>`).join('');
      const isCam = typeof cfSrc==='string' && cfSrc.indexOf('cam:')===0, camC = isCam ? camById(cfSrc.slice(4)) : null;
      const vals = (cfSrc && !isCam) ? (cfScenVals(cfSrc)||{}) : {}, parts = [];
      if(camC) cfValRows(camC.v||{}).forEach(r=>parts.push(r[0]+' '+r[1]));
      if(vals.iso) parts.push(cft('fISO')+' '+vals.iso.shown);
      if(vals.wb) parts.push(cft('fWB')+' '+vals.wb);
      if(vals.zebra) parts.push(cft('fZebra')+' '+vals.zebra);
      if(vals.log!==undefined) parts.push(R('Log-съемка','Log Shooting')+' '+(vals.log?cft('vOn'):cft('vOff'))+(vals.log?' (+ LUT Display)':''));
      if(vals.pp!==undefined) parts.push(cft('fPP')+' '+(vals.pp?'PP'+vals.pp:cft('vOff')));
      if(vals.ss!==undefined) parts.push('SteadyShot '+(vals.ss?cft('vOff'):(vals.vid&&vals.ssm?(vals.ssm===1?'Active':'Standard'):cft('vOn'))));
      if(vals.peak!==undefined) parts.push(cft('fPk')+' '+[cft('vRed'),cft('vYel'),cft('vBlue'),cft('vWhite')][vals.peak]);
      h += `<div class="sect-note">${esc(parts.join(' · ') || cft('nothing'))}</div>`;
      if(camC) h += `<div class="sect-note">${esc(cft('camFull'))}</div>`;
      h += `<div class="sect-h">${esc(cft('num'))}</div>
        <div class="mrc" style="padding:4px 0 8px">${['01','02','03','04','05','06','07','08','09','10'].map(n=>`<span class="mr ${cfNum===n?'on':''}" onclick="cfSlot('${n}')">${n}</span>`).join('')}</div>
        <div class="my-note">${esc(cft('slots'))}</div>
        <div class="bkp" style="padding-top:10px"><button class="btn btn-pri" id="cfSave" onclick="cfSave()">⤓ ${esc(cft('save'))} CAMSET${esc(cfNum)}.DAT</button></div>
        <div class="sect-note">${esc(cft('after').replace('{p}',path))}</div>
        <div class="sect-note">${esc(cft('reboot'))}</div>`;
    }
  }
  document.getElementById('body').innerHTML = h;
  const bot=document.getElementById('bot'); bot.style.display='flex';
  bot.innerHTML = `<button class="btn btn-pri" style="flex:1" onclick="navBack()">${t().done}</button>`;
}
