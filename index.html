Video.", "O principal: fazer tudo rápido e aproveitar a criatividade de fotografar e filmar, tanto foto quanto vídeo.", "L’essenziale: fare tutto in fretta e godersi la creatività dello scatto, sia in foto sia in video.", "Asıl önemlisi: her şeyi çabucak halledip hem fotoğraf hem video çekmenin yaratıcı keyfini yaşamak."], "p4": ["На следующей странице — короткое описание возможностей приложения и как ими пользоваться.", "The next page briefly describes what the app can do and how to use it.", "En la página siguiente encontrarás una breve descripción de lo que hace la aplicación y cómo usarla.", "La page suivante décrit brièvement ce que fait l’application et comment l’utiliser.", "Auf der nächsten Seite steht kurz, was die App kann und wie man sie benutzt.", "Na próxima página há uma breve descrição do que o aplicativo faz e como usá-lo.", "Nella pagina successiva trovi una breve descrizione di ciò che fa l’app e di come usarla.", "Sonraki sayfada uygulamanın neler yapabildiği ve nasıl kullanılacağı kısaca anlatılıyor."], "p2h": ["Что умеет приложение", "What the app can do", "Qué hace la aplicación", "Ce que fait l’application", "Was die App kann", "O que o aplicativo faz", "Cosa fa l’app", "Uygulama neler yapar"], "f1t": ["🔎 Поиск по меню (мини-глоссарий)", "🔎 Menu search (mini-glossary)", "🔎 Búsqueda en el menú (mini glosario)", "🔎 Recherche dans le menu (mini-glossaire)", "🔎 Menüsuche (Mini-Glossar)", "🔎 Busca no menu (mini glossário)", "🔎 Ricerca nel menu (mini glossario)", "🔎 Menüde arama (mini sözlük)"], "f1d": ["Не помнишь, как называется нужный пункт и где он лежит? Напиши по-своему: «экспозиция», «пикинг», «таймлапс». Приложение знает, как это называет Sony, и покажет точное название, путь по меню и что это делает. Если слово понимают по-разному, оно уточнит, что ты имеешь в виду.", "Can’t remember what an item is called or where it lives? Type it your own way: “exposure”, “peaking”, “timelapse”. The app knows what Sony calls it and shows the exact name, the menu path and what it does. If a word can mean different things, it asks what you mean.", "¿No recuerdas cómo se llama una opción o dónde está? Escríbela a tu manera: «exposición», «peaking», «timelapse». La aplicación sabe cómo la llama Sony y te muestra el nombre exacto, la ruta del menú y para qué sirve. Si una palabra puede entenderse de varias formas, te pregunta a cuál te refieres.", "Vous ne vous souvenez plus du nom d’une option ni de son emplacement ? Écrivez-le à votre façon : « exposition », « peaking », « timelapse ». L’application sait comment Sony l’appelle et affiche le nom exact, le chemin dans le menu et son rôle. Si un mot a plusieurs sens, elle demande lequel.", "Wissen Sie den Namen eines Menüpunkts oder seinen Ort nicht mehr? Schreiben Sie es auf Ihre Weise: „Belichtung“, „Peaking“, „Zeitraffer“. Die App weiß, wie Sony es nennt, und zeigt den genauen Namen, den Menüpfad und die Funktion. Ist ein Wort mehrdeutig, fragt sie nach.", "Não lembra como se chama um item ou onde ele fica? Escreva do seu jeito: «exposição», «peaking», «timelapse». O aplicativo sabe como a Sony chama isso e mostra o nome exato, o caminho no menu e para que serve. Se a palavra tiver mais de um sentido, ele pergunta qual você quer dizer.", "Non ricordi come si chiama una voce o dove si trova? Scrivila a modo tuo: «esposizione», «peaking», «timelapse». L’app sa come la chiama Sony e mostra il nome esatto, il percorso nel menu e a cosa serve. Se una parola ha più significati, ti chiede quale intendi.", "Bir öğenin adını veya yerini hatırlamıyor musunuz? Kendi bildiğiniz gibi yazın: «pozlama», «peaking», «timelapse». Uygulama Sony’nin ona ne dediğini bilir; tam adını, menü yolunu ve ne işe yaradığını gösterir. Kelime birden çok anlama geliyorsa neyi kastettiğinizi sorar."], "f2t": ["📷 Настройки для фото", "📷 Photo settings", "📷 Ajustes para foto", "📷 Réglages photo", "📷 Einstellungen für Foto", "📷 Ajustes para foto", "📷 Impostazioni foto", "📷 Fotoğraf ayarları"], "f2d": ["Ответь на несколько вопросов о съёмке (портрет, пейзаж, спорт, ночь…) и получи готовый набор настроек. Для каждого шага приложение показывает путь по меню камеры, точные значения и объясняет, зачем они нужны.", "Answer a few questions about what you shoot (portrait, landscape, sport, night…) and get a ready set of settings. For every step the app shows the camera menu path, the exact values and why they matter.", "Responde unas preguntas sobre lo que fotografías (retrato, paisaje, deporte, noche…) y recibe un conjunto de ajustes listo. En cada paso la aplicación muestra la ruta del menú, los valores exactos y para qué sirven.", "Répondez à quelques questions sur votre sujet (portrait, paysage, sport, nuit…) et obtenez un jeu de réglages prêt à l’emploi. À chaque étape, l’application indique le chemin dans le menu, les valeurs exactes et leur utilité.", "Beantworten Sie ein paar Fragen zu Ihrem Motiv (Porträt, Landschaft, Sport, Nacht …) und erhalten Sie fertige Einstellungen. Bei jedem Schritt zeigt die App den Menüpfad, die genauen Werte und wozu sie dienen.", "Responda algumas perguntas sobre o que você fotografa (retrato, paisagem, esporte, noite…) e receba um conjunto de ajustes pronto. A cada passo o aplicativo mostra o caminho no menu, os valores exatos e para que servem.", "Rispondi ad alcune domande su ciò che fotografi (ritratto, paesaggio, sport, notte…) e ottieni un set di impostazioni pronto. Ad ogni passo l’app mostra il percorso nel menu, i valori esatti e a cosa servono.", "Ne çektiğinize dair birkaç soruyu yanıtlayın (portre, manzara, spor, gece…) ve hazır bir ayar seti alın. Uygulama her adımda kamera menü yolunu, tam değerleri ve neden gerekli olduklarını gösterir."], "f3t": ["🎬 Настройки для видео", "🎬 Video settings", "🎬 Ajustes para vídeo", "🎬 Réglages vidéo", "🎬 Einstellungen für Video", "🎬 Ajustes para vídeo", "🎬 Impostazioni video", "🎬 Video ayarları"], "f3d": ["То же самое для видео: формат и частота кадров, профиль (в том числе S-Log3), баланс белого, ISO, стабилизация, помощь при фокусировке (пикинг, зебра) и всё остальное.", "The same for video: format and frame rate, profile (including S-Log3), white balance, ISO, stabilization, focus aids (peaking, zebra) and the rest.", "Lo mismo para vídeo: formato y fotogramas, perfil (incluido S-Log3), balance de blancos, ISO, estabilización, ayudas de enfoque (peaking, zebra) y el resto.", "Même principe pour la vidéo : format et cadence, profil (dont S-Log3), balance des blancs, ISO, stabilisation, aides à la mise au point (peaking, zebra) et le reste.", "Dasselbe für Video: Format und Bildrate, Profil (auch S-Log3), Weißabgleich, ISO, Stabilisierung, Fokushilfen (Peaking, Zebra) und alles Übrige.", "O mesmo para vídeo: formato e taxa de quadros, perfil (inclusive S-Log3), balanço de branco, ISO, estabilização, auxílios de foco (peaking, zebra) e o resto.", "Lo stesso per il video: formato e frame rate, profilo (anche S-Log3), bilanciamento del bianco, ISO, stabilizzazione, aiuti alla messa a fuoco (peaking, zebra) e il resto.", "Video için de aynısı: format ve kare hızı, profil (S-Log3 dahil), beyaz dengesi, ISO, sabitleme, odak yardımcıları (peaking, zebra) ve diğerleri."], "f4t": ["💾 Сценарии и карта камеры", "💾 Scenarios and the camera card", "💾 Escenarios y tarjeta de la cámara", "💾 Scénarios et carte de l’appareil", "💾 Szenarien und Kamerakarte", "💾 Cenários e cartão da câmera", "💾 Scenari e scheda della fotocamera", "💾 Senaryolar ve kamera kartı"], "f4d": ["Готовый сценарий можно сохранить в память приложения (работает офлайн) и записать на карту камеры файлом настроек. Камера загрузит его сама, перезапустится и применит настройки. И обратно: понравившийся сетап с камеры можно сохранить на карту, загрузить в приложение на компьютере и оставить как свой сценарий.\n\nПриложение одинаково работает на телефоне и на компьютере. Можно спокойно подготовить свои сценарии дома на компьютере, перенести их на камеру через карту — и потом пользоваться ими на съёмке со смартфона, без интернета.", "A finished scenario can be saved in the app (it works offline) and written to the camera card as a settings file. The camera loads it, restarts and applies the settings. And the other way round: a setup you like on the camera can be saved to the card, loaded into the app on your computer and kept as your own scenario.\n\nThe app works the same on a phone and on a computer. You can prepare your scenarios at home on the computer, move them to the camera on the memory card, and then use them on a shoot from your phone, with no internet.", "Un escenario terminado puede guardarse en la aplicación (funciona sin conexión) y grabarse en la tarjeta de la cámara como archivo de ajustes. La cámara lo carga, se reinicia y aplica los ajustes. Y al revés: un ajuste que te guste en la cámara puedes guardarlo en la tarjeta, cargarlo en la aplicación en el ordenador y conservarlo como escenario propio.\n\nLa aplicación funciona igual en el móvil y en el ordenador. Puede preparar sus escenarios en casa en el ordenador, pasarlos a la cámara con la tarjeta y luego usarlos en la sesión desde el móvil, sin internet.", "Un scénario terminé peut être enregistré dans l’application (hors ligne) et écrit sur la carte de l’appareil sous forme de fichier de réglages. L’appareil le charge, redémarre et applique les réglages. Et inversement : un réglage qui vous plaît peut être enregistré sur la carte, chargé dans l’application sur l’ordinateur et conservé comme scénario personnel.\n\nL’application fonctionne de la même façon sur téléphone et sur ordinateur. Vous pouvez préparer vos scénarios chez vous sur l’ordinateur, les transférer vers l’appareil via la carte, puis les utiliser en tournage depuis votre téléphone, sans internet.", "Ein fertiges Szenario lässt sich in der App speichern (funktioniert offline) und als Einstellungsdatei auf die Kamerakarte schreiben. Die Kamera lädt es, startet neu und übernimmt die Einstellungen. Und umgekehrt: Eine Einstellung, die Ihnen an der Kamera gefällt, können Sie auf die Karte speichern, am Computer in die App laden und als eigenes Szenario behalten.\n\nDie App funktioniert auf Handy und Computer gleich. Sie können Ihre Szenarien zu Hause am Computer vorbereiten, über die Karte auf die Kamera übertragen und sie dann beim Dreh am Handy nutzen — ohne Internet.", "Um cenário pronto pode ser salvo no aplicativo (funciona offline) e gravado no cartão da câmera como arquivo de ajustes. A câmera o carrega, reinicia e aplica os ajustes. E o inverso: um ajuste de que você gostou na câmera pode ser salvo no cartão, carregado no aplicativo no computador e mantido como cenário próprio.\n\nO aplicativo funciona igual no celular e no computador. Você pode preparar seus cenários em casa no computador, passá-los para a câmera pelo cartão e depois usá-los na filmagem pelo celular, sem internet.", "Uno scenario pronto può essere salvato nell’app (funziona offline) e scritto sulla scheda della fotocamera come file di impostazioni. La fotocamera lo carica, si riavvia e applica le impostazioni. E viceversa: un’impostazione che ti piace sulla fotocamera può essere salvata sulla scheda, caricata nell’app sul computer e conservata come scenario personale.\n\nL’app funziona allo stesso modo su telefono e su computer. Puoi preparare i tuoi scenari a casa sul computer, trasferirli sulla fotocamera con la scheda e poi usarli sul set dal telefono, senza internet.", "Hazır bir senaryo uygulamada saklanabilir (çevrimdışı çalışır) ve ayar dosyası olarak kamera kartına yazılabilir. Kamera onu yükler, yeniden başlar ve ayarları uygular. Tersi de olur: kamerada beğendiğiniz bir ayarı karta kaydedip bilgisayardaki uygulamaya yükleyebilir ve kendi senaryonuz olarak saklayabilirsiniz.\n\nUygulama telefonda ve bilgisayarda aynı şekilde çalışır. Senaryolarınızı evde bilgisayarda hazırlayıp kartla kameraya aktarabilir, sonra çekimde telefonunuzdan internetsiz kullanabilirsiniz."], "howh": ["Как пользоваться", "How to use it", "Cómo usarla", "Comment l’utiliser", "So geht’s", "Como usar", "Come usarla", "Nasıl kullanılır"], "how": ["Ищешь пункт — используй поиск. Хочешь настроить камеру под задачу — выбери режим съёмки: настройки для фото или для видео, и ответь на вопросы. Просматривай шаги: путь по меню показан как в камере. В конце сохрани сценарий или запиши его на карту.", "Looking for an item? Use the search. Want to set the camera up for a task? Choose the shooting mode — settings for photo or for video — and answer the questions. Go through the steps: the menu path is shown as in the camera. At the end, save the scenario or write it to the card.", "¿Buscas una opción? Usa la búsqueda. ¿Quieres preparar la cámara para una tarea? Elige el modo de disparo: ajustes para foto o para vídeo, y responde las preguntas. Recorre los pasos: la ruta del menú aparece como en la cámara. Al final guarda el escenario o grábalo en la tarjeta.", "Vous cherchez une option ? Utilisez la recherche. Vous voulez régler l’appareil pour une tâche ? Choisissez le mode de prise de vue : réglages pour la photo ou pour la vidéo, puis répondez aux questions. Parcourez les étapes : le chemin dans le menu est affiché comme sur l’appareil. À la fin, enregistrez le scénario ou écrivez-le sur la carte.", "Sie suchen einen Punkt? Nutzen Sie die Suche. Sie möchten die Kamera für eine Aufgabe einrichten? Wählen Sie den Aufnahmemodus — Einstellungen für Foto oder für Video — und beantworten Sie die Fragen. Gehen Sie die Schritte durch: der Menüpfad steht so wie in der Kamera. Am Ende speichern Sie das Szenario oder schreiben es auf die Karte.", "Procura um item? Use a busca. Quer preparar a câmera para uma tarefa? Escolha o modo de captura: ajustes para foto ou para vídeo, e responda às perguntas. Percorra os passos: o caminho no menu aparece como na câmera. No fim, salve o cenário ou grave-o no cartão.", "Cerchi una voce? Usa la ricerca. Vuoi preparare la fotocamera per un compito? Scegli il modo di ripresa: impostazioni per foto o per video, e rispondi alle domande. Scorri i passi: il percorso nel menu è mostrato come sulla fotocamera. Alla fine salva lo scenario o scrivilo sulla scheda.", "Bir öğe mi arıyorsunuz? Aramayı kullanın. Kamerayı bir iş için mi ayarlamak istiyorsunuz? Çekim modunu seçin: fotoğraf veya video ayarları, ve soruları yanıtlayın. Adımları izleyin: menü yolu kameradaki gibi gösterilir. Sonunda senaryoyu kaydedin veya karta yazın."], "dish": ["Важно знать", "Good to know", "Conviene saber", "Bon à savoir", "Wichtig zu wissen", "Importante saber", "Da sapere", "Bilmeniz gerekenler"], "dis": ["Приложение неофициальное и никак не связано с компанией Sony. Названия и пути меню проверялись для Sony A6700 с прошивкой 2.00; на других прошивках и моделях они могут отличаться. Файл настроек CAMSETXX.DAT заменяет файл с тем же номером на карте и перезапускает камеру при загрузке; перед использованием сохрани копию нужных файлов. Не записываются: пресеты баланса белого, замер, экспокоррекция, выдержка и диафрагма. Используй на свой риск.", "The app is unofficial and not affiliated with Sony. Menu names and paths were checked for the Sony A6700 with firmware 2.00; other firmware versions and models may differ. A settings file CAMSETXX.DAT replaces the file with the same number on the card and restarts the camera when loaded — keep a copy of files you need. Not written: white balance presets, metering, exposure compensation, shutter speed and aperture. Use at your own risk.", "La aplicación no es oficial y no está vinculada a Sony. Los nombres y rutas del menú se comprobaron en la Sony A6700 con firmware 2.00; en otros firmwares y modelos pueden variar. Un archivo de ajustes CAMSETXX.DAT sustituye al archivo con el mismo número en la tarjeta y reinicia la cámara al cargarse; guarda una copia de los archivos que necesites. No se graban: preajustes de balance de blancos, medición, compensación de exposición, velocidad de obturación y diafragma. Úsala bajo tu propia responsabilidad.", "L’application est non officielle et sans lien avec Sony. Les noms et chemins du menu ont été vérifiés sur le Sony A6700 avec le firmware 2.00 ; ils peuvent différer sur d’autres firmwares et modèles. Un fichier de réglages CAMSETXX.DAT remplace le fichier du même numéro sur la carte et redémarre l’appareil au chargement ; conservez une copie des fichiers dont vous avez besoin. Ne sont pas écrits : préréglages de balance des blancs, mesure, correction d’exposition, vitesse et ouverture. Utilisation à vos risques.", "Die App ist inoffiziell und steht in keiner Verbindung zu Sony. Menünamen und -pfade wurden für die Sony A6700 mit Firmware 2.00 geprüft; bei anderen Firmwares und Modellen können sie abweichen. Eine Einstellungsdatei CAMSETXX.DAT ersetzt die Datei mit derselben Nummer auf der Karte und startet die Kamera beim Laden neu; sichern Sie benötigte Dateien vorher. Nicht geschrieben werden: Weißabgleich-Presets, Messung, Belichtungskorrektur, Verschlusszeit und Blende. Nutzung auf eigene Gefahr.", "O aplicativo não é oficial e não tem ligação com a Sony. Os nomes e caminhos do menu foram verificados na Sony A6700 com firmware 2.00; em outros firmwares e modelos podem variar. Um arquivo de ajustes CAMSETXX.DAT substitui o arquivo de mesmo número no cartão e reinicia a câmera ao ser carregado; guarde uma cópia dos arquivos de que precisa. Não são gravados: predefinições de balanço de branco, medição, compensação de exposição, velocidade e abertura. Use por sua conta e risco.", "L’app non è ufficiale e non è legata a Sony. Nomi e percorsi del menu sono stati verificati sulla Sony A6700 con firmware 2.00; su altri firmware e modelli possono differire. Un file di impostazioni CAMSETXX.DAT sostituisce il file con lo stesso numero sulla scheda e riavvia la fotocamera al caricamento; conserva una copia dei file che ti servono. Non vengono scritti: preset del bilanciamento del bianco, misurazione, compensazione dell’esposizione, tempo e diaframma. Uso a proprio rischio.", "Uygulama resmî değildir ve Sony ile bağlantılı değildir. Menü adları ve yolları, 2.00 yazılımlı Sony A6700 için kontrol edilmiştir; diğer yazılım sürümlerinde ve modellerde farklı olabilir. CAMSETXX.DAT ayar dosyası kartta aynı numaralı dosyanın yerine geçer ve yüklenirken kamerayı yeniden başlatır; ihtiyacınız olan dosyaların bir kopyasını saklayın. Yazılmayanlar: beyaz dengesi hazır ayarları, ölçüm, pozlama telafisi, enstantane ve diyafram. Kullanım sorumluluğu size aittir."], "next": ["Далее", "Next", "Siguiente", "Suivant", "Weiter", "Avançar", "Avanti", "İleri"], "back": ["Назад", "Back", "Atrás", "Retour", "Zurück", "Voltar", "Indietro", "Geri"], "start": ["Начать", "Start", "Empezar", "Commencer", "Los geht’s", "Começar", "Inizia", "Başla"], "never": ["Больше не показывать", "Don’t show again", "No volver a mostrar", "Ne plus afficher", "Nicht mehr anzeigen", "Não mostrar de novo", "Non mostrare più", "Bir daha gösterme"], "about": ["О приложении", "About the app", "Acerca de la aplicación", "À propos de l’application", "Über die App", "Sobre o aplicativo", "Informazioni sull’app", "Uygulama hakkında"], "aboutS": ["вступление, возможности, важно знать", "introduction, features, good to know", "introducción, funciones, conviene saber", "introduction, fonctions, bon à savoir", "Einführung, Funktionen, Wichtiges", "introdução, recursos, importante saber", "introduzione, funzioni, da sapere", "giriş, özellikler, bilmeniz gerekenler"], "f0t": ["🎒 Сначала — моё оснащение", "🎒 First — my gear", "🎒 Primero: mi equipo", "🎒 D’abord : mon matériel", "🎒 Zuerst: meine Ausrüstung", "🎒 Primeiro: meu equipamento", "🎒 Prima: la mia attrezzatura", "🎒 Önce: ekipmanım"], "f0d": ["Один раз занеси в список всё, что у тебя есть: объективы, ND-фильтры, свет, стабилизатор и прочие принадлежности. Потом для каждого сетапа их нужно просто выбирать из списка, а не искать в меню и не вспоминать характеристики.\n\nЕсли твоего объектива нет в списке — добавь его сам: название, фокусное расстояние (от и до, если это зум), светосилу F, и отметь, есть ли стабилизатор и автофокус. Дальше он будет в списке наравне с остальными, и приложение посчитает по нему выдержку, диафрагму и ISO.", "Enter everything you own into the list once: lenses, ND filters, lights, gimbal and other accessories. After that, for every setup you simply pick them from the list instead of hunting through menus or recalling specs.\n\nIf your lens is not in the list, add it yourself: name, focal length (from and to for a zoom), maximum aperture F, and tick whether it has a stabiliser and autofocus. From then on it sits in the list like any other, and the app computes shutter, aperture and ISO from it.", "Anota una sola vez todo lo que tienes: objetivos, filtros ND, luces, estabilizador y demás accesorios. Después, para cada ajuste, solo tienes que elegirlos de la lista, sin buscar en los menús ni recordar características.\n\nSi su objetivo no está en la lista, añádalo usted mismo: nombre, distancia focal (de y hasta, si es un zoom), luminosidad F y marque si tiene estabilizador y autofoco. Después aparece en la lista como los demás y la aplicación calcula con él la obturación, el diafragma y el ISO.", "Saisissez une seule fois tout ce que vous possédez : objectifs, filtres ND, éclairages, stabilisateur et autres accessoires. Ensuite, pour chaque réglage, il suffit de les choisir dans la liste, sans fouiller les menus ni retrouver les caractéristiques.\n\nSi votre objectif n’est pas dans la liste, ajoutez-le vous-même : nom, focale (de et à pour un zoom), ouverture maximale F, et cochez s’il a un stabilisateur et l’autofocus. Il figure ensuite dans la liste comme les autres, et l’application calcule avec lui vitesse, ouverture et ISO.", "Tragen Sie einmalig alles ein, was Sie besitzen: Objektive, ND-Filter, Licht, Gimbal und anderes Zubehör. Danach wählen Sie es für jedes Setup einfach aus der Liste, statt in Menüs zu suchen oder Daten nachzuschlagen.\n\nFehlt Ihr const INTRO_KEY = 'a6700-intro-v1';
function itx(k){ const i = ['ru','en','es','fr','de','pt','it','tr'].indexOf(appLang); return INTRO_T[k][i<0?1:i]; }
let introPage = 1, introNever = false;
function introSeen(){ try{ return localStorage.getItem(INTRO_KEY)==='1'; }catch(e){ return false; } }
function openIntro(){ introPage = 1; introNever = introSeen(); introRender(); }
function introNeverTog(c){ introNever = !!c; }
function introGo(n){ introPage = n; introRender(); const sc = document.querySelector('#intro .in-sc'); if(sc) sc.scrollTop = 0; }
function introClose(){
  try{ if(introNever) localStorage.setItem(INTRO_KEY,'1'); else localStorage.removeItem(INTRO_KEY); }catch(e){}

      + `<h2>${e('howh')}</h2><p>${e('how')}</p>`
      + `<div class="in-dis"><h2 style="margin-top:0">${e('dish')}</h2><p>${e('dis')}</p>`
      + `<p style="margin-top:9px">${e('devH')}: Yellowlobster</p></div>`;

        <div class="scn-s">${top?'<span class="topb">'+R('чаще всего','most used')+'</span> ':''}${R('запусков','runs')}: ${s.count||0} · ${R('последний','last')}: ${fmtDate(s.last)}${s.mr?` · <b>MR ${s.mr}</b>`:''}</div>
      </div>
      <div class="scn-bar">
        <span class="scn-run" onclick="runScen('${s.id}')">▶ ${R('Запустить','Run')}</span>
        <span class="scn-a" onclick="editScen('${s.id}')">✎</span>
        <span class="scn-a" onclick="askDelScen('${s.id}')">🗑</span>
      </div>
      <div class="scn-mr"><span class="scn-mrl">MR</span>${mrChips(s)}</div>
    </div>`;
  }).join('');
  h += camHtml();
  h += `<div class="sect-h">${R('Резервная копия','Backup')}</div>
    <div class="sect-note">${R('Всё хранится только на этом устройстве, сеть не нужна. Очистка данных браузера сотрёт сценарии и оснащение — сохраните копию в файл.','Everything is stored on this device only; no network needed. Clearing browser data wipes scenarios and gear — keep a copy in a file.')}</div>

    <input type="file" id="impF" accept=".json,application/json" style="display:none" onchange="importMY(this)">`;

  if(scenEdit){ const el=document.getElementById('ren_'+scenEdit); if(el){ el.focus(); el.select(); } }
  const bot=document.getElementById('bot'); bot.style.display='flex';
  bot.innerHTML = `<button class="btn btn-pri" style="flex:1" onclick="navBack()">${t().done}</button>`;
}
/* сохранить то, что набрано в открытом поле, ничего не перерисовывая */
function commitScenName(){
  if(!scenEdit) return;
  const el=document.getElementById('ren_'+scenEdit);
  if(!el) return;
  const v=el.value.trim(), s=scenById(scenEdit);
  if(s && v) s.name=v;
}
function editScen(id){
  commitScenName();
  scenEdit = (scenEdit===id) ? null : id;   /* повторное нажатие закрывает поле */
  saveMY(); renderMyScen();
}
/* уход фокуса только сохраняет: перерисовка здесь съедала нажатие по следующей иконке */
function renameScen(id,v){ const s=scenById(id); if(s && v.trim()) s.name=v.trim(); saveMY(); }
function scenDone(id,v){ renameScen(id,v); scenEdit=null; renderMyScen(); }
function askDelScen(id){
  commitScenName(); saveMY();
  const s=scenById(id); if(!s) return;
  showModal(R('Удалить сценарий?','Delete scenario?'), esc(s.name), R('Удалить','Delete'), R('Отмена','Cancel'),
    ()=>{ MY.scen=MY.scen.filter(x=>x.id!==id); if(activeScen===id) activeScen=null; saveMY(); render(); }, null);
}
function exportMY(){
  try{
    const blob = new Blob([JSON.stringify({app:'a6700-setup', v:1, saved:new Date().toISOString(), my:MY}, null, 1)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'a6700-my-setup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }catch(e){}
}
function importMY(inp){
  const f = inp.files && inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    let d=null; try{ d = JSON.parse(rd.result); }catch(e){}
    inp.value='';
    if(!d || d.app!=='a6700-setup' || !d.my){ showModal(R('Не тот файл','Wrong file'), R('Это не копия данных этого приложения.','This is not a backup from this app.'), 'OK', R('Закрыть','Close'), null, null); return; }
    showModal(R('Заменить данные?','Replace data?'),
      R(`В файле: объективов ${(d.my.lenses||[]).length}, сценариев ${(d.my.scen||[]).length}. Текущие оснащение и сценарии будут заменены.`,
        `File has ${(d.my.lenses||[]).length} lenses and ${(d.my.scen||[]).length} scenarios. Current gear and scenarios will be replaced.`),
      R('Заменить','Replace'), R('Отмена','Cancel'),
      ()=>{ MY = Object.assign(blankMY(), d.my); MY.use = Object.assign({lens:{},gear:{}}, MY.use||{}); MY.setupDone=true; saveMY(); mergeCustom(); render(); }, null);
  };
  rd.readAsText(f);
}

function splashExtra(html, has){
  const first = !MY.setupDone && !has && !MY.lenses.length && !MY.scen.length;
  if(first){
    html = `<button class="sp-btn primary" id="spSetup">${esc(spT('setup'))}</button>`
         + html.replace('sp-btn primary" id="spNew"', 'sp-btn ghost" id="spNew"')
               .replace('>'+esc(spT('start'))+'<', '>'+esc(spT('skip'))+'<')
         + `<div class="sp-note">${esc(spT('setupNote'))}</div>`;
  }

}

}

function ambigFind(qfull){
  const qn = String(qfull||'').replace(/\s+/g,'');
  if(qn.length<3) return null;
  for(const c of AMBIG){
    for(const lang of ['ru','en','es']){
      const arr = c.trig[lang]||[];
      for(const w of arr){ const wn = fnorm(w).replace(/\s+/g,''); if(wn && qn.includes(wn)) return c; }
    }
  }
  return null;
}
function ambigLbl(o){ return o[appLang] || o.ru || o.en; }
function ambigCard(c){
  return `<div class="fask">${esc(ambigLbl(c.explain))}</div>`
    + `<div class="fpop" style="padding-top:0">${c.sides.map((s,i)=>`<span class="fp" onclick="findPickSide('${c.id}',${i})">${esc(ambigLbl(s.label))}</span>`).join('')}</div>`;
}
function noteCard(c){ return `<div class="fnn" style="margin:10px 12px 0;border-radius:9px">${esc(ambigLbl(c.explain))}</div>`; }
function findPickSide(cid, si){
  const c = AMBIG.find(a=>a.id===cid); if(!c) return;
  const s = c.sides[si]; if(!s) return;
  if(s.info){ showSheet(R('Пояснение','Explanation','Explicación'), ambigLbl(s.label), `<div class="sh-gap">${esc(ambigLbl(s.info))}</div>`); return; }
  findSet(s.q[appLang] || s.q.ru);
}
function findResultsHtml(){

  }

  }
  const top = res[0];
  let head=ambHtml;
  if(top.kind==='syn' && res.filter(r=>r.kind==='syn').length<=3)
    head += `<div class="fask">${R(`«${esc(q)}» — в меню камеры это называется так. Выберите нужное:`,`“${esc(q)}” — this is what the camera menu calls it. Pick one:`,`«${esc(q)}» — así lo llama el menú de la cámara. Elija el que corresponda:`)}</div>`;
  if(findOpen===null && (res.length===1 || res[0].sc - (res[1]?res[1].sc:0) > 1.2)) findOpen = 0;
  return head + res.map((r,i)=>frow(r,l,i,q)).join('');
}

/* возврат на стартовую страницу: состояние уже сохранено в render(),
   заставка перестраивается заново, поэтому «Продолжить» подхватит текущий сценарий */
function splashBack(e){ if(e){ e.stopPropagation(); e.preventDefault(); } splashStage(0); }
function splashStage(n){
  const sp=document.getElementById('splash'); if(!sp) return;
  sp.dataset.stage = String(n);
  if(n===0){ const h=document.getElementById('spLangs');
             if(h) h.querySelectorAll('.sp-pill').forEach(p=>p.classList.remove('open')); }
}
function goSplash(stage){
  try{ cancelAdvance(); }catch(e){}
  splashStage(stage===1 ? 1 : 0);
  if(page===99) page = (typeof prevPage==='number' ? prevPage : 0);
  else if(page===96) page = (typeof findPrev==='number' ? findPrev : 0);
  try{ saveState(); }catch(e){}
  const sp = document.getElementById('splash');
  if(!sp){ render(); return; }
  sp.style.display = '';
  void sp.offsetWidth;
  sp.className = '';
  if(typeof window.splashBuild==='function') window.splashBuild();
  if(stage===1) splashStage(1);        /* splashBuild мог сбросить этап */
}

const LSKEY='a6700-setup-v3';   // v3: язык по умолчанию для новых пользователей сменён на English — старое сохранённое «ru» из v2 иначе навсегда перекрывало бы новый дефолт
function saveState(){
  try{ localStorage.setItem(LSKEY, JSON.stringify({
    appLang, camLang, sel, manualLens, vndCustom, ledCustom, page, stepIdx, showManualForm, activeScen, lensSkipped
  })); }catch(e){}
}
function loadState(){
  try{ const raw=localStorage.getItem(LSKEY); if(!raw) return null; return JSON.parse(raw); }catch(e){ return null; }
}
function applyState(d, withProgress){
  if(!d) return;
  if(d.appLang) appLang=d.appLang;
  if(d.camLang) camLang=d.camLang;
  if(!withProgress) return;
  if(d.sel) sel=Object.assign({mode:null,lighting:null,subject:null,lens:null,gear:[],profile:null,ndVario:[],ndFixed:[],fps:25,angle:2,ledKind:'var',ledFix:'k5600',ledVar:'v3256',flMode:'ttl',flRole:'fill',flCurt:'first',stN:1,stSecond:'fill',stEvFill:-1.5,stEvRim:0.5,stEvBg:0,stIso:100,stAp:8,stCurt:'first'}, d.sel);
  if(d.manualLens) manualLens=d.manualLens;
  if(d.vndCustom) vndCustom=d.vndCustom;
  if(d.ledCustom) ledCustom=d.ledCustom;
  showManualForm=!!d.showManualForm; activeScen=d.activeScen||null; lensSkipped=!!d.lensSkipped;
  page=typeof d.page==='number'?d.page:0; stepIdx=d.stepIdx||0;
  if(page>=96) page=0;
  if(page>=NSCR) steps=buildSteps();
  if(page===NSCR && stepIdx>steps.length-1) stepIdx=Math.max(0,steps.length-1);
}

/* wrap render so every state change is persisted */
const _render = render;
render = function(){
  try { _render(); }
  catch(e){
    /* аварийный откат: возвращаем рабочий экран вместо пустого */
    try{
      page = Math.min(page, NSCR-1); stepIdx = 0; steps = [];
      _render();
    }catch(e2){}
  }
  saveState();
};

/* на каждый шаг вперёд кладём метку в историю; кнопка «Назад» — и системная,
   и экранная — снимает её через history.back(), поэтому глубины всегда совпадают */
let guards = 0;
function pushGuard(){ try{ history.pushState({app:1},''); guards++; }catch(e){} }
function syncHistory(){}          // больше не нужна, оставлена чтобы не ломать вызовы

let backPending = false;
function navBack(){
  if(backPending) return;           // защита от частых тапов: history.back() срабатывает не мгновенно
  cancelAdvance();
  if(guards>0){ backPending = true; history.back(); }
  else { goBack(); }
}
try{
  window.addEventListener('popstate', function(){
    backPending = false;
    if(guards>0) guards--;
    cancelAdvance();
    const m=document.getElementById('modal');
    if(sheetOpen){ hideSheet(); return; }
    if(m && m.innerHTML){ closeModal(false); return; }
    goBack();
  });
}catch(e){}

    if(uspEl) uspEl.innerHTML = spUspHtml();
  }catch(e){}

  const sp = document.getElementById('splash');
  const box = document.getElementById('spBtns');

  const close = () => {
    /* одна запись в истории на вход в приложение: системная кнопка «назад»
       на первом шаге вернёт на стартовый экран, а не уведёт со страницы */
    pushGuard();
    if(!introSeen() && !document.getElementById('intro')) setTimeout(openIntro, 300);
    sp.className = 'gone';
    setTimeout(() => { try { sp.style.display = 'none'; } catch(e){} }, 500);
  };
  /* обложка: касание в любом месте (кроме пилюль) открывает второй экран */
  if(!sp.dataset.tapBound){
    sp.dataset.tapBound = '1';
    sp.addEventListener('click', e => {
      if(sp.dataset.stage !== '0') return;
      if(e.target.closest('.sp-langs')) return;
      splashStage(1);
    });
  }

  let html = '';
  if (has) {
    const parts = [];
    if (saved.sel.mode)     { const o = MODE_OPTS.find(x=>x.id===saved.sel.mode); if(o) parts.push(txt(o,0)); }
    if (saved.sel.lighting) { const o = LIGHTING.find(x=>x.id===saved.sel.lighting); if(o) parts.push(txt(o,0)); }
    if (saved.sel.subject)  { const o = SUBJECT.find(x=>x.id===saved.sel.subject);   if(o) parts.push(txt(o,0)); }
    html += `<button class="sp-btn primary" id="spResume">${esc(spT('resume'))}</button>`;
    html += `<button class="sp-btn ghost"   id="spNew">${esc(spT('newScen'))}</button>`;
    if (parts.length) html += `<div class="sp-note">${parts.join(' · ')}</div>`;
  } else {
    html += `<button class="sp-btn primary" id="spNew">${esc(spT('start'))}</button>`;
  }
  html = splashExtra(html, has);
  box.innerHTML = html;

  const resume = document.getElementById('spResume');
  if (resume) resume.addEventListener('click', e => {
    e.stopPropagation(); applyState(saved, true); render(); close();
  });
  document.getElementById('spNew').addEventListener('click', e => {
    e.stopPropagation();
    sel = {mode:null,lighting:null,subject:null,lens:null,gear:[],profile:null,
           ndVario:[],ndFixed:[],fps:25,angle:2,

    page=0; stepIdx=0; steps=[]; prevOpen=false; activeScen=null; lensSkipped=false; lensAll=false;
    MY.setupDone=true; saveMY(); applyMyDefaults();
    render(); close();
  });
    bindSplashExtra(close);
  };
  window.splashBuild();
  render();          // рисуем приложение под заставкой
})();


/* офлайн: без сети приложение всё равно открывается.
   Из локального файла (file://) сервис-воркер не регистрируется — так и надо. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg=>{
      /* проверяем обновление при каждом запуске: новая версия страницы
         подхватится со следующего открытия, «залипания» не будет */
      try{ reg.update(); }catch(e){}
      reg.addEventListener('updatefound', ()=>{
        const w = reg.installing; if(!w) return;
        w.addEventListener('statechange', ()=>{
          if(w.state==='activated' && navigator.serviceWorker.controller) {
            try{ sessionStorage.setItem('a6700-upd','1'); }catch(e){}
          }
        });
      });
    }).catch(()=>{});
  });
}

/* оболочка артефакта строит свой <head>: манифест и иконки подключаем сами */
(function(){
  try{
    const add=(rel,href,extra)=>{ if(document.querySelector('link[rel="'+rel+'"]')) return;
      const l=document.createElement('link'); l.rel=rel; l.href=href;
      if(extra) for(const k in extra) l.setAttribute(k, extra[k]);
      document.head.appendChild(l); };
    add('manifest','manifest.webmanifest');
    add('apple-touch-icon','apple-touch-icon.png');
    add('icon','favicon.png',{sizes:'32x32'});
  }catch(e){}
})();
</script>
